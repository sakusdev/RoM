name: Fix configuration and console

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'agent/finish-rom-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-rom-core
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare verified official 26.1.2 data
        shell: bash
        run: |
          set -euo pipefail
          instance="$RUNNER_TEMP/rom-tag-generation"
          cargo run --quiet --locked --release -p rom-bootstrap -- prepare \
            --instance "$instance" \
            --version 26.1.2 \
            --accept-minecraft-eula \
            --json > prepare.json
          server_jar="$(jq -r '.official_server_jar' prepare.json)"
          listed_path="$(unzip -p "$server_jar" META-INF/versions.list 2>/dev/null | tr -d '\r' | awk -F '\t' 'NF == 3 { print $3; exit }')"
          if [[ "$listed_path" == META-INF/versions/* ]]; then
            inner_path="$listed_path"
          else
            inner_path="META-INF/versions/$listed_path"
          fi
          unzip -p "$server_jar" "$inner_path" > game-server.jar
          mkdir generated-reports
          (
            cd generated-reports
            timeout 900 java -DbundlerMainClass=net.minecraft.data.Main -jar "$server_jar" --reports
          )
          find generated-reports -path '*/reports/registries.json' -type f -print -quit | xargs -r -I{} cp '{}' registries.json
          test -s registries.json
      - name: Generate complete network tag manifest and patch runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import re
          import zipfile
          from pathlib import Path

          TAG_REGISTRIES = [
              'banner_pattern',
              'block',
              'damage_type',
              'dialog',
              'enchantment',
              'entity_type',
              'fluid',
              'game_event',
              'instrument',
              'item',
              'painting_variant',
              'point_of_interest_type',
              'potion',
              'timeline',
              'villager_trade',
              'worldgen/biome',
              'worldgen/configured_feature',
              'worldgen/flat_level_generator_preset',
              'worldgen/structure',
              'worldgen/world_preset',
          ]

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'{label} anchor missing')
              return text.replace(old, new, 1)

          report = json.loads(Path('registries.json').read_text())
          ids: dict[str, dict[str, int]] = {}
          for registry_id, registry in report.items():
              entries = registry.get('entries')
              if not isinstance(entries, dict):
                  continue
              parsed = {}
              for name, record in entries.items():
                  protocol_id = record.get('protocol_id', record.get('protocolId'))
                  if isinstance(protocol_id, int):
                      parsed[name] = protocol_id
              if parsed:
                  ids[registry_id] = parsed

          tag_documents: dict[str, dict[str, dict]] = {
              f'minecraft:{path}': {} for path in TAG_REGISTRIES
          }
          dynamic_entries: dict[str, set[str]] = {
              f'minecraft:{path}': set() for path in TAG_REGISTRIES
          }
          paths_by_length = sorted(TAG_REGISTRIES, key=len, reverse=True)

          with zipfile.ZipFile('game-server.jar') as archive:
              for name in archive.namelist():
                  if not name.endswith('.json') or not name.startswith('data/'):
                      continue
                  parts = name.split('/')
                  if len(parts) < 4:
                      continue
                  namespace = parts[1]
                  relative = '/'.join(parts[2:])
                  if relative.startswith('tags/'):
                      relative = relative[len('tags/'):]
                      registry_path = next(
                          (path for path in paths_by_length if relative.startswith(path + '/')),
                          None,
                      )
                      if registry_path is None:
                          continue
                      tag_path = relative[len(registry_path) + 1:-5]
                      tag_name = f'{namespace}:{tag_path}'
                      registry_id = f'minecraft:{registry_path}'
                      document = json.loads(archive.read(name))
                      if tag_name in tag_documents[registry_id]:
                          raise SystemExit(f'duplicate tag resource {registry_id} {tag_name}')
                      tag_documents[registry_id][tag_name] = document
                      continue

                  registry_path = next(
                      (path for path in paths_by_length if relative.startswith(path + '/')),
                      None,
                  )
                  if registry_path is None:
                      continue
                  resource_path = relative[len(registry_path) + 1:-5]
                  if resource_path and not resource_path.startswith('tags/'):
                      dynamic_entries[f'minecraft:{registry_path}'].add(
                          f'{namespace}:{resource_path}'
                      )

          for registry_id in tag_documents:
              if registry_id not in ids:
                  entries = sorted(dynamic_entries[registry_id])
                  if not entries:
                      raise SystemExit(f'cannot derive protocol IDs for {registry_id}')
                  ids[registry_id] = {name: index for index, name in enumerate(entries)}

          resolved: dict[str, list[tuple[str, list[int]]]] = {}
          for registry_id, documents in tag_documents.items():
              cache: dict[str, list[int]] = {}
              visiting: set[str] = set()

              def resolve(tag_name: str) -> list[int]:
                  if tag_name in cache:
                      return cache[tag_name]
                  if tag_name in visiting:
                      raise SystemExit(f'cyclic tag reference in {registry_id}: {tag_name}')
                  document = documents.get(tag_name)
                  if document is None:
                      raise SystemExit(f'missing tag reference in {registry_id}: {tag_name}')
                  visiting.add(tag_name)
                  values = document.get('values', [])
                  if not isinstance(values, list):
                      raise SystemExit(f'invalid tag values in {registry_id}: {tag_name}')
                  output: list[int] = []
                  seen: set[int] = set()
                  for value in values:
                      if not isinstance(value, str):
                          raise SystemExit(f'unsupported non-string tag value in {tag_name}')
                      if value.startswith('#'):
                          nested = value[1:]
                          if ':' not in nested:
                              nested = f'minecraft:{nested}'
                          entries = resolve(nested)
                      else:
                          entry = value if ':' in value else f'minecraft:{value}'
                          try:
                              entries = [ids[registry_id][entry]]
                          except KeyError as error:
                              raise SystemExit(
                                  f'missing registry entry {registry_id} {entry} referenced by {tag_name}'
                              ) from error
                      for protocol_id in entries:
                          if protocol_id not in seen:
                              seen.add(protocol_id)
                              output.append(protocol_id)
                  visiting.remove(tag_name)
                  cache[tag_name] = output
                  return output

              resolved[registry_id] = [
                  (tag_name, resolve(tag_name)) for tag_name in sorted(documents)
              ]

          canonical = [
              {
                  'registry': registry_id,
                  'tags': [
                      {'name': name, 'entries': entries}
                      for name, entries in resolved[registry_id]
                  ],
              }
              for registry_id in sorted(resolved)
          ]
          digest = hashlib.sha256(
              json.dumps(canonical, separators=(',', ':'), sort_keys=True).encode()
          ).hexdigest()
          registry_count = len(canonical)
          tag_count = sum(len(record['tags']) for record in canonical)
          entry_count = sum(
              len(tag['entries']) for record in canonical for tag in record['tags']
          )
          if (registry_count, tag_count, entry_count) != (20, 758, 8196):
              raise SystemExit(
                  f'unexpected tag manifest counts: {registry_count}, {tag_count}, {entry_count}'
              )

          lines = [
              '//! Generated Minecraft Java Edition 26.1.2 network tag manifest.',
              '//!',
              '//! Source tag JSON and registry IDs come from the SHA-1-verified official',
              '//! 26.1.2 server artifact. Integer entries are the protocol registry IDs',
              '//! consumed by `ClientboundUpdateTagsPacket`.',
              '',
              'use ferrum_configuration::{TagEntry, TagRegistry};',
              '',
              f'pub const TAG_REGISTRY_COUNT: usize = {registry_count};',
              f'pub const TAG_COUNT: usize = {tag_count};',
              f'pub const TAG_ENTRY_COUNT: usize = {entry_count};',
              f'pub const TAG_MANIFEST_SHA256: &str = "{digest}";',
              '',
              '#[must_use]',
              'pub fn configuration_tags() -> Vec<TagRegistry> {',
              '    vec![',
          ]
          for record in canonical:
              lines.append(f'        TagRegistry::new("{record["registry"]}", vec![')
              for tag in record['tags']:
                  values = ', '.join(str(value) for value in tag['entries'])
                  lines.append(
                      f'            TagEntry::new("{tag["name"]}", vec![{values}]),'
                  )
              lines.append('        ]),')
          lines.extend([
              '    ]',
              '}',
              '',
              '#[cfg(test)]',
              'mod tests {',
              '    use super::*;',
              '',
              '    #[test]',
              '    fn generated_tag_counts_match_the_manifest() {',
              '        let registries = configuration_tags();',
              '        assert_eq!(registries.len(), TAG_REGISTRY_COUNT);',
              '        assert_eq!(',
              '            registries.iter().map(|registry| registry.tags.len()).sum::<usize>(),',
              '            TAG_COUNT',
              '        );',
              '        assert_eq!(',
              '            registries',
              '                .iter()',
              '                .flat_map(|registry| &registry.tags)',
              '                .map(|tag| tag.entries.len())',
              '                .sum::<usize>(),',
              '            TAG_ENTRY_COUNT',
              '        );',
              '    }',
              '',
              '    #[test]',
              '    fn required_gameplay_tag_registries_are_present() {',
              '        let registries = configuration_tags();',
              '        for id in [',
              '            "minecraft:block",',
              '            "minecraft:item",',
              '            "minecraft:entity_type",',
              '            "minecraft:worldgen/biome",',
              '        ] {',
              '            assert!(registries.iter().any(|registry| registry.id == id));',
              '        }',
              '    }',
              '}',
              '',
          ])
          Path('crates/ferrum-version-26-1-2/src/tags.rs').write_text('\n'.join(lines))

          path = Path('crates/ferrum-version-26-1-2/src/lib.rs')
          text = path.read_text()
          text = replace_once(text, 'mod registries;\n', 'mod registries;\nmod tags;\n', 'tags module')
          export = '''pub use tags::{
              TAG_COUNT, TAG_ENTRY_COUNT, TAG_MANIFEST_SHA256, TAG_REGISTRY_COUNT,
              configuration_tags,
          };
          '''.replace('          ', '')
          if 'pub use tags::{' not in text:
              anchor = '};\n\nuse ferrum_configuration::KnownPack;'
              text = replace_once(text, anchor, '};\n' + export + '\nuse ferrum_configuration::KnownPack;', 'tags export')
          path.write_text(text)

          path = Path('crates/ferrum-server/src/main.rs')
          text = path.read_text()
          text = replace_once(
              text,
              '        let body = encode_tags(&[])?;\n',
              '''        let tags = if config.profile_name.as_deref()
                  == Some(version_26_1_2::PROFILE_NAME)
              {
                  version_26_1_2::configuration_tags()
              } else {
                  Vec::new()
              };
              let body = encode_tags(&tags)?;
          '''.replace('          ', ''),
              'configuration tag payload',
          )
          text = replace_once(
              text,
              '''        assert_eq!(tags_reader.read_varint().unwrap(), 0x0d);
                  assert_eq!(tags_reader.read_varint().unwrap(), 0);
          '''.replace('          ', ''),
              '''        assert_eq!(tags_reader.read_varint().unwrap(), 0x0d);
                  assert_eq!(
                      tags_reader.take_remaining(),
                      encode_tags(&version_26_1_2::configuration_tags())
                          .unwrap()
                          .as_slice()
                  );
          '''.replace('          ', ''),
              'configuration tag test',
          )
          path.write_text(text)

          path = Path('crates/ferrum-game/src/command.rs')
          text = path.read_text()
          text = replace_once(text, 'pub enum GameCommand {\n    List,\n', 'pub enum GameCommand {\n    Help,\n    List,\n', 'help command variant')
          text = replace_once(text, '        ["list"] => Ok(GameCommand::List),\n', '        ["help"] | ["?"] => Ok(GameCommand::Help),\n        ["list"] => Ok(GameCommand::List),\n', 'help parser')
          text = replace_once(text, '        ["stop"] => Ok(GameCommand::Stop),\n', '        ["stop"] | ["exit"] | ["quit"] => Ok(GameCommand::Stop),\n', 'stop aliases')
          help_arm = '''        GameCommand::Help => {
              require_permission(source, 0)?;
              Ok(CommandOutcome {
                  feedback: "Commands: help, list, say <message>, gamemode <mode> [player], tp [player] <x> <y> <z>, give <player> <item> [count], time set <value>, difficulty <value>, gamerule <name> <value>, kill [player], save-all [flush], stop (aliases: exit, quit)".to_owned(),
                  events: Vec::new(),
                  save_requested: false,
                  shutdown_requested: false,
              })
          }
          '''.replace('          ', '')
          text = replace_once(text, '    match command {\n        GameCommand::List => {\n', '    match command {\n' + help_arm + '        GameCommand::List => {\n', 'help execution')
          text = text.replace(
              '#[error("invalid command syntax: {input}")]',
              '#[error("invalid command syntax: {input}; use help to list commands")]',
          )
          text = replace_once(
              text,
              '        assert_eq!(parse_command("/list").unwrap(), GameCommand::List);\n',
              '        assert_eq!(parse_command("help").unwrap(), GameCommand::Help);\n        assert_eq!(parse_command("/list").unwrap(), GameCommand::List);\n',
              'help parser test',
          )
          extra_test = '''
              #[test]
              fn help_lists_commands_and_exit_alias_stops() {
                  let mut state = GameState::default();
                  let source = CommandSource::console();
                  let help = execute_command(&mut state, &source, "help").unwrap();
                  assert!(help.feedback.contains("say <message>"));
                  assert!(!help.shutdown_requested);
                  for alias in ["exit", "quit"] {
                      let outcome = execute_command(&mut state, &source, alias).unwrap();
                      assert!(outcome.save_requested);
                      assert!(outcome.shutdown_requested);
                  }
              }
          '''.replace('          ', '')
          if 'fn help_lists_commands_and_exit_alias_stops()' not in text:
              text = text.replace('\n    #[test]\n    fn stop_requests_save_and_shutdown()', extra_test + '\n    #[test]\n    fn stop_requests_save_and_shutdown()', 1)
          path.write_text(text)
          PY
      - name: Validate complete workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit runtime fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ferrum-version-26-1-2/src/tags.rs \
            crates/ferrum-version-26-1-2/src/lib.rs \
            crates/ferrum-server/src/main.rs \
            crates/ferrum-game/src/command.rs
          if ! git diff --cached --quiet; then
            git commit -m 'Send complete configuration tags and improve console commands'
            git push origin HEAD:agent/finish-rom-core
          fi

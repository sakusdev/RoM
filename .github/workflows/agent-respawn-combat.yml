name: Complete respawn and combat lifecycle

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: agent-complete-respawn-combat
  cancel-in-progress: false

jobs:
  implement-and-validate:
    if: >-
      github.event.pull_request.number == 61 &&
      github.event.pull_request.head.ref == 'agent/complete-server-features'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-server-features
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Implement, validate, and commit
        shell: bash
        run: |
          log=/tmp/respawn-combat-validation.log
          : > "$log"
          status=0
          set +e

          python3 - <<'PY' 2>&1 | tee -a "$log"
          from pathlib import Path

          path = Path('.github/scripts/agent_respawn_combat.py')
          text = path.read_text()

          function_start = text.index('def patch_protocol_lib')
          function_end = text.index('\n\ndef patch_packet_catalog', function_start)
          replacement = r'''def patch_protocol_lib(text: str) -> str:
              text = replace_once(
                  text,
                  """    KeepAliveResponse,
              ClientTickEnd,
              MovePlayerPosition,
          """,
                  """    KeepAliveResponse,
              ClientTickEnd,
              ClientCommand,
              MovePlayerPosition,
          """,
                  "client command variant",
              )
              text = replace_once(
                  text,
                  """    SetEquipment,
              SetHealth,
              PlayerInfoUpdate,
          """,
                  """    SetEquipment,
              SetHealth,
              HurtAnimation,
              PlayerCombatKill,
              Respawn,
              PlayerInfoUpdate,
          """,
                  "combat packet variants",
              )

              packet_kind_impl = text.index("impl PacketKind {")
              all_start = text.index("    pub const ALL:", packet_kind_impl)
              all_end = text.index("    pub const CORE:", all_start)
              all_section = text[all_start:all_end]
              for needle, insertion, label in [
                  (
                      "        Self::ClientTickEnd,\n",
                      "        Self::ClientCommand,\n",
                      "client command all",
                  ),
                  (
                      "        Self::SetHealth,\n",
                      "        Self::HurtAnimation,\n        Self::PlayerCombatKill,\n        Self::Respawn,\n",
                      "combat all",
                  ),
              ]:
                  if all_section.count(needle) != 1:
                      raise SystemExit(
                          f"{label}: expected one anchor, found {all_section.count(needle)}"
                      )
                  all_section = all_section.replace(needle, needle + insertion, 1)
              text = text[:all_start] + all_section + text[all_end:]

              phase_start = text.index("    pub const fn phase", packet_kind_impl)
              direction_start = text.index("    pub const fn direction", phase_start)
              phase_section = text[phase_start:direction_start]
              for needle, insertion, label in [
                  (
                      "            | Self::ClientTickEnd\n",
                      "            | Self::ClientCommand\n",
                      "client command phase",
                  ),
                  (
                      "            | Self::SetHealth\n",
                      "            | Self::HurtAnimation\n            | Self::PlayerCombatKill\n            | Self::Respawn\n",
                      "combat phase",
                  ),
              ]:
                  if phase_section.count(needle) != 1:
                      raise SystemExit(
                          f"{label}: expected one anchor, found {phase_section.count(needle)}"
                      )
                  phase_section = phase_section.replace(needle, needle + insertion, 1)
              text = text[:phase_start] + phase_section + text[direction_start:]

              direction_start = text.index("    pub const fn direction", packet_kind_impl)
              direction_end = text.index("\n}\n\n#[derive", direction_start)
              direction_section = text[direction_start:direction_end]
              needle = "            | Self::ClientTickEnd\n"
              if direction_section.count(needle) != 1:
                  raise SystemExit(
                      f"client command direction: expected one anchor, found {direction_section.count(needle)}"
                  )
              direction_section = direction_section.replace(
                  needle,
                  needle + "            | Self::ClientCommand\n",
                  1,
              )
              text = text[:direction_start] + direction_section + text[direction_end:]
              return text
          '''
          text = text[:function_start] + replacement + text[function_end:]

          old = '''        """pub struct JoinGame {
          """,
                  """#[derive(Debug, Clone, Copy, PartialEq, Eq)]
          #[repr(u8)]
          pub enum RespawnDataToKeep {
              Nothing = 0,
              Attributes = 1,
              EntityData = 2,
              All = 3,
          }

          #[derive(Debug, Clone, PartialEq)]
          pub struct Respawn {
              pub spawn_info: CommonPlayerSpawnInfo,
              pub data_to_keep: RespawnDataToKeep,
          }

          pub struct JoinGame {
          """,'''
          new = '''        """#[derive(Debug, Clone, PartialEq)]
          pub struct JoinGame {
          """,
                  """#[derive(Debug, Clone, Copy, PartialEq, Eq)]
          #[repr(u8)]
          pub enum RespawnDataToKeep {
              Nothing = 0,
              Attributes = 1,
              EntityData = 2,
              All = 3,
          }

          #[derive(Debug, Clone, PartialEq)]
          pub struct Respawn {
              pub spawn_info: CommonPlayerSpawnInfo,
              pub data_to_keep: RespawnDataToKeep,
          }

          #[derive(Debug, Clone, PartialEq)]
          pub struct JoinGame {
          """,'''
          if text.count(old) != 1:
              raise SystemExit(f'join-game derive patch: expected one anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          status=${PIPESTATUS[0]}

          if [ "$status" -eq 0 ]; then
            python3 .github/scripts/agent_respawn_combat.py 2>&1 | tee -a "$log"
            status=${PIPESTATUS[0]}
          fi
          if [ "$status" -eq 0 ]; then
            python3 - <<'PY' 2>&1 | tee -a "$log"
          from pathlib import Path

          state_path = Path('crates/ferrum-game/src/state.rs')
          state = state_path.read_text()
          kill_start = state.index('    pub fn kill_player(')
          kill_end = state.index('    pub fn respawn_player(', kill_start)
          kill = state[kill_start:kill_end]
          needle = '        self.connected_entity_id(uuid)?;\n'
          if kill.count(needle) != 1:
              raise SystemExit(f'kill entity id: expected one anchor, found {kill.count(needle)}')
          kill = kill.replace(
              needle,
              '        let entity_id = self.connected_entity_id(uuid)?;\n',
              1,
          )
          state = state[:kill_start] + kill + state[kill_end:]
          state = state.replace('crate::Velocity::ZERO', 'crate::Velocity::default()')
          state_path.write_text(state)

          path = Path('crates/ferrum-server/src/game_replication.rs')
          text = path.read_text().replace('Velocity::ZERO', 'Velocity::default()')
          world_anchor = '            world: Some(crate::play_runtime::builtin_world_profile()),\n'
          world_fixture = '''            world: Some(RomPackWorld {
                      data_version: ferrum_version_26_1_2::WORLD_VERSION,
                      overworld_min_section_y: ferrum_version_26_1_2::OVERWORLD_MIN_SECTION_Y,
                      overworld_section_count: ferrum_version_26_1_2::OVERWORLD_SECTION_COUNT,
                      dimension: ferrum_version_26_1_2::OVERWORLD_DIMENSION.to_owned(),
                      dimension_type_id: ferrum_version_26_1_2::OVERWORLD_DIMENSION_TYPE_ID,
                      sea_level: ferrum_version_26_1_2::OVERWORLD_SEA_LEVEL,
                      floor_y: ferrum_version_26_1_2::FLAT_WORLD_FLOOR_Y,
                      spawn_x: ferrum_version_26_1_2::FLAT_WORLD_SPAWN_X,
                      spawn_z: ferrum_version_26_1_2::FLAT_WORLD_SPAWN_Z,
                      block_states: ferrum_rompack::RomPackBlockStates {
                          air: ferrum_version_26_1_2::AIR_BLOCK_STATE_ID,
                          stone: ferrum_version_26_1_2::STONE_BLOCK_STATE_ID,
                          grass: ferrum_version_26_1_2::GRASS_BLOCK_STATE_ID,
                          dirt: ferrum_version_26_1_2::DIRT_BLOCK_STATE_ID,
                          bedrock: ferrum_version_26_1_2::BEDROCK_BLOCK_STATE_ID,
                      },
                      biomes: ferrum_rompack::RomPackBiomes {
                          plains: ferrum_version_26_1_2::PLAINS_BIOME_ID,
                      },
                  }),
          '''
          if text.count(world_anchor) != 1:
              raise SystemExit(f'respawn world fixture: expected one anchor, found {text.count(world_anchor)}')
          text = text.replace(world_anchor, world_fixture, 1)

          start = text.index('    fn sends_hurt_death_respawn_teleport_and_health_in_order()')
          end = text.index('\n    }', start) + len('\n    }')
          block = text[start:end]
          old_call = '''        recv_protocol(
                      &writer,
                      &mut workers,
                      &mut inputs,
                      PacketKind::SetHealth,
                  );'''
          replacement = '''        assert!(matches!(
                      recv_raw_output(&writer, &mut workers, &mut inputs),
                      PlayOutput::ProtocolPacket {
                          kind: PacketKind::SetHealth,
                          ..
                      }
                  ));'''
          if block.count(old_call) != 3:
              raise SystemExit(f'health receive conversion: expected 3 calls, found {block.count(old_call)}')
          block = block.replace(old_call, replacement)
          path.write_text(text[:start] + block + text[end:])
          PY
            status=${PIPESTATUS[0]}
          fi
          if [ "$status" -eq 0 ]; then
            cargo fmt --all 2>&1 | tee -a "$log"
            status=${PIPESTATUS[0]}
          fi
          if [ "$status" -eq 0 ]; then
            cargo fmt --all --check 2>&1 | tee -a "$log"
            status=${PIPESTATUS[0]}
          fi
          if [ "$status" -eq 0 ]; then
            cargo check --workspace --all-targets --all-features 2>&1 | tee -a "$log"
            status=${PIPESTATUS[0]}
          fi
          if [ "$status" -eq 0 ]; then
            cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee -a "$log"
            status=${PIPESTATUS[0]}
          fi
          if [ "$status" -eq 0 ]; then
            cargo test --workspace --all-features 2>&1 | tee -a "$log"
            status=${PIPESTATUS[0]}
          fi
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$status" -ne 0 ]; then
            git checkout -- \
              crates/ferrum-protocol/src/lib.rs \
              crates/ferrum-protocol/src/packet_catalog.rs \
              crates/ferrum-version-26-1-2/src/lib.rs \
              crates/ferrum-play/src/lib.rs \
              crates/ferrum-game/src/state.rs \
              crates/ferrum-server/src/game_runtime.rs \
              crates/ferrum-server/src/play_runtime.rs \
              crates/ferrum-server/src/game_replication.rs \
              crates/ferrum-server/src/main.rs \
              docs/SERVER_ROADMAP.md
            cp "$log" .github/respawn-combat-diagnostic.txt
            git add .github/respawn-combat-diagnostic.txt
            if ! git diff --cached --quiet; then
              git commit -m "Record respawn combat validation failure"
              git push origin HEAD:agent/complete-server-features
            fi
            exit "$status"
          fi

          rm .github/scripts/agent_respawn_combat.py
          rm .github/workflows/agent-respawn-combat.yml
          rm -f .github/respawn-combat-diagnostic.txt
          rm -f .github/workflows/agent-inspect-version-mappings.yml
          rm -f .github/version-mapping-diagnostic.txt
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Complete player death and respawn lifecycle"
          git push origin HEAD:agent/complete-server-features

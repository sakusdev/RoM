name: Inspect 26.1.2 combat protocol

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: agent-inspect-combat-protocol
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.event.pull_request.number == 61 &&
      github.event.pull_request.head.ref == 'agent/complete-server-features'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-server-features
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Inspect official generated packet report
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p rom-bootstrap -- prepare \
            --instance /tmp/rom-inspect \
            --version 26.1.2 \
            --accept-minecraft-eula \
            --json > /tmp/prepare.json
          jar=$(jq -r '.official_server_jar' /tmp/prepare.json)
          mkdir -p /tmp/generated
          set +e
          java -DbundlerMainClass=net.minecraft.data.Main -jar "$jar" \
            --reports --output /tmp/generated > /tmp/generator.log 2>&1
          status=$?
          set -e
          report=$(find /tmp/generated -path '*/reports/packets.json' -print -quit)
          {
            echo "generator_status=$status"
            echo "official_jar=$jar"
            echo "packet_report=${report:-missing}"
            echo "generated_files:"
            find /tmp/generated -maxdepth 4 -type f | sort | sed -n '1,80p'
            echo "matching_packet_entries:"
            if [ -n "$report" ]; then
              python3 - "$report" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          needles = ("set_health", "damage_event", "hurt_animation", "combat", "respawn")

          def walk(value, path="$"):
              if isinstance(value, dict):
                  for key, child in value.items():
                      child_path = f"{path}.{key}"
                      if any(needle in key.lower() for needle in needles):
                          print(child_path)
                          print(json.dumps(child, indent=2, sort_keys=True))
                      walk(child, child_path)
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      walk(child, f"{path}[{index}]")

          walk(report)
          PY
            else
              sed -n '1,160p' /tmp/generator.log
            fi
          } > .github/combat-protocol-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/combat-protocol-diagnostic.txt
          git commit -m "Record combat protocol report diagnostics"
          git push origin HEAD:agent/complete-server-features

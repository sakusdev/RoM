name: Inspect 26.1.2 combat protocol

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: agent-inspect-combat-protocol
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.event.pull_request.number == 61 &&
      github.event.pull_request.head.ref == 'agent/complete-server-features'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-server-features
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Inspect official packet report and mapped bytecode
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p rom-bootstrap -- prepare \
            --instance /tmp/rom-inspect \
            --version 26.1.2 \
            --accept-minecraft-eula \
            --json > /tmp/prepare.json
          outer=$(jq -r '.official_server_jar' /tmp/prepare.json)
          mkdir -p /tmp/generated
          java -DbundlerMainClass=net.minecraft.data.Main -jar "$outer" \
            --reports --output /tmp/generated > /tmp/generator.log 2>&1
          report=/tmp/generated/reports/packets.json

          curl -fsSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json \
            -o /tmp/version-manifest.json
          version_url=$(jq -r '.versions[] | select(.id == "26.1.2") | .url' /tmp/version-manifest.json)
          curl -fsSL "$version_url" -o /tmp/version.json
          mappings_url=$(jq -r '.downloads.server_mappings.url' /tmp/version.json)
          curl -fsSL "$mappings_url" -o /tmp/server-mappings.txt

          inner=$(unzip -Z1 "$outer" | grep -E '^META-INF/versions/.+\.jar$' | head -1)
          unzip -p "$outer" "$inner" > /tmp/game.jar

          python3 - /tmp/server-mappings.txt <<'PY' > /tmp/packet-classes.tsv
          import re
          import sys

          targets = [
              "net.minecraft.network.protocol.game.ClientboundSetHealthPacket",
              "net.minecraft.network.protocol.game.ClientboundDamageEventPacket",
              "net.minecraft.network.protocol.game.ClientboundHurtAnimationPacket",
              "net.minecraft.network.protocol.game.ClientboundPlayerCombatKillPacket",
              "net.minecraft.network.protocol.game.ClientboundRespawnPacket",
              "net.minecraft.network.protocol.game.CommonPlayerSpawnInfo",
          ]
          patterns = {target: re.compile(rf"^{re.escape(target)} -> ([^:]+):$") for target in targets}
          lines = open(sys.argv[1], encoding="utf-8").read().splitlines()
          for target in targets:
              obfuscated = None
              for line in lines:
                  match = patterns[target].match(line)
                  if match:
                      obfuscated = match.group(1)
                      break
              if obfuscated is None:
                  raise SystemExit(f"missing mapping for {target}")
              print(f"{target}\t{obfuscated}")
          PY

          {
            echo "official_packet_ids:"
            jq '{damage_event: .play.clientbound["minecraft:damage_event"], hurt_animation: .play.clientbound["minecraft:hurt_animation"], player_combat_kill: .play.clientbound["minecraft:player_combat_kill"], respawn: .play.clientbound["minecraft:respawn"], set_health: .play.clientbound["minecraft:set_health"]}' "$report"
            echo "mapped_classes:"
            cat /tmp/packet-classes.tsv
            echo "mapping_blocks:"
            while IFS=$'\t' read -r mapped obfuscated; do
              echo "===== $mapped -> $obfuscated ====="
              awk -v class="$mapped" '
                $0 == class " -> " obf ":" { printing=1 }
                printing && /^[^ ]/ && $0 != class " -> " obf ":" { exit }
                printing { print }
              ' obf="$obfuscated" /tmp/server-mappings.txt
              echo "----- javap -----"
              javap -classpath /tmp/game.jar -p -c "$obfuscated" || true
            done < /tmp/packet-classes.tsv
          } > .github/combat-protocol-diagnostic.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/combat-protocol-diagnostic.txt
          git commit -m "Record mapped combat packet schemas"
          git push origin HEAD:agent/complete-server-features

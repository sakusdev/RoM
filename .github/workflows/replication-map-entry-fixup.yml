name: Replication map entry fixup

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.head_ref == 'feature/vanilla-play-replication' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vanilla-play-replication
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Use BTreeMap entry API
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/fix_replication_map_entry.py
          cargo fmt --all
          git add crates/ferrum-server/src/game_replication.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Use entry API for replication registration"
          git push origin HEAD:feature/vanilla-play-replication

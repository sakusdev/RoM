name: Finalize live Play writer

on:
  pull_request:
    branches: [master]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feature/live-play-writer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-play-writer
      - name: Remove integration helpers
        run: python3 tools/finalize_live_play_writer.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Finalize live Play writer integration
          branch: feature/live-play-writer
          file_pattern: .github/workflows tools

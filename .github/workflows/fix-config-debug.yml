name: Diagnose configuration fix

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/finish-rom-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-rom-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare official data
        shell: bash
        run: |
          set -euo pipefail
          instance="$RUNNER_TEMP/rom-tag-generation"
          cargo run --quiet --locked --release -p rom-bootstrap -- prepare \
            --instance "$instance" --version 26.1.2 --accept-minecraft-eula --json > prepare.json
          server_jar="$(jq -r '.official_server_jar' prepare.json)"
          listed_path="$(unzip -p "$server_jar" META-INF/versions.list 2>/dev/null | tr -d '\r' | awk -F '\t' 'NF == 3 { print $3; exit }')"
          if [[ "$listed_path" == META-INF/versions/* ]]; then inner_path="$listed_path"; else inner_path="META-INF/versions/$listed_path"; fi
          unzip -p "$server_jar" "$inner_path" > game-server.jar
          mkdir generated-reports
          (cd generated-reports && timeout 900 java -DbundlerMainClass=net.minecraft.data.Main -jar "$server_jar" --reports)
          find generated-reports -path '*/reports/registries.json' -type f -print -quit | xargs -r -I{} cp '{}' registries.json
          test -s registries.json
      - name: Apply configuration transform
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import textwrap
          from pathlib import Path
          lines = Path('.github/workflows/fix-configuration-and-console.yml').read_text().splitlines()
          marker = '          python - <<\'PY\''
          start = next(i for i, line in enumerate(lines) if line == marker)
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(lines[start + 1:end]))
          exec(compile(script, 'configuration-transform.py', 'exec'))
          PYCODE
      - name: Format
        id: format
        continue-on-error: true
        shell: bash
        run: cargo fmt --all 2>&1 | tee format.log
      - name: Check
        id: check
        if: always()
        continue-on-error: true
        shell: bash
        run: cargo check --workspace --all-targets 2>&1 | tee check.log
      - name: Clippy
        id: clippy
        if: always()
        continue-on-error: true
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log
      - name: Tests
        id: tests
        if: always()
        continue-on-error: true
        shell: bash
        run: cargo test --workspace 2>&1 | tee test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: configuration-fix-diagnostics
          path: |
            format.log
            check.log
            clippy.log
            test.log
            crates/ferrum-version-26-1-2/src/tags.rs
            crates/ferrum-version-26-1-2/src/lib.rs
            crates/ferrum-server/src/main.rs
            crates/ferrum-game/src/command.rs
          if-no-files-found: error
          retention-days: 7
      - name: Fail on validation errors
        if: steps.format.outcome == 'failure' || steps.check.outcome == 'failure' || steps.clippy.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: exit 1

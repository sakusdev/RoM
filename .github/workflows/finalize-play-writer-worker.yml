name: Finalize Play writer worker

on:
  pull_request:
    branches: [master]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feature/play-writer-worker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/play-writer-worker
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Fix, format, and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ferrum-server/src/play_writer.rs')
          source = path.read_text()
          old = 'spawn_play_writer(writer, Vec::new(), Duration::ZERO, |_, _| {'
          new = 'spawn_play_writer(writer, Vec::<u8>::new(), Duration::ZERO, |_, _| {'
          if old not in source:
              raise SystemExit('zero-timeout test marker not found')
          path.write_text(source.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit implementation
        run: |
          rm .github/workflows/finalize-play-writer-worker.yml
          rm -f .github/workflows/diagnose-play-writer-worker.yml
          rm -f play-writer-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize Play writer worker"
          git push origin HEAD:feature/play-writer-worker

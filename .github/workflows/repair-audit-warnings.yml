name: Repair audit warnings

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/admin-web-gui' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-web-gui
          fetch-depth: 0
      - name: Repair generated Clippy warnings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/apply_full_audit_fixes.py')
          text = path.read_text()

          reader_old = '    mut reader: impl Read,\n'
          reader_new = '    reader: impl Read,\n'
          if text.count(reader_old) != 1:
              raise SystemExit(f'unexpected bounded-reader anchor count: {text.count(reader_old)}')
          text = text.replace(reader_old, reader_new, 1)

          entry_old = '    let Ok(mut entry) = archive.by_name(name) else {\n'
          entry_new = '    let Ok(entry) = archive.by_name(name) else {\n'
          if text.count(entry_old) != 2:
              raise SystemExit(f'unexpected Fabric entry anchor count: {text.count(entry_old)}')
          index = text.rfind(entry_old)
          text = text[:index] + entry_new + text[index + len(entry_old):]

          path.write_text(text)
          PY
          rm -f .github/workflows/repair-audit-warnings.yml .github/workflows/audit-diagnose.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/apply_full_audit_fixes.py .github/workflows/repair-audit-warnings.yml .github/workflows/audit-diagnose.yml
          git commit -m 'Fix audited input Clippy warnings'
          git push origin HEAD:agent/admin-web-gui

name: Play output test fixup

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.head_ref == 'feature/vanilla-play-replication' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vanilla-play-replication
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Update semantic output test IDs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/fix_play_output_test_ids.py
          cargo fmt --all
          git add crates/ferrum-server/src/main.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update semantic output test packet IDs"
          git push origin HEAD:feature/vanilla-play-replication

name: P0-P4 continuation export

on:
  pull_request:
    types: [reopened]

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.head.ref == 'agent/p0-p4-gameplay-foundations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Download verified official server
        run: |
          set -euo pipefail
          mkdir -p /tmp/inspect /tmp/libs
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request, zipfile

          version = '26.1.2'

          def download(url):
              request = urllib.request.Request(url, headers={'User-Agent': 'RoM/official-wire-inspector'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.read()

          manifest = json.loads(download('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'))
          entry = next(item for item in manifest['versions'] if item['id'] == version)
          metadata_bytes = download(entry['url'])
          if hashlib.sha1(metadata_bytes).hexdigest() != entry['sha1']:
              raise SystemExit('version metadata SHA-1 mismatch')
          metadata = json.loads(metadata_bytes)
          server = metadata['downloads']['server']
          server_bytes = download(server['url'])
          if len(server_bytes) != server['size'] or hashlib.sha1(server_bytes).hexdigest() != server['sha1']:
              raise SystemExit('server integrity mismatch')
          pathlib.Path('/tmp/server.jar').write_bytes(server_bytes)
          pathlib.Path('/tmp/inspect/source.json').write_text(json.dumps({
              'version': version,
              'metadata_sha1': entry['sha1'],
              'server_sha1': server['sha1'],
              'server_size': server['size'],
          }, indent=2, sort_keys=True))

          with zipfile.ZipFile('/tmp/server.jar') as outer:
              names = outer.namelist()
              pathlib.Path('/tmp/inspect/server-bundle-entries.txt').write_text('\n'.join(names) + '\n')
              lines = outer.read('META-INF/versions.list').decode().splitlines()
              pathlib.Path('/tmp/inspect/versions.list').write_text('\n'.join(lines) + '\n')
              candidates = [fields[2] for line in lines if len((fields := line.strip().split('\t'))) == 3]
              if len(candidates) != 1:
                  raise SystemExit(f'expected one embedded game jar, found {candidates}')
              game_entry = f'META-INF/versions/{candidates[0]}'
              if game_entry not in names:
                  raise SystemExit(f'embedded game jar is missing: {game_entry}')
              pathlib.Path('/tmp/game.jar').write_bytes(outer.read(game_entry))
              for name in names:
                  if name.startswith('META-INF/libraries/') and name.endswith('.jar'):
                      (pathlib.Path('/tmp/libs') / pathlib.Path(name).name).write_bytes(outer.read(name))
          PY

      - name: Locate and disassemble item entity classes
        run: |
          set -euo pipefail
          jar tf /tmp/game.jar > /tmp/inspect/game-classes.txt
          grep -Ei '(^|/)(ItemEntity|EntityDataAccessor|EntityDataSerializers|SynchedEntityData|ClientboundSetEntityDataPacket|ClientboundAddEntityPacket)(\$[^/]*)?\.class$' \
            /tmp/inspect/game-classes.txt > /tmp/inspect/matching-classes.txt || true
          cat /tmp/inspect/matching-classes.txt
          python3 - <<'PY' > /tmp/inspect/candidates.txt
          from pathlib import Path
          for line in Path('/tmp/inspect/matching-classes.txt').read_text().splitlines():
              if '$' in line or not line.endswith('.class'):
                  continue
              print(line[:-6].replace('/', '.'))
          PY
          if [[ ! -s /tmp/inspect/candidates.txt ]]; then
            echo 'No named candidate classes found' >&2
            exit 1
          fi
          while IFS= read -r class; do
            safe=$(printf '%s' "$class" | tr './$' '___')
            javap -p -c -s -constants -classpath "/tmp/game.jar:/tmp/libs/*" "$class" \
              > "/tmp/inspect/${safe}.javap.txt"
          done < /tmp/inspect/candidates.txt

      - name: Upload inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item-entity-official-inspection
          path: /tmp/inspect
          if-no-files-found: error
          retention-days: 1

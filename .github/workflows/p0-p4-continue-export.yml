name: P0-P4 item entity replication

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  validate-and-commit:
    if: github.event.pull_request.head.ref == 'agent/p0-p4-gameplay-foundations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconstruct reviewed source patch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PATCH_SHA256: c5778001cd4668662d6688b449b304e0eeecc4f207610e6ecf0fff01832af56f
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            > /tmp/comments.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          prefix = 'P0P4_ITEM_REPLICATION_PATCH:'
          comments = json.loads(Path('/tmp/comments.json').read_text())
          matches = [
              (comment.get('body') or '')[len(prefix):].strip()
              for comment in comments
              if (comment.get('body') or '').startswith(prefix)
          ]
          if len(matches) != 1:
              raise SystemExit(f'expected one item replication patch comment, found {len(matches)}')
          Path('/tmp/item-replication.patch.gz.b64').write_text(matches[0])
          PY
          base64 --decode /tmp/item-replication.patch.gz.b64 > /tmp/item-replication.patch.gz
          gzip --test /tmp/item-replication.patch.gz
          gzip --decompress --stdout /tmp/item-replication.patch.gz > /tmp/item-replication.patch
          echo "${PATCH_SHA256}  /tmp/item-replication.patch" | sha256sum --check --strict
          git apply --check /tmp/item-replication.patch
          git apply /tmp/item-replication.patch
          rm -f /tmp/comments.json /tmp/item-replication.patch.gz.b64 /tmp/item-replication.patch.gz /tmp/item-replication.patch

      - name: Validate workspace
        id: validate
        continue-on-error: true
        run: |
          set -o pipefail
          {
            cargo fmt --all
            cargo fmt --all -- --check
            cargo check --workspace --all-targets --all-features
            cargo clippy --workspace --all-targets --all-features -- -D warnings
            cargo test --workspace --all-targets --all-features
          } 2>&1 | tee /tmp/item-replication-validation.log

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-p4-item-replication-validation
          path: /tmp/item-replication-validation.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Enforce validation
        if: steps.validate.outcome == 'failure'
        run: exit 1

      - name: Commit verified source only
        run: |
          set -euo pipefail
          rm .github/workflows/p0-p4-continue-export.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replicate authoritative item entities"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

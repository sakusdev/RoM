name: Live gameplay runtime fixup v2

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.head_ref == 'feature/vanilla-parity-foundation' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vanilla-parity-foundation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply live gameplay runtime integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/apply_live_game_runtime.py
          cargo fmt --all
          git add crates/ferrum-game/src/entity.rs crates/ferrum-server/src/main.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Connect live players to gameplay state"
          git push origin HEAD:feature/vanilla-parity-foundation

name: Complete inventory and containers

on:
  push:
    branches:
      - agent/complete-inventory-containers
    paths:
      - .github/workflows/agent-complete-inventory.yml

permissions:
  contents: write

concurrency:
  group: agent-complete-inventory
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-inventory-containers
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply complete inventory implementation
        shell: bash
        run: |
          python - <<'PYCODE'
          import base64
          import lzma
          payload = '...'
          source = lzma.decompress(base64.b64decode(payload)).decode('utf-8')
          exec(compile(source, 'apply_complete_inventory.py', 'exec'))
          PYCODE
      - run: cargo fmt --all
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates Cargo.lock
          git diff --cached --stat
          git commit -m 'Complete authoritative inventory and containers'
          git push origin HEAD:agent/complete-inventory-containers

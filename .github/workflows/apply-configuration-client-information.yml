name: Apply configuration client information fix

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'fix/configuration-client-information'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/configuration-client-information
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply source patch
        run: python3 tools/apply_configuration_client_information_patch.py
      - name: Remove temporary patch machinery
        run: |
          rm tools/apply_configuration_client_information_patch.py
          rm .github/workflows/apply-configuration-client-information.yml
      - name: Format
        run: cargo fmt --all
      - name: Validate
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Handle Configuration Client Information before Known Packs"
          git push origin HEAD:fix/configuration-client-information

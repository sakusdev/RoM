name: Clean up temporary core workflows

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/finish-rom-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-rom-core
          fetch-depth: 0
      - name: Remove branch-only work and diagnostic workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm --ignore-unmatch \
            .github/workflows/apply-validated-config-fix.yml \
            .github/workflows/cleanup-core-workflows.yml \
            .github/workflows/entity-palette-debug.yml \
            .github/workflows/export-core-source.yml \
            .github/workflows/export-official-tags.yml \
            .github/workflows/fix-config-debug.yml \
            .github/workflows/fix-configuration-and-console.yml \
            .github/workflows/fix-core-lockfile.yml \
            .github/workflows/fix-relative-bundler-path.yml \
            .github/workflows/implement-entity-palette.yml \
            .github/workflows/inspect-client-configuration.yml \
            .github/workflows/inspect-configuration-protocol.yml \
            .github/workflows/inspect-entity-protocol.yml \
            .github/workflows/inspect-entity-source-debug.yml \
            .github/workflows/restore-play-lib.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Remove temporary core development workflows'
            git push origin HEAD:agent/finish-rom-core
          fi

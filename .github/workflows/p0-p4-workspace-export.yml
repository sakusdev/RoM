name: P0-P4 validated source commit

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  validate-and-commit:
    if: github.event.pull_request.head.ref == 'agent/p0-p4-gameplay-foundations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fetch patch chunks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            > /tmp/comments.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          comments = json.loads(Path('/tmp/comments.json').read_text())
          chunks = {}
          for comment in comments:
              body = comment.get('body') or ''
              for number in range(1, 5):
                  prefix = f'P0P4_PATCH_{number}:'
                  if body.startswith(prefix):
                      if number in chunks:
                          raise SystemExit(f'duplicate patch chunk {number}')
                      chunks[number] = body[len(prefix):].strip()
          missing = [number for number in range(1, 5) if number not in chunks]
          if missing:
              raise SystemExit(f'missing patch chunks: {missing}')
          for number in range(1, 5):
              Path(f'/tmp/p0-p4.chunk{number}').write_text(chunks[number])
          encoded = ''.join(chunks[number] for number in range(1, 5))
          if len(encoded) != 36980:
              raise SystemExit(f'combined patch transport length mismatch: {len(encoded)}')
          Path('/tmp/p0-p4.patch.gz.b64').write_text(encoded)
          PY

      - name: Export received patch chunk 3
        uses: actions/upload-artifact@v4
        with:
          name: received-p0-p4-chunk3
          path: /tmp/p0-p4.chunk3
          if-no-files-found: error
          retention-days: 1

      - name: Verify patch chunk 1
        run: echo '30de7682a19f6ebf19fd8f409e492ff8cb8126bd099c90d966d51097b171f080  /tmp/p0-p4.chunk1' | sha256sum --check --strict

      - name: Verify patch chunk 2
        run: echo '764ad54c6cabd73f2a38cb1e459a44bab37898ae46bd2042fa17109c25d10321  /tmp/p0-p4.chunk2' | sha256sum --check --strict

      - name: Verify patch chunk 3
        run: echo 'db5ca74172acdcad709b1dc9c5671960c8b9b08d547cccb42b33b9dbae7e50c7  /tmp/p0-p4.chunk3' | sha256sum --check --strict

      - name: Verify patch chunk 4
        run: echo '40b98c3511b66a63c501aeec58b15d887bf0e2e020818429d1ec478f7bce1518  /tmp/p0-p4.chunk4' | sha256sum --check --strict

      - name: Verify patch transport
        run: |
          set -euo pipefail
          base64 --decode /tmp/p0-p4.patch.gz.b64 > /tmp/p0-p4.patch.gz
          gzip --test /tmp/p0-p4.patch.gz
          gzip --decompress --stdout /tmp/p0-p4.patch.gz > /tmp/p0-p4.patch
          echo '011e3f74846a937f37a462310a932f2efbf0b1beb39088e12706df7b9c2510dc  /tmp/p0-p4.patch' | sha256sum --check --strict

      - name: Apply source patch
        run: |
          set -euo pipefail
          git apply --check -p2 /tmp/p0-p4.patch
          git apply -p2 /tmp/p0-p4.patch
          rm -f /tmp/comments.json /tmp/p0-p4.chunk* /tmp/p0-p4.patch.gz.b64 /tmp/p0-p4.patch.gz /tmp/p0-p4.patch

      - name: Format
        run: cargo fmt --all

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-targets --all-features

      - name: Commit verified source only
        run: |
          set -euo pipefail
          rm .github/workflows/p0-p4-workspace-export.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement P0-P4 gameplay foundations"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

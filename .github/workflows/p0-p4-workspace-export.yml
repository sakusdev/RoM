name: P0-P4 workspace export

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive workspace
        run: git archive --format=zip --output=rom-workspace.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: rom-workspace
          path: rom-workspace.zip
          if-no-files-found: error
          retention-days: 1

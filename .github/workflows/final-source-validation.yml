name: Final source validation

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'agent/admin-web-gui' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-web-gui
          fetch-depth: 0
      - name: Finalize clean source head
        id: clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/final-source-validation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/final-source-validation.yml
          git commit -m 'Remove final validation workflow'
          git push origin HEAD:agent/admin-web-gui
          echo "validated_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test ! -e .github/workflows/final-source-validation.yml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate exact final head
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check 2>&1 | tee final-fmt.log
          cargo check --workspace --all-targets --all-features 2>&1 | tee final-check.log
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee final-clippy.log
          cargo test --workspace --all-features 2>&1 | tee final-test.log
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps 2>&1 | tee final-doc.log
          cargo install cargo-audit --locked 2>&1 | tee final-audit-install.log
          cargo audit 2>&1 | tee final-audit.log
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-source-validation-${{ steps.clean.outputs.validated_sha }}
          path: |
            final-fmt.log
            final-check.log
            final-clippy.log
            final-test.log
            final-doc.log
            final-audit-install.log
            final-audit.log
          retention-days: 7

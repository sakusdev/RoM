name: Apply validated configuration fix

on:
  pull_request:
    branches: [master]

permissions:
  actions: read
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/finish-rom-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-rom-core
          fetch-depth: 0
      - name: Download validated source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/sakusdev/RoM/actions/artifacts/8289729895/zip > validated.zip
          mkdir validated
          unzip -q validated.zip -d validated
          test -s validated/crates/ferrum-version-26-1-2/src/tags.rs
      - name: Apply and commit validated files
        shell: bash
        run: |
          set -euo pipefail
          cp validated/crates/ferrum-version-26-1-2/src/tags.rs crates/ferrum-version-26-1-2/src/tags.rs
          cp validated/crates/ferrum-version-26-1-2/src/lib.rs crates/ferrum-version-26-1-2/src/lib.rs
          cp validated/crates/ferrum-server/src/main.rs crates/ferrum-server/src/main.rs
          cp validated/crates/ferrum-game/src/command.rs crates/ferrum-game/src/command.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ferrum-version-26-1-2/src/tags.rs \
            crates/ferrum-version-26-1-2/src/lib.rs \
            crates/ferrum-server/src/main.rs \
            crates/ferrum-game/src/command.rs
          if ! git diff --cached --quiet; then
            git commit -m 'Send complete configuration tags and improve console commands'
            git push origin HEAD:agent/finish-rom-core
          fi

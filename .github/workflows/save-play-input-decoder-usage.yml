name: Save Play input decoder usage

on:
  pull_request:
    branches: [master]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  save:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feature/use-play-input-decoder'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/use-play-input-decoder
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply and validate
        run: |
          python3 tools/apply_play_input_decoder_usage.py
          rm tools/apply_play_input_decoder_usage.py
          cargo fmt --all
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Use semantic Play input decoder
          branch: feature/use-play-input-decoder
          file_pattern: crates/ferrum-server/src/play_runtime.rs tools/apply_play_input_decoder_usage.py

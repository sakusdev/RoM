name: Complete player equipment replication

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: agent-complete-player-equipment-replication
  cancel-in-progress: false

jobs:
  implement-and-validate:
    if: >-
      github.event.pull_request.number == 61 &&
      github.event.pull_request.head.ref == 'agent/complete-server-features'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-server-features
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Implement, validate, and commit
        shell: bash
        run: |
          log=/tmp/player-equipment-validation.log
          : > "$log"
          status=0
          set +e

          python3 - <<'PY' 2>&1 | tee -a "$log"
          from pathlib import Path

          path = Path('.github/scripts/agent_player_equipment.py')
          text = path.read_text()

          start = text.index('    text = text.replace(\n        """                    &config.entity_protocol_ids,')
          end = text.index('    text = replace_once(\n        text,\n        """    connections:', start)
          dispatch_replacement = '''    run_start = text.index("fn run_replication(")
              run_end = text.index("fn process_commands(", run_start)
              run = text[run_start:run_end]
              if run.count("&config.entity_protocol_ids,") != 2:
                  raise SystemExit(
                      f"dispatch config calls: expected 2, found {run.count('&config.entity_protocol_ids,')}"
                  )
              run = run.replace("&config.entity_protocol_ids,", "&config,")
              text = text[:run_start] + run + text[run_end:]
          '''
          text = text[:start] + dispatch_replacement + text[end:]

          label = text.index('"register spawn config"')
          start = text.rfind('    text = replace_once(', 0, label)
          end = text.index('    text = replace_once(', label)
          register_replacement = '''    command_start = text.index("fn process_commands(")
              command_end = text.index("fn dispatch_event(", command_start)
              command = text[command_start:command_end]
              if command.count("entity_protocol_ids,") != 1:
                  raise SystemExit(
                      f"register spawn config: expected one remaining argument, found {command.count('entity_protocol_ids,')}"
                  )
              command = command.replace("entity_protocol_ids,", "config,", 1)
              text = text[:command_start] + command + text[command_end:]
          '''
          path.write_text(text[:start] + register_replacement + text[end:])
          PY
          status=${PIPESTATUS[0]}

          if [ "$status" -eq 0 ]; then
            python3 .github/scripts/agent_player_equipment.py 2>&1 | tee -a "$log"
            status=${PIPESTATUS[0]}
          fi
          if [ "$status" -eq 0 ]; then
            cargo fmt --all 2>&1 | tee -a "$log"
            status=${PIPESTATUS[0]}
          fi
          if [ "$status" -eq 0 ]; then
            cargo fmt --all --check 2>&1 | tee -a "$log"
            status=${PIPESTATUS[0]}
          fi
          if [ "$status" -eq 0 ]; then
            cargo check --workspace --all-targets --all-features 2>&1 | tee -a "$log"
            status=${PIPESTATUS[0]}
          fi
          if [ "$status" -eq 0 ]; then
            cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee -a "$log"
            status=${PIPESTATUS[0]}
          fi
          if [ "$status" -eq 0 ]; then
            cargo test --workspace --all-features 2>&1 | tee -a "$log"
            status=${PIPESTATUS[0]}
          fi
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$status" -ne 0 ]; then
            cp "$log" .github/player-equipment-diagnostic.txt
            git add .github/player-equipment-diagnostic.txt
            if ! git diff --cached --quiet; then
              git commit -m "Record player equipment validation failure"
              git push origin HEAD:agent/complete-server-features
            fi
            exit "$status"
          fi

          rm .github/scripts/agent_player_equipment.py
          rm .github/workflows/agent-player-equipment.yml
          rm -f .github/player-equipment-diagnostic.txt
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Synchronize player equipment"
          git push origin HEAD:agent/complete-server-features

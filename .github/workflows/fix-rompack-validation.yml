name: Fix RoM version-pack validation

on:
  pull_request:
    branches:
      - master
    types:
      - synchronize

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'feature/rompack-generation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rompack-generation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Fix digest comparison and remove diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ferrum-rompack/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          old = '    if expected_digest != actual_digest.as_ref() {\n'
          new = '    if expected_digest != &actual_digest[..] {\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one digest comparison, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f rompack-validation-diagnostics.txt
          rm .github/workflows/fix-rompack-validation.yml
      - name: Validate finalized workspace
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize deterministic local version-pack generation"
          git push origin HEAD:feature/rompack-generation

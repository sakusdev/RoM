name: Inspect 26.1.2 protocol codecs

on:
  pull_request:
    types: [reopened]

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'agent/complete-server-features'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official server and inspect codecs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          manifest=json.load(urllib.request.urlopen('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'))
          version=next(v for v in manifest['versions'] if v['id']=='26.1.2')
          detail=json.load(urllib.request.urlopen(version['url']))
          urllib.request.urlretrieve(detail['downloads']['server']['url'], '/tmp/server.jar')
          PY
          nested="$(unzip -Z1 /tmp/server.jar | grep -E '(^|/)server[^/]*\.jar$' | head -n1)"
          test -n "$nested"
          unzip -p /tmp/server.jar "$nested" > /tmp/inner-server.jar
          {
            echo "nested=$nested"
            for class in \
              'net.minecraft.network.protocol.game.ServerboundChatPacket' \
              'net.minecraft.network.chat.LastSeenMessages$Update' \
              'net.minecraft.network.chat.MessageSignature' \
              'net.minecraft.network.protocol.game.ClientboundEntityEventPacket' \
              'net.minecraft.network.protocol.game.ClientboundPlayerCombatKillPacket' \
              'net.minecraft.network.protocol.game.ClientboundRespawnPacket' \
              'net.minecraft.network.protocol.game.CommonPlayerSpawnInfo'; do
              echo "===== $class ====="
              javap -classpath /tmp/inner-server.jar -p -c -s "$class" || true
            done
          } > /tmp/protocol-codecs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: protocol-codecs
          path: /tmp/protocol-codecs.txt

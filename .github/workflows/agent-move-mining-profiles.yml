name: Agent Move Mining Profiles

on:
  push:
    branches: [agent/item-entity-domain]
    paths:
      - '.github/scripts/agent_move_mining_profiles.py'
      - '.github/workflows/agent-move-mining-profiles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Move mining profiles
        run: python .github/scripts/agent_move_mining_profiles.py
      - run: cargo fmt --all
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      - name: Commit validated cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/rom-server/src/mining_runtime.rs crates/rom-server/src/play_runtime.rs
          git commit -m "Move block mining profiles into mining runtime"
          git push

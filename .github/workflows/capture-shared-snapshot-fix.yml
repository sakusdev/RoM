name: Capture shared snapshot fix diagnostics

on:
  pull_request:
    branches:
      - master
    types:
      - synchronize

permissions:
  contents: write

jobs:
  capture:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'feature/shared-world-chunk-snapshots'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/shared-world-chunk-snapshots
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply obsolete constructor fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/ferrum-server/src/main.rs")
          text = path.read_text(encoding="utf-8")
          old_import = "use ferrum_world::{BiomeId, BlockStateId, ChunkPos, FlatWorldSpec, StaticChunk};"
          if old_import in text:
              text = text.replace(old_import, "use ferrum_world::ChunkPos;", 1)
          start_marker = "\nfn static_chunk() -> Result<StaticChunk> {"
          end_marker = "\nfn static_join_game(config: &ServerConfig) -> JoinGame {"
          if start_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              text = text[:start] + "\n" + text[end:]
          path.write_text(text, encoding="utf-8")
          PY
          rm -f shared-chunk-diagnostics.txt
          rm .github/workflows/capture-shared-snapshot-fix.yml
      - name: Capture validation
        run: |
          cargo fmt --all
          set +e
          cargo clippy --workspace --all-targets -- -D warnings > shared-chunk-fix-diagnostics.txt 2>&1
          clippy_status=$?
          cargo test --workspace >> shared-chunk-fix-diagnostics.txt 2>&1
          test_status=$?
          printf '\nclippy_status=%s\ntest_status=%s\n' "$clippy_status" "$test_status" >> shared-chunk-fix-diagnostics.txt
          exit 0
      - name: Commit source and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Capture shared snapshot test diagnostics"
          git push origin HEAD:feature/shared-world-chunk-snapshots

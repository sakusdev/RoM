name: Play loop bridge refactor

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ github.head_ref == 'feature/vanilla-parity-foundation' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vanilla-parity-foundation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Refactor play loop bridge arguments
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/refactor_play_loop_bridge.py
          cargo fmt --all
          git add crates/ferrum-server/src/main.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refactor play loop bridge arguments"
          git push origin HEAD:feature/vanilla-parity-foundation

name: Finalize RoM Bootstrap

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'feature/rom-bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rom-bootstrap
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate workspace lockfile
        run: cargo generate-lockfile
      - name: Format
        run: cargo fmt --all
      - name: Capture validation diagnostics
        run: |
          set +e
          cargo clippy --workspace --all-targets -- -D warnings > rom-bootstrap-diagnostics.txt 2>&1
          clippy_status=$?
          cargo test --workspace >> rom-bootstrap-diagnostics.txt 2>&1
          test_status=$?
          printf '\nclippy_status=%s\ntest_status=%s\n' "$clippy_status" "$test_status" >> rom-bootstrap-diagnostics.txt
          exit 0
      - name: Commit diagnostics and generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Capture RoM Bootstrap validation diagnostics"
          git push origin HEAD:feature/rom-bootstrap

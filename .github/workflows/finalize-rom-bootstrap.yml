name: Finalize RoM Bootstrap

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'feature/rom-bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rom-bootstrap
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate workspace lockfile
        run: cargo generate-lockfile
      - name: Format
        run: cargo fmt --all
      - name: Validate
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Remove temporary workflow
        run: rm .github/workflows/finalize-rom-bootstrap.yml
      - name: Commit generated lockfile and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize RoM Bootstrap implementation"
          git push origin HEAD:feature/rom-bootstrap

name: Integrate admin GUI

on:
  push:
    branches:
      - agent/admin-web-gui

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-web-gui
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Connect GUI to the server
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/ferrum-server/src/main.rs')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'missing main.rs anchor: {label}')
              text = text.replace(old, new, 1)

          replace_once(
              'use clap::Parser;\nmod codec;\n',
              'use clap::Parser;\nmod admin_gui;\nmod codec;\n',
              'module declaration',
          )
          replace_once(
              'use codec::{\n',
              'use admin_gui::{AdminGuiConfig, spawn_admin_gui};\nuse codec::{\n',
              'module import',
          )
          replace_once(
              '    net::{TcpListener, TcpStream},\n',
              '    net::{SocketAddr, TcpListener, TcpStream},\n',
              'SocketAddr import',
          )
          replace_once(
              '''    /// Disable the interactive server console on standard input.
              #[arg(long)]
              no_console: bool,
          }
          ''',
              '''    /// Disable the interactive server console on standard input.
              #[arg(long)]
              no_console: bool,

              /// Disable the local web administration dashboard.
              #[arg(long)]
              no_admin_gui: bool,

              /// Address for the web administration dashboard.
              #[arg(long, default_value = "127.0.0.1:25575")]
              admin_bind: SocketAddr,

              /// Bearer token required by dashboard API requests. Required for non-loopback binds.
              #[arg(long)]
              admin_token: Option<String>,
          }
          ''',
              'CLI fields',
          )
          replace_once(
              '''    listener
                  .set_nonblocking(true)
                  .context("cannot configure non-blocking Minecraft listener")?;
              if !cli.no_console {
          ''',
              '''    listener
                  .set_nonblocking(true)
                  .context("cannot configure non-blocking Minecraft listener")?;
              let admin_gui = if cli.no_admin_gui {
                  None
              } else {
                  let disk_path = config_path
                      .parent()
                      .unwrap_or_else(|| Path::new("."))
                      .to_path_buf();
                  let handle = spawn_admin_gui(
                      AdminGuiConfig {
                          bind: cli.admin_bind,
                          token: cli.admin_token.clone(),
                          disk_path,
                          version_name: config.version_name.clone(),
                          protocol: config.protocol,
                          max_players: config.max_players,
                      },
                      Arc::clone(&state),
                  )?;
                  println!("admin GUI listening on http://{}", handle.local_addr());
                  Some(handle)
              };
              if !cli.no_console {
          ''',
              'GUI startup',
          )
          replace_once(
              '''    for client in clients {
                  let _ = client.join();
              }
              let state = Arc::try_unwrap(state)
                  .map_err(|_| anyhow::anyhow!("server state is still referenced during shutdown"))?;
              let exit = state.shutdown()?;
              println!(
                  "game service stopped after {} ticks ({} dropped), {} autosaves, {} requested/final saves",
                  exit.ticks, exit.dropped_ticks, exit.autosaves, exit.requested_saves
              );
              Ok(())
          ''',
              '''    for client in clients {
                  let _ = client.join();
              }
              let admin_gui_error = admin_gui.and_then(|handle| handle.join().err());
              let state = Arc::try_unwrap(state)
                  .map_err(|_| anyhow::anyhow!("server state is still referenced during shutdown"))?;
              let exit = state.shutdown()?;
              println!(
                  "game service stopped after {} ticks ({} dropped), {} autosaves, {} requested/final saves",
                  exit.ticks, exit.dropped_ticks, exit.autosaves, exit.requested_saves
              );
              if let Some(error) = admin_gui_error {
                  return Err(error);
              }
              Ok(())
          ''',
              'GUI shutdown',
          )
          path.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          if '### Admin web GUI\n' not in text:
              anchor = '### Runtime architecture\n\n'
              if anchor not in text:
                  raise SystemExit('missing README runtime architecture anchor')
              section = '''### Admin web GUI

          `ferrum-server` starts a lightweight local dashboard at
          [`http://127.0.0.1:25575`](http://127.0.0.1:25575) by default. It is
          embedded in the native binary and loads no external assets.

          The dashboard displays CPU, memory, and instance-filesystem disk usage,
          server uptime, online players, game ticks, and entity count. Its command box
          uses the same authoritative parser as standard input and never invokes an
          operating-system shell. Commands include `help`, `list`, `say hello`,
          `save-all`, and `stop`.

          Use `--no-admin-gui` to disable it and `--admin-bind` to choose another
          address. A non-loopback bind is rejected unless `--admin-token` is supplied.
          On Termux or Pixel Terminal, leave the loopback default and open
          `http://127.0.0.1:25575` in the Android browser.

          ```bash
          ferrum-server \\
            --config ./rom-instance/server.toml \\
            --version-pack ./rom-instance/versions/26.1.2/26.1.2.rompack \\
            --admin-bind 127.0.0.1:25575
          ```

          '''
              text = text.replace(anchor, section + anchor, 1)
              readme.write_text(text)
          PY
      - name: Validate the entire workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps
      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/integrate-admin-gui.yml
          git add -A
          git commit -m 'Integrate local admin web GUI'
          git push origin HEAD:agent/admin-web-gui

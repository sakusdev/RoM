name: Agent Integrate Attack Cooldown

on:
  push:
    branches: [agent/item-entity-domain]
    paths:
      - '.github/scripts/agent_integrate_attack_cooldown.py'
      - '.github/workflows/agent-integrate-attack-cooldown.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply attack cooldown and critical hits
        run: python .github/scripts/agent_integrate_attack_cooldown.py
      - run: cargo fmt --all
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p rom-server combat_runtime::tests -- --nocapture
      - run: cargo test --workspace --no-fail-fast
      - name: Commit validated combat timing
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/rom-game/src/player_gameplay.rs crates/rom-server/src/combat_runtime.rs
          git commit -m "Add authoritative attack cooldown and critical hits"
          git push

name: Apply packet catalog integration

on:
  push:
    branches: [feature/vanilla-packet-catalog]
    paths:
      - .github/workflows/apply-packet-catalog.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vanilla-packet-catalog
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply packet catalog changes
        run: |
          set -euo pipefail
          python scripts/add_packet_canonical_names.py
          python scripts/apply_rompack_packet_catalog.py
          python scripts/apply_bootstrap_packet_catalog.py
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit integrated sources
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Integrate generated packet catalog into version packs"
          git push origin HEAD:feature/vanilla-packet-catalog

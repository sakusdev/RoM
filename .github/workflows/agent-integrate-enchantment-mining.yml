name: Agent Integrate Enchantment Mining

on:
  push:
    branches: [agent/item-entity-domain]
    paths:
      - '.github/scripts/agent_integrate_enchantment_mining.py'
      - '.github/workflows/agent-integrate-enchantment-mining.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply enchantment-aware mining
        run: python .github/scripts/agent_integrate_enchantment_mining.py
      - run: cargo fmt --all
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p rom-game enchantment::tests -- --nocapture
      - run: cargo test -p rom-play inventory::tests::explicit_wire_component_can_carry_server_semantic_fields -- --exact
      - run: cargo test -p rom-server mining_runtime::tests::semantic_efficiency_component_changes_selected_mining_tool -- --exact
      - run: cargo test --workspace --no-fail-fast
      - name: Commit validated enchantment mining
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/rom-game/src/enchantment.rs crates/rom-game/src/lib.rs crates/rom-game/src/exports.rs crates/rom-play/src/inventory.rs crates/rom-server/src/mining_runtime.rs
          git commit -m "Use enchantment components for mining"
          git push

name: Apply live block interaction integration

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'feature/live-block-interactions-26-1-2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-block-interactions-26-1-2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply source patch
        run: python3 tools/apply_live_block_interactions_patch.py
      - name: Remove temporary patch machinery
        run: |
          rm tools/apply_live_block_interactions_patch.py
          rm .github/workflows/apply-live-block-interactions.yml
      - name: Format
        run: cargo fmt --all
      - name: Validate
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Enable live protocol 775 block interactions"
          git push origin HEAD:feature/live-block-interactions-26-1-2

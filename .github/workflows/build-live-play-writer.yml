name: Build live Play writer

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feature/live-play-writer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-play-writer
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply and validate
        run: |
          python3 tools/patch_live_writer_state.py
          python3 tools/patch_live_writer_thread_local.py
          python3 tools/patch_live_writer_play.py
          python3 tools/patch_live_writer_helpers.py
          python3 tools/patch_live_writer_tests.py
          python3 tools/patch_live_writer_output_docs.py
          cargo fmt --all
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Connect the live Play writer worker
          branch: feature/live-play-writer
          file_pattern: crates/ferrum-server/src/main.rs crates/ferrum-server/src/authoritative_runtime.rs

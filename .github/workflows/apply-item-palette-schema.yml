name: Apply item palette schema

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/apply-item-palette-schema.yml
      - scripts/apply_item_palette_schema.py
      - crates/rom-bootstrap/src/registry_report.rs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/player-inventory-sync
          fetch-depth: 1
          show-progress: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply item palette schema
        id: integrate
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            python - <<'PY'
            from pathlib import Path
            path = Path('scripts/apply_item_palette_schema.py')
            text = path.read_text(encoding='utf-8')
            text = text.replace('if count != 1:', 'if count < 1:')
            text = text.replace('expected one replacement target', 'expected at least one replacement target')
            path.write_text(text, encoding='utf-8')
            PY
            python scripts/apply_item_palette_schema.py
            if git diff --quiet -- crates Cargo.lock; then
              echo "item palette transform produced no source changes"
              exit 1
            fi
            git diff --stat -- crates Cargo.lock
            cargo fmt --all
            cargo clippy --workspace --all-targets -- -D warnings
            cargo test --workspace
          ) >integration.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            tail -n 180 integration.log
          fi
          exit 0
      - name: Commit failure diagnostics
        if: steps.integrate.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          tail -n 220 integration.log > /tmp/item-palette-schema.log
          git reset --hard HEAD
          mkdir -p diagnostics
          cp /tmp/item-palette-schema.log diagnostics/item-palette-schema.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/item-palette-schema.log
          git commit -m "Record item palette integration diagnostics"
          git push origin HEAD:feature/player-inventory-sync
          exit 1
      - name: Commit integrated sources
        if: steps.integrate.outputs.status == '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates Cargo.lock
          git commit -m "Store generated item protocol IDs in version packs"
          git push origin HEAD:feature/player-inventory-sync

name: Apply item palette schema

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/apply-item-palette-schema.yml
      - scripts/apply_item_palette_schema.py
      - crates/rom-bootstrap/src/registry_report.rs

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/player-inventory-sync
          fetch-depth: 1
          show-progress: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply and validate item palette schema
        id: integrate
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (
            set -euxo pipefail
            python - <<'PY'
            from pathlib import Path
            path = Path('scripts/apply_item_palette_schema.py')
            text = path.read_text(encoding='utf-8')
            text = text.replace('if count != 1:', 'if count < 1:')
            text = text.replace('expected one replacement target', 'expected at least one replacement target')
            path.write_text(text, encoding='utf-8')
            PY
            python scripts/apply_item_palette_schema.py
            git restore scripts/apply_item_palette_schema.py
            cargo fmt --all
            cargo clippy --workspace --all-targets -- -D warnings
            cargo test --workspace
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates Cargo.lock
            git commit -m "Store generated item protocol IDs in version packs"
            commit=$(git rev-parse HEAD)
            branch="automation/item-palette-${GITHUB_RUN_ID}"
            git push origin "HEAD:refs/heads/${branch}"
            {
              echo "commit=${commit}"
              echo "branch=${branch}"
            } >> "$GITHUB_OUTPUT"
          ) >integration.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Report validated commit
        if: steps.integrate.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo 'Validated item palette integration log:'
            echo '```text'
            tail -n 100 integration.log
            echo '```'
          } > validated.md
          gh pr comment 53 --repo sakusdev/RoM --body-file validated.md
      - name: Report integration failure
        if: steps.integrate.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo 'Item palette integration failed:'
            echo '```text'
            tail -n 220 integration.log
            echo '```'
          } > failure.md
          gh pr comment 53 --repo sakusdev/RoM --body-file failure.md
          exit 1

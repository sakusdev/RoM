name: Apply item palette schema

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/apply-item-palette-schema.yml
      - scripts/apply_item_palette_schema.py
      - crates/rom-bootstrap/src/registry_report.rs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Clone, apply, validate, and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          git clone --quiet --depth 1 --branch feature/player-inventory-sync "https://x-access-token:${GH_TOKEN}@github.com/sakusdev/RoM.git" repo
          cd repo
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_item_palette_schema.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('if count != 1:', 'if count < 1:')
          text = text.replace('expected one replacement target', 'expected at least one replacement target')
          text = text.replace(
              'raise SystemExit(f"{path}: expected at least one replacement target, found {count}")',
              'raise SystemExit(f"{path}: target {old[:160]!r} not found; count={count}")',
          )
          text = text.replace(
              "'''            packet_catalog: PacketCatalog::new(['''",
              "'''            packet_catalog: vec!['''",
          )
          text = text.replace(
              "            packet_catalog: PacketCatalog::new(['''",
              "            packet_catalog: vec!['''",
          )
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/apply_item_palette_schema.py
          git restore scripts/apply_item_palette_schema.py
          if git diff --quiet -- crates Cargo.lock; then
            echo 'item palette transform produced no source changes'
            exit 1
          fi
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates Cargo.lock
          git commit -m 'Store generated item protocol IDs in version packs'
          git push origin HEAD:feature/player-inventory-sync

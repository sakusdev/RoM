name: Diagnose item palette transform

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/apply-item-palette-schema.yml
      - scripts/apply_item_palette_schema.py
      - crates/rom-bootstrap/src/registry_report.rs

permissions:
  issues: write
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/player-inventory-sync
          fetch-depth: 1
          show-progress: false
      - name: Apply transform and report result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          (
            set -euxo pipefail
            python - <<'PY'
            from pathlib import Path
            path = Path('scripts/apply_item_palette_schema.py')
            text = path.read_text(encoding='utf-8')
            text = text.replace('if count != 1:', 'if count < 1:')
            text = text.replace('expected one replacement target', 'expected at least one replacement target')
            path.write_text(text, encoding='utf-8')
            PY
            python scripts/apply_item_palette_schema.py
            git restore scripts/apply_item_palette_schema.py
            git diff --stat -- crates Cargo.lock
            git diff --check -- crates Cargo.lock
          ) >diagnose.log 2>&1
          status=$?
          {
            if [ "$status" -eq 0 ]; then
              echo 'Item palette transform succeeded:'
            else
              echo 'Item palette transform failed:'
            fi
            echo '```text'
            cat diagnose.log
            echo '```'
          } > diagnose.md
          gh pr comment 53 --repo sakusdev/RoM --body-file diagnose.md
          exit "$status"

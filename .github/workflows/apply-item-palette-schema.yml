name: Diagnose item palette transform

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/apply-item-palette-schema.yml
      - scripts/apply_item_palette_schema.py
      - crates/rom-bootstrap/src/registry_report.rs

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/player-inventory-sync
          fetch-depth: 1
          show-progress: false
      - name: Apply transform only
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_item_palette_schema.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('if count != 1:', 'if count < 1:')
          text = text.replace('expected one replacement target', 'expected at least one replacement target')
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/apply_item_palette_schema.py
          git restore scripts/apply_item_palette_schema.py
          git diff --stat -- crates Cargo.lock
          git diff --check -- crates Cargo.lock

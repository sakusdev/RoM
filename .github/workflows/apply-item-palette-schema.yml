name: Apply item palette schema

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/apply-item-palette-schema.yml
      - scripts/apply_item_palette_schema.py
      - crates/rom-bootstrap/src/registry_report.rs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/player-inventory-sync
          fetch-depth: 0
          show-progress: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply item palette schema
        id: integrate
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            python - <<'PY'
            from pathlib import Path
            path = Path('scripts/apply_item_palette_schema.py')
            text = path.read_text(encoding='utf-8')
            text = text.replace('if count != 1:', 'if count < 1:')
            text = text.replace('expected one replacement target', 'expected at least one replacement target')
            path.write_text(text, encoding='utf-8')
            PY
            python scripts/apply_item_palette_schema.py
            git restore scripts/apply_item_palette_schema.py
            if git diff --quiet -- crates Cargo.lock; then
              echo "item palette transform produced no source changes"
              exit 1
            fi
            git diff --stat -- crates Cargo.lock
            cargo fmt --all
            cargo clippy --workspace --all-targets -- -D warnings
            cargo test --workspace
          ) >integration.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            tail -n 180 integration.log
          fi
          exit 0
      - name: Commit integration failure diagnostics
        if: steps.integrate.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          tail -n 220 integration.log > /tmp/item-palette-schema.log
          git reset --hard HEAD
          mkdir -p diagnostics
          cp /tmp/item-palette-schema.log diagnostics/item-palette-schema.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/item-palette-schema.log
          git commit -m "Record item palette integration diagnostics"
          git pull --rebase origin feature/player-inventory-sync
          git push origin HEAD:feature/player-inventory-sync
          exit 1
      - name: Publish integrated sources
        id: publish
        if: steps.integrate.outputs.status == '0'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          (
            set -euxo pipefail
            git status --short
            git diff --stat -- crates Cargo.lock
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates Cargo.lock
            git diff --cached --stat
            git commit -m "Store generated item protocol IDs in version packs"
            git fetch origin feature/player-inventory-sync
            git rebase origin/feature/player-inventory-sync
            git push origin HEAD:feature/player-inventory-sync
          ) >publish.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            cat publish.log
          fi
          exit 0
      - name: Commit publish failure diagnostics
        if: steps.integrate.outputs.status == '0' && steps.publish.outputs.status != '0'
        shell: bash
        run: |
          set -euo pipefail
          cp publish.log /tmp/item-palette-publish.log
          git reset --hard HEAD
          git fetch origin feature/player-inventory-sync
          git reset --hard origin/feature/player-inventory-sync
          mkdir -p diagnostics
          cp /tmp/item-palette-publish.log diagnostics/item-palette-publish.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/item-palette-publish.log
          git commit -m "Record item palette publish diagnostics"
          git push origin HEAD:feature/player-inventory-sync
          exit 1

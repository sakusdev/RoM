name: Agent Wire Player Tick

on:
  push:
    branches: [agent/item-entity-domain]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Wire player gameplay into authoritative runtime tick
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/ferrum-server/src/game_runtime.rs")
          text = path.read_text()
          old = '''    pub fn tick(&self) -> Result<(), GameRuntimeError> {
              let outcome = self.write()?.tick_gameplay()?;
              self.publish(&outcome.events)?;
              Ok(())
          }
          '''
          new = '''    pub fn tick(&self) -> Result<(), GameRuntimeError> {
              let events = {
                  let mut state = self.write()?;
                  let mut events = state.tick_player_gameplay()?;
                  events.extend(state.tick_gameplay()?.events);
                  events
              };
              self.publish(&events)?;
              Ok(())
          }
          '''
          if old in text:
              text = text.replace(old, new, 1)
          elif "let mut events = state.tick_player_gameplay()?;" not in text:
              raise SystemExit("game runtime tick insertion marker not found")
          path.write_text(text)
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Commit wired gameplay
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Wire persistent player gameplay into runtime tick"
          git push

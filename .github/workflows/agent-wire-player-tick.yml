name: Agent Wire Player Tick

on:
  push:
    branches: [agent/item-entity-domain]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Wire player gameplay into authoritative tick
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/ferrum-game/src/gameplay_tick.rs")
          text = path.read_text()
          needle = "        let mut outcome = GameplayTickOutcome::empty();\n"
          replacement = needle + "        self.tick_player_gameplay(&mut outcome.events);\n"
          if "self.tick_player_gameplay(&mut outcome.events);" not in text:
              if needle not in text:
                  raise SystemExit("gameplay tick insertion marker not found")
              text = text.replace(needle, replacement, 1)
          path.write_text(text)
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Commit wired gameplay
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Wire persistent player gameplay into tick"
          git push

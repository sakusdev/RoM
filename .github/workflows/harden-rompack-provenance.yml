name: Harden RoM version-pack provenance

on:
  pull_request:
    branches:
      - master
    types:
      - synchronize

permissions:
  contents: write

jobs:
  harden:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'feature/rompack-generation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rompack-generation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Require matching versions.list identity and digest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/rom-bootstrap/src/extract.rs')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('    let game_jar = resolve_game_jar(&official_jar)?;\n',
               '    let game_jar = resolve_game_jar(&official_jar, &manifest.minecraft_version)?;\n'),
              ('fn resolve_game_jar(path: &Path) -> Result<ResolvedGameJar> {\n',
               'fn resolve_game_jar(path: &Path, expected_version: &str) -> Result<ResolvedGameJar> {\n'),
              ('    let listed = read_versions_list(&mut archive)?;\n',
               '    let listed = read_versions_list(&mut archive, expected_version)?;\n'),
              ('fn read_versions_list<R: Read + Seek>(\n    archive: &mut ZipArchive<R>,\n) -> Result<Option<GameJarCandidate>> {\n',
               'fn read_versions_list<R: Read + Seek>(\n    archive: &mut ZipArchive<R>,\n    expected_version: &str,\n) -> Result<Option<GameJarCandidate>> {\n'),
              ('        let path = fields[2];\n        validate_zip_path(path)?;\n',
               '        let listed_version = fields[1];\n        if listed_version != expected_version {\n            bail!(\n                "embedded game JAR version {listed_version} does not match expected {expected_version}"\n            );\n        }\n        let path = fields[2];\n        validate_zip_path(path)?;\n'),
              ('        let sha256 = fields[0];\n        let digest = if sha256.len() == 64 && sha256.bytes().all(|byte| byte.is_ascii_hexdigit()) {\n            Some(sha256.to_ascii_lowercase())\n        } else {\n            None\n        };\n',
               '        let sha256 = fields[0];\n        if sha256.len() != 64 || !sha256.bytes().all(|byte| byte.is_ascii_hexdigit()) {\n            bail!("invalid embedded game JAR SHA-256 in versions.list");\n        }\n        let digest = Some(sha256.to_ascii_lowercase());\n'),
              ('        let resolved = resolve_game_jar(&path).unwrap();\n',
               '        let resolved = resolve_game_jar(&path, "26.1.2").unwrap();\n'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one match, found {text.count(old)}: {old!r}')
              text = text.replace(old, new, 1)

          marker = '''    #[test]
    fn rejects_invalid_registry_json() {'''
          test = '''    #[test]
    fn rejects_mismatched_or_invalid_embedded_jar_provenance() {
        let directory = tempdir().unwrap();
        let game_jar = build_game_jar();
        let outer = build_outer_jar(&game_jar);
        let path = directory.path().join("server.jar");
        fs::write(&path, &outer).unwrap();
        assert!(resolve_game_jar(&path, "different-version").is_err());

        let broken = String::from_utf8(outer)
            .err()
            .map(|_| ())
            .is_none();
        assert!(broken);
    }

'''
          if text.count(marker) != 1:
              raise SystemExit('test insertion marker was not found')
          text = text.replace(marker, test + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/harden-rompack-provenance.yml
      - name: Validate hardened workspace
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit provenance hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden embedded game JAR provenance validation"
          git push origin HEAD:feature/rompack-generation

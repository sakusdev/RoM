name: Apply entity registry integration

on:
  push:
    branches:
      - agent/complete-server-features

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/complete-server-features
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: python3 tools/apply_entity_registry.py
      - run: |
          rm -f tools/apply_entity_registry.py
          rm -f .github/workflows/apply-entity-registry.yml
      - run: cargo fmt --all
      - run: cargo check --workspace --all-targets --all-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: |
          git add -A
          git diff --cached --check
          git commit -m "Build entity protocol registry for replication"
          git push origin HEAD:agent/complete-server-features

name: Apply entity registry integration

on:
  pull_request:
    types:
      - reopened

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'agent/complete-server-features'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/complete-server-features
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Narrow ambiguous transformation anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("tools/apply_entity_registry.py")
          text = path.read_text()
          old = '''text = one(text, """        registry_payloads: Vec<Vec<u8>>,
                  play_policy: PlayPolicy,
          """, """        registry_payloads: Vec<Vec<u8>>,
                  entity_protocol_ids: EntityProtocolRegistry,
                  play_policy: PlayPolicy,
          """, "runtime entity parameter")'''
          new = '''text = one(text, """    fn with_runtime(
                  initial_online_players: i32,
                  world: RomPackWorld,
                  registry_payloads: Vec<Vec<u8>>,
                  play_policy: PlayPolicy,
          """, """    fn with_runtime(
                  initial_online_players: i32,
                  world: RomPackWorld,
                  registry_payloads: Vec<Vec<u8>>,
                  entity_protocol_ids: EntityProtocolRegistry,
                  play_policy: PlayPolicy,
          """, "runtime entity parameter")'''
          if text.count(old) != 1:
              raise SystemExit(f"script anchor expected once, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - run: python3 tools/apply_entity_registry.py
      - run: |
          rm -f tools/apply_entity_registry.py
          rm -f .github/workflows/apply-entity-registry.yml
      - run: cargo fmt --all
      - name: Check or record exact failure
        run: |
          set +e
          cargo check --workspace --all-targets --all-features > entity-check-error.txt 2>&1
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            git add -A
            git commit -m "Record entity palette compile failure"
            git push origin HEAD:agent/complete-server-features
            exit $status
          fi
          rm -f entity-check-error.txt
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: |
          git add -A
          git diff --cached --check
          git commit -m "Build entity protocol registry for replication"
          git push origin HEAD:agent/complete-server-features

name: Apply entity registry integration

on:
  pull_request:
    types:
      - reopened

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'agent/complete-server-features'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/complete-server-features
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply or record exact failure
        run: |
          set +e
          python3 tools/apply_entity_registry.py > entity-transform-error.log 2>&1
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            rm -f .github/workflows/apply-entity-registry.yml
            git add -A
            git commit -m "Record entity transformation failure"
            git push origin HEAD:agent/complete-server-features
            exit $status
          fi
          rm -f entity-transform-error.log
      - run: |
          rm -f tools/apply_entity_registry.py
          rm -f .github/workflows/apply-entity-registry.yml
      - run: cargo fmt --all
      - run: cargo check --workspace --all-targets --all-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: |
          git add -A
          git diff --cached --check
          git commit -m "Build entity protocol registry for replication"
          git push origin HEAD:agent/complete-server-features

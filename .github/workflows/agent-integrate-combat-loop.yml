name: Agent Integrate Combat Loop

on:
  push:
    branches: [agent/item-entity-domain]
    paths:
      - '.github/scripts/agent_integrate_combat_loop.py'
      - '.github/scripts/agent_integrate_combat_loop_v2.py'
      - '.github/workflows/agent-integrate-combat-loop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply authoritative combat loop
        run: |
          python .github/scripts/agent_integrate_combat_loop_v2.py
          python .github/scripts/agent_integrate_combat_loop.py
      - run: cargo fmt --all
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p rom-protocol packet_catalog::tests::recognizes_attack_as_serverbound_play_packet -- --exact
      - run: cargo test -p rom-version-26-1-2 tests::uses_the_documented_configuration_packet_ids -- --exact
      - run: cargo test -p rom-server play_input::tests::decodes_dedicated_attack_entity_id -- --exact
      - run: cargo test -p rom-server combat_runtime::tests -- --nocapture
      - run: cargo test --workspace --no-fail-fast
      - name: Commit validated combat loop
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/rom-protocol/src/lib.rs crates/rom-protocol/src/packet_catalog.rs crates/rom-version-26-1-2/src/lib.rs crates/rom-server/src/play_input.rs crates/rom-server/src/authoritative_runtime.rs crates/rom-server/src/combat_runtime.rs crates/rom-server/src/lib.rs crates/rom-server/src/play_runtime.rs
          git commit -m "Integrate authoritative player attacks"
          git push

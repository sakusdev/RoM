name: Export current Play branch

on:
  push:
    branches:
      - feature/minimal-play-26-1-2

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/minimal-play-26-1-2
      - uses: actions/upload-artifact@v4
        with:
          name: rom-current-play-branch
          path: |
            Cargo.toml
            Cargo.lock
            README.md
            crates
            docs
          if-no-files-found: error

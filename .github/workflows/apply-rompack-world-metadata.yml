name: Capture generated world metadata diagnostics

on:
  pull_request:
    branches: [master]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  capture:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'feature/rompack-world-metadata'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rompack-world-metadata
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_rompack_world_metadata.py')
          text = path.read_text(encoding='utf-8')
          old_condition = '    if count != 1:\n'
          old_message = 'expected one match, found {count}'
          if old_condition in text:
              text = text.replace(old_condition, '    if count < 1:\n', 1)
          if old_message in text:
              text = text.replace(old_message, 'expected at least one match, found {count}', 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 tools/apply_rompack_world_metadata.py
          rm tools/apply_rompack_world_metadata.py
          cargo fmt --all
      - name: Capture validation diagnostics
        run: |
          set +e
          cargo clippy --workspace --all-targets -- -D warnings > world-metadata-validation.txt 2>&1
          clippy_status=$?
          cargo test --workspace >> world-metadata-validation.txt 2>&1
          test_status=$?
          printf '\nclippy_status=%s\ntest_status=%s\n' "$clippy_status" "$test_status" >> world-metadata-validation.txt
          exit 0
      - name: Commit generated source and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/BOOTSTRAP.md \
            crates/ferrum-rompack/src/lib.rs crates/rom-bootstrap/src/extract.rs \
            crates/rom-bootstrap/src/main.rs crates/ferrum-server/src/main.rs \
            crates/ferrum-server/src/play_runtime.rs tools/apply_rompack_world_metadata.py \
            world-metadata-validation.txt
          git diff --cached --check
          git commit -m "Stage generated world metadata integration"
          git push origin HEAD:feature/rompack-world-metadata

name: Apply generated world metadata

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'feature/rompack-world-metadata'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rompack-world-metadata
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Allow ordered replacement of repeated source shapes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_rompack_world_metadata.py')
          text = path.read_text(encoding='utf-8')
          old_condition = '    if count != 1:\n'
          old_message = 'expected one match, found {count}'
          if text.count(old_condition) != 1:
              raise SystemExit(f'expected one replacement guard, found {text.count(old_condition)}')
          if text.count(old_message) != 1:
              raise SystemExit(f'expected one guard message, found {text.count(old_message)}')
          text = text.replace(old_condition, '    if count < 1:\n', 1)
          text = text.replace(old_message, 'expected at least one match, found {count}', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - id: patch
        name: Apply source patch
        continue-on-error: true
        run: |
          rm -f world-metadata-patch-diagnostics.txt
          python3 tools/apply_rompack_world_metadata.py > world-metadata-patch-diagnostics.txt 2>&1
      - name: Preserve patch diagnostics
        if: steps.patch.outcome == 'failure'
        run: |
          git checkout -- . ':!world-metadata-patch-diagnostics.txt' ':!.github/workflows/apply-rompack-world-metadata.yml' || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-metadata-patch-diagnostics.txt
          git commit -m "Capture world metadata patch diagnostics"
          git push origin HEAD:feature/rompack-world-metadata
          exit 1
      - name: Remove patch machinery and format
        if: steps.patch.outcome == 'success'
        run: |
          rm -f world-metadata-patch-diagnostics.txt
          rm tools/apply_rompack_world_metadata.py
          cargo fmt --all
      - name: Validate workspace
        if: steps.patch.outcome == 'success'
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit source implementation
        if: steps.patch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/BOOTSTRAP.md \
            crates/ferrum-rompack/src/lib.rs crates/rom-bootstrap/src/extract.rs \
            crates/rom-bootstrap/src/main.rs crates/ferrum-server/src/main.rs \
            crates/ferrum-server/src/play_runtime.rs tools/apply_rompack_world_metadata.py \
            world-metadata-patch-diagnostics.txt
          git diff --cached --check
          git commit -m "Load world metadata from generated version packs"
          git push origin HEAD:feature/rompack-world-metadata

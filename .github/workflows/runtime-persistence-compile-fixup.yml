name: Runtime persistence compile fixup

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.head_ref == 'feature/vanilla-runtime-persistence' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vanilla-runtime-persistence
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Fix runtime persistence compilation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/fix_runtime_persistence_compile.py
          cargo fmt --all
          git add crates/ferrum-server/src/game_service.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix runtime persistence compilation"
          git push origin HEAD:feature/vanilla-runtime-persistence

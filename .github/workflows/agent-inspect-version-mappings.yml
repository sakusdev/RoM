name: Inspect 26.1.2 respawn protocol

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: agent-inspect-version-mappings
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.event.pull_request.number == 61 &&
      github.event.pull_request.head.ref == 'agent/complete-server-features'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-server-features
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Inspect official respawn and client-command codecs
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p rom-bootstrap -- prepare \
            --instance /tmp/rom-inspect \
            --version 26.1.2 \
            --accept-minecraft-eula \
            --json > /tmp/prepare.json
          outer=$(jq -r '.official_server_jar' /tmp/prepare.json)
          python3 - "$outer" <<'PY'
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = sorted(
                  name for name in archive.namelist()
                  if name.startswith("META-INF/versions/") and name.endswith(".jar")
              )
              if not names:
                  raise SystemExit("official bundle has no inner game jar")
              with open("/tmp/game.jar", "wb") as output:
                  output.write(archive.read(names[0]))
          PY

          mkdir -p /tmp/generated
          java -DbundlerMainClass=net.minecraft.data.Main -jar "$outer" \
            --reports --output /tmp/generated > /tmp/generator.log 2>&1
          report=/tmp/generated/reports/packets.json

          classes=(
            net.minecraft.network.protocol.game.ServerboundClientCommandPacket
            'net.minecraft.network.protocol.game.ServerboundClientCommandPacket$Action'
            net.minecraft.network.protocol.game.ClientboundRespawnPacket
            net.minecraft.network.protocol.game.CommonPlayerSpawnInfo
            net.minecraft.world.damagesource.DamageType
            net.minecraft.world.level.dimension.DimensionType
          )
          {
            echo 'packet_ids:'
            jq '{client_command: .play.serverbound["minecraft:client_command"], respawn: .play.clientbound["minecraft:respawn"], damage_event: .play.clientbound["minecraft:damage_event"], hurt_animation: .play.clientbound["minecraft:hurt_animation"], player_combat_kill: .play.clientbound["minecraft:player_combat_kill"]}' "$report"
            echo 'class_codecs:'
            for class in "${classes[@]}"; do
              echo "===== $class ====="
              javap -classpath /tmp/game.jar -p -c -s -constants "$class"
            done
          } > .github/version-mapping-diagnostic.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/version-mapping-diagnostic.txt
          git commit -m "Record respawn client-command protocol details"
          git push origin HEAD:agent/complete-server-features

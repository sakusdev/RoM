name: Inspect 26.1.2 packet bytecode

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: agent-inspect-version-mappings
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.event.pull_request.number == 61 &&
      github.event.pull_request.head.ref == 'agent/complete-server-features'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-server-features
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Inspect exact official packet classes
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p rom-bootstrap -- prepare \
            --instance /tmp/rom-inspect \
            --version 26.1.2 \
            --accept-minecraft-eula \
            --json > /tmp/prepare.json
          outer=$(jq -r '.official_server_jar' /tmp/prepare.json)
          python3 - "$outer" <<'PY'
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = sorted(
                  name for name in archive.namelist()
                  if name.startswith("META-INF/versions/") and name.endswith(".jar")
              )
              if not names:
                  raise SystemExit("official bundle has no inner game jar")
              with open("/tmp/game.jar", "wb") as output:
                  output.write(archive.read(names[0]))
          PY

          classes=(
            net.minecraft.network.protocol.game.ClientboundSetHealthPacket
            net.minecraft.network.protocol.game.ClientboundDamageEventPacket
            net.minecraft.network.protocol.game.ClientboundHurtAnimationPacket
            net.minecraft.network.protocol.game.ClientboundPlayerCombatKillPacket
            net.minecraft.network.protocol.game.ClientboundRespawnPacket
            net.minecraft.network.protocol.game.CommonPlayerSpawnInfo
          )
          : > .github/version-mapping-diagnostic.txt
          for class in "${classes[@]}"; do
            {
              echo "===== $class ====="
              javap -classpath /tmp/game.jar -p -c -s "$class"
            } >> .github/version-mapping-diagnostic.txt
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/version-mapping-diagnostic.txt
          git commit -m "Record exact combat and respawn packet codecs"
          git push origin HEAD:agent/complete-server-features

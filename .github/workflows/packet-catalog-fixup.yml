name: Packet catalog fixup

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.head_ref == 'feature/vanilla-packet-catalog' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vanilla-packet-catalog
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply packet catalog integration
        id: integrate
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          : > packet-catalog-integration.log
          status=0
          for script in \
            scripts/apply_packet_catalog_protocol.py \
            scripts/add_packet_canonical_names.py \
            scripts/apply_rompack_packet_catalog.py \
            scripts/apply_bootstrap_packet_catalog.py \
            scripts/apply_server_packet_catalog.py
          do
            echo "=== $script ===" | tee -a packet-catalog-integration.log
            python "$script" >> packet-catalog-integration.log 2>&1
            status=$?
            if [ "$status" -ne 0 ]; then
              break
            fi
          done
          if [ "$status" -eq 0 ]; then
            echo "=== cargo fmt ===" | tee -a packet-catalog-integration.log
            cargo fmt --all >> packet-catalog-integration.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            echo "=== cargo check ===" | tee -a packet-catalog-integration.log
            cargo check --workspace >> packet-catalog-integration.log 2>&1
            status=$?
          fi
          cat packet-catalog-integration.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload integration diagnostics
        if: steps.integrate.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: packet-catalog-integration
          path: packet-catalog-integration.log
      - name: Commit packet catalog integration
        if: steps.integrate.outputs.status == '0'
        run: |
          set -euo pipefail
          git add Cargo.toml Cargo.lock crates/ferrum-protocol crates/ferrum-rompack crates/rom-bootstrap crates/ferrum-server
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add data-driven packet catalog ingestion"
          git push origin HEAD:feature/vanilla-packet-catalog
      - name: Fail when integration failed
        if: steps.integrate.outputs.status != '0'
        run: exit 1

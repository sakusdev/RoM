name: Agent Integrate RoM Entity Metadata

on:
  push:
    branches: [agent/item-entity-domain]
    paths:
      - '.github/scripts/agent_integrate_entity_metadata_rom.py'
      - '.github/workflows/agent-integrate-entity-metadata-rom.yml'
      - 'crates/rom-play/src/entity_data.rs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply entity metadata integration
        run: python .github/scripts/agent_integrate_entity_metadata_rom.py
      - name: Format
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --no-fail-fast
      - name: Commit validated integration
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/rom-play/src/lib.rs crates/rom-version-26-1-2/src/lib.rs crates/rom-server/src/game_replication.rs
          git commit -m "Replicate authoritative item and XP entity metadata"
          git push

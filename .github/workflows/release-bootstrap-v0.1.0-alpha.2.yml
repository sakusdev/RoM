name: Release rom-bootstrap v0.1.0-alpha.2

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/release-bootstrap-v0.1.0-alpha.2.yml

permissions:
  contents: write

concurrency:
  group: release-rom-bootstrap-v0.1.0-alpha.2
  cancel-in-progress: false

env:
  TAG_NAME: v0.1.0-alpha.2
  CRATE_NAME: rom-bootstrap

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('Cargo.toml').read_text()
          match = re.search(r'(?m)^version\s*=\s*"([^"]+)"', root)
          if not match:
              raise SystemExit('workspace package version not found')
          version = match.group(1)
          if version != '0.1.0':
              raise SystemExit(f'expected workspace version 0.1.0, got {version}')
          PY
          case "$TAG_NAME" in
            v0.1.0-alpha.2) ;;
            *) echo "unexpected tag: $TAG_NAME" >&2; exit 1 ;;
          esac
      - name: Build release binary
        run: cargo build --release -p rom-bootstrap --bin rom-bootstrap
      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux) os_name=linux ;;
            macOS) os_name=macos ;;
            Windows) os_name=windows ;;
            *) echo "unsupported runner OS: ${{ runner.os }}" >&2; exit 1 ;;
          esac
          arch="$(uname -m | tr '[:upper:]' '[:lower:]')"
          case "$arch" in
            x86_64|amd64) arch=x86_64 ;;
            arm64|aarch64) arch=aarch64 ;;
          esac
          mkdir -p dist package
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/rom-bootstrap.exe "package/rom-bootstrap-${TAG_NAME}-${os_name}-${arch}.exe"
            (cd package && 7z a "../dist/rom-bootstrap-${TAG_NAME}-${os_name}-${arch}.zip" ./*)
          else
            cp target/release/rom-bootstrap "package/rom-bootstrap-${TAG_NAME}-${os_name}-${arch}"
            tar -C package -czf "dist/rom-bootstrap-${TAG_NAME}-${os_name}-${arch}.tar.gz" .
          fi
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          for path in sorted(Path('dist').iterdir()):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              Path('dist', f'{path.name}.sha256').write_text(f'{digest}  {path.name}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rom-bootstrap-${{ env.TAG_NAME }}-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Prepare release notes and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find release-artifacts -type f -print -exec cp {} dist/ \;
          (cd dist && cat *.sha256 | sort > SHA256SUMS.txt)
          cat > RELEASE_NOTES.md <<EOF
          # RoM Bootstrap ${TAG_NAME}

          Pre-release build of \`rom-bootstrap\` from the workspace version \`0.1.0\`.

          ## Versioning
          - Tag: \`${TAG_NAME}\`
          - Package: \`rom-bootstrap\`
          - Cargo workspace version: \`0.1.0\`
          - Channel: \`alpha.2\`
          - Source commit: \`${GITHUB_SHA}\`

          ## Assets
          - Linux: \`rom-bootstrap-${TAG_NAME}-linux-*.tar.gz\`
          - Windows: \`rom-bootstrap-${TAG_NAME}-windows-*.zip\`
          - macOS: \`rom-bootstrap-${TAG_NAME}-macos-*.tar.gz\`
          - Checksums: per-file \`.sha256\` files and \`SHA256SUMS.txt\`

          EOF
      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" dist/* --clobber
            gh release edit "${TAG_NAME}" \
              --title "RoM Bootstrap ${TAG_NAME}" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          else
            gh release create "${TAG_NAME}" dist/* \
              --target "${GITHUB_SHA}" \
              --title "RoM Bootstrap ${TAG_NAME}" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          fi
      - name: Commit release manifest and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/releases
          cat > docs/releases/v0.1.0-alpha.2.md <<EOF
          # v0.1.0-alpha.2

          Released by the one-shot bootstrap release workflow.

          - Package: \`rom-bootstrap\`
          - Cargo workspace version: \`0.1.0\`
          - Tag: \`v0.1.0-alpha.2\`
          - Source commit: \`${GITHUB_SHA}\`
          - Channel: alpha pre-release
          - Assets: Linux/macOS tarballs, Windows zip, per-file SHA-256 files, and \`SHA256SUMS.txt\`
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/release-bootstrap-v0.1.0-alpha.2.yml
          git add docs/releases/v0.1.0-alpha.2.md .github/workflows/release-bootstrap-v0.1.0-alpha.2.yml
          git commit -m "Record rom-bootstrap v0.1.0-alpha.2 release"
          git push origin HEAD:master

name: Apply registry data 26.1.2

on:
  push:
    branches:
      - feature/registry-data-26-1-2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/registry-data-26-1-2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply implementation
        run: |
          base64 --decode tools/registry-data-26.1.2.patch.gz.b64 | gzip --decompress > /tmp/registry-data.patch
          git apply --check /tmp/registry-data.patch
          git apply /tmp/registry-data.patch
          rm tools/registry-data-26.1.2.patch.gz.b64
          rm tools/capture_registry_manifest_2612.py
          rm -f tools/.registry-capture-trigger
          rm .github/workflows/export-vanilla-2612-data.yml
          rm .github/workflows/apply-registry-data-2612.yml
      - name: Validate workspace
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          python3 -m py_compile tools/generate_registry_manifest_2612.py
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Synchronize Minecraft 26.1.2 registries"
          git push origin HEAD:feature/registry-data-26-1-2

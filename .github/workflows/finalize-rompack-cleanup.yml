name: Finalize RoM version-pack cleanup

on:
  pull_request:
    branches:
      - master
    types:
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'feature/rompack-generation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rompack-generation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Remove extraction warnings and diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/rom-bootstrap/src/extract.rs')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('    fs::{self, File},\n', '    fs,\n'),
              ('    let Ok(mut file) = archive.by_name("META-INF/versions.list") else {\n',
               '    let Ok(file) = archive.by_name("META-INF/versions.list") else {\n'),
              ('        let mut file = archive.by_index(index)?;\n',
               '        let file = archive.by_index(index)?;\n'),
              ('    let mut file = archive\n        .by_name(path)\n',
               '    let file = archive\n        .by_name(path)\n'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one match, found {text.count(old)}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f rompack-fix-diagnostics.txt
          rm .github/workflows/finalize-rompack-cleanup.yml
      - name: Validate finalized workspace
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit finalized implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize deterministic version-pack generation"
          git push origin HEAD:feature/rompack-generation

name: Registered inventory implementation runner

on:
  push:
    branches:
      - agent/complete-inventory-containers
    paths:
      - .github/workflows/agent-inventory-registered-runner.yml

permissions:
  contents: write

concurrency:
  group: registered-inventory-runner
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-inventory-containers
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply implementation and publish diagnostics
        shell: bash
        run: |
          set +e
          LOG="$RUNNER_TEMP/inventory-runner.log"
          {
            python - <<'PYCODE'
          import base64
          import lzma
          import re
          from pathlib import Path
          text = Path('.github/workflows/agent-complete-inventory.yml').read_text()
          match = re.search(r"payload = '([^']+)'", text)
          if match is None:
              raise SystemExit('implementation payload missing')
          source = lzma.decompress(base64.b64decode(match.group(1))).decode('utf-8')
          exec(compile(source, 'apply_complete_inventory.py', 'exec'))
          PYCODE
            cargo fmt --all
            cargo fmt --all --check
            cargo clippy --workspace --all-targets -- -D warnings
            cargo test --workspace
          } >"$LOG" 2>&1
          STATUS=$?
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$STATUS" -eq 0 ]; then
            rm -f .github/agent-complete-inventory-error.log
            git add crates Cargo.lock
            if git diff --cached --quiet; then
              echo 'No source changes were produced.' > .github/agent-complete-inventory-error.log
              git add .github/agent-complete-inventory-error.log
              git commit -m 'Record empty inventory implementation result'
              git push origin HEAD:agent/complete-inventory-containers
              exit 1
            fi
            git commit -m 'Complete authoritative inventory and containers'
            git push origin HEAD:agent/complete-inventory-containers
            cat "$LOG"
            exit 0
          fi
          {
            echo 'Complete inventory implementation failed.'
            echo
            tail -n 4000 "$LOG"
          } > .github/agent-complete-inventory-error.log
          git add .github/agent-complete-inventory-error.log
          git commit -m 'Record inventory implementation diagnostics'
          git push origin HEAD:agent/complete-inventory-containers
          cat "$LOG"
          exit "$STATUS"

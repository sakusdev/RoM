name: Apply player entity replication

on:
  push:
    branches:
      - agent/complete-server-features

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/complete-server-features

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply implementation
        run: python3 tools/apply_player_entity_replication.py

      - name: Remove temporary implementation files
        run: |
          rm -f tools/apply_player_entity_replication.py
          rm -f .github/workflows/apply-player-entity-replication.yml

      - name: Format
        run: cargo fmt --all

      - name: Check all targets and features
        run: cargo check --workspace --all-targets --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Commit validated source
        run: |
          git add -A
          git diff --cached --check
          git commit -m "Replicate player entities across live connections"
          git push origin HEAD:agent/complete-server-features

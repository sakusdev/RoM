name: Runtime persistence fixup

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.head_ref == 'feature/vanilla-runtime-persistence' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vanilla-runtime-persistence
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply global runtime and persistence wiring
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/apply_game_service_domain.py
          python scripts/apply_server_process_runtime.py
          cargo fmt --all
          git add Cargo.toml Cargo.lock crates/ferrum-game crates/ferrum-server
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Wire global gameplay service and persistence"
          git push origin HEAD:feature/vanilla-runtime-persistence

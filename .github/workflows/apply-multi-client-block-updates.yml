name: Apply multi-client block updates

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'feature/multi-client-block-updates'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multi-client-block-updates
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply source patch
        run: python3 tools/apply_multi_client_block_updates.py
      - name: Remove temporary patch machinery
        run: |
          rm tools/apply_multi_client_block_updates.py
          rm .github/workflows/apply-multi-client-block-updates.yml
      - name: Format
        run: cargo fmt --all
      - name: Validate
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Broadcast bounded multi-client block updates"
          git push origin HEAD:feature/multi-client-block-updates

name: Fix generated world metadata validation

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'feature/rompack-world-metadata'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rompack-world-metadata
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Fix generated source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          extract = Path('crates/rom-bootstrap/src/extract.rs')
          lines = extract.read_text(encoding='utf-8').splitlines()

          record_start = next(i for i, line in enumerate(lines) if line.strip() == 'let record = PackRecord {')
          record_end = next(i for i in range(record_start + 1, len(lines)) if lines[i].strip() == '};')
          forbidden = {
              'world_data_version: pack.world.data_version,',
              'overworld_min_section_y: pack.world.overworld_min_section_y,',
              'overworld_section_count: pack.world.overworld_section_count,',
          }
          lines = [
              line for i, line in enumerate(lines)
              if not (record_start < i < record_end and line.strip() in forbidden)
          ]

          function_start = next(i for i, line in enumerate(lines) if line.startswith('fn report_from_existing('))
          report_start = next(i for i in range(function_start, len(lines)) if lines[i].strip() == 'GenerateReport {')
          report_end = next(i for i in range(report_start + 1, len(lines)) if lines[i].strip() == '}')
          existing = {line.strip() for line in lines[report_start:report_end]}
          insertion = [
              '        world_data_version: pack.world.data_version,',
              '        overworld_min_section_y: pack.world.overworld_min_section_y,',
              '        overworld_section_count: pack.world.overworld_section_count,',
          ]
          if not all(line.strip() in existing for line in insertion):
              packet_line = next(
                  i for i in range(report_start, report_end)
                  if lines[i].strip() == 'packet_count: summary.packet_count,'
              )
              lines[packet_line + 1:packet_line + 1] = insertion
          extract.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          main = Path('crates/ferrum-server/src/main.rs')
          text = main.read_text(encoding='utf-8')
          start_marker = '    fn new(initial_online_players: i32) -> Self {'
          end_marker = '    fn with_world(initial_online_players: i32, world: RomPackWorld) -> Result<Self> {'
          if start_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              text = text[:start] + text[end:]
          main.write_text(text, encoding='utf-8')

          play = Path('crates/ferrum-server/src/play_runtime.rs')
          text = play.read_text(encoding='utf-8')
          marker = '    pub(super) fn static_flat() -> Self {'
          replacement = '    #[cfg(test)]\n' + marker
          if replacement not in text:
              if marker not in text:
                  raise SystemExit('SharedWorld::static_flat marker was not found')
              text = text.replace(marker, replacement, 1)
          play.write_text(text, encoding='utf-8')
          PY
          rm -f world-metadata-validation.txt
          rm -f .github/workflows/apply-rompack-world-metadata.yml
          cargo fmt --all
      - id: validate
        name: Validate finalized workspace
        continue-on-error: true
        run: |
          set +e
          cargo clippy --workspace --all-targets -- -D warnings > world-metadata-final-validation.txt 2>&1
          clippy_status=$?
          cargo test --workspace >> world-metadata-final-validation.txt 2>&1
          test_status=$?
          printf '\nclippy_status=%s\ntest_status=%s\n' "$clippy_status" "$test_status" >> world-metadata-final-validation.txt
          test "$clippy_status" -eq 0 -a "$test_status" -eq 0
      - name: Commit diagnostics on failure
        if: steps.validate.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture final world metadata diagnostics"
          git push origin HEAD:feature/rompack-world-metadata
          exit 1
      - name: Commit finalized implementation
        if: steps.validate.outcome == 'success'
        run: |
          rm -f world-metadata-final-validation.txt
          rm .github/workflows/fix-world-metadata-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize generated world metadata runtime"
          git push origin HEAD:feature/rompack-world-metadata

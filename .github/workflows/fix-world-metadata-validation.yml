name: Finalize generated world metadata

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'feature/rompack-world-metadata'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rompack-world-metadata
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Restore the test-only server state constructor
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/ferrum-server/src/main.rs')
          text = path.read_text(encoding='utf-8')
          marker = 'impl ServerState {\n'
          constructor = '''impl ServerState {
              #[cfg(test)]
              fn new(initial_online_players: i32) -> Self {
                  Self::with_world(initial_online_players, play_runtime::builtin_world_profile())
                      .expect("built-in world profile must initialize")
              }

          '''
          if constructor not in text:
              if text.count(marker) != 1:
                  raise SystemExit(f'expected one ServerState impl, found {text.count(marker)}')
              text = text.replace(marker, constructor, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f world-metadata-final-validation.txt
          rm -f world-metadata-validation.txt
          rm -f .github/workflows/apply-rompack-world-metadata.yml
          cargo fmt --all
      - name: Validate finalized workspace
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit finalized implementation
        run: |
          rm .github/workflows/fix-world-metadata-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize generated world metadata runtime"
          git push origin HEAD:feature/rompack-world-metadata

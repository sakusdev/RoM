name: Complete server features

on:
  push:
    branches:
      - agent/complete-server-features

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for implementation script
        id: ready
        shell: bash
        run: |
          if [[ -f tools/apply_complete_server_features.py ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Git
        if: steps.ready.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Include Configuration registry fix
        if: steps.ready.outputs.ready == 'true'
        run: |
          git fetch origin hotfix/configuration-tag-registry-filter
          git cherry-pick --no-commit 72ed6df3bad99819c4e57011774bfd9daa295a5b

      - name: Apply feature implementation
        if: steps.ready.outputs.ready == 'true'
        run: python3 tools/apply_complete_server_features.py

      - name: Remove temporary implementation files
        if: steps.ready.outputs.ready == 'true'
        run: |
          rm -f tools/apply_complete_server_features.py
          rm -f .github/workflows/complete-server-features.yml

      - name: Format
        if: steps.ready.outputs.ready == 'true'
        run: cargo fmt --all

      - name: Check all targets and features
        if: steps.ready.outputs.ready == 'true'
        run: cargo check --workspace --all-targets --all-features

      - name: Clippy
        if: steps.ready.outputs.ready == 'true'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        if: steps.ready.outputs.ready == 'true'
        run: cargo test --workspace --all-features

      - name: Commit validated implementation
        if: steps.ready.outputs.ready == 'true'
        run: |
          git add -A
          git diff --cached --check
          git commit -m "Add native player chat and configuration compatibility"
          git push origin HEAD:agent/complete-server-features

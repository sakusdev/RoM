name: Export Bootstrap release bundles

on:
  pull_request:
    branches:
      - master
    types:
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  export:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'feature/bootstrap-release-bundles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bootstrap-release-bundles
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply release integration
        run: python3 tools/apply_bootstrap_release_bundles.py
      - name: Remove temporary files from exported tree
        run: |
          rm -f tools/apply_bootstrap_release_bundles.py
          rm -f .github/workflows/apply-bootstrap-release-bundles.yml
          rm -f docs/.release-bundle-stage noop x y
      - name: Validate release workflow structure
        run: |
          python3 - <<'PY'
          from pathlib import Path

          text = Path('.github/workflows/release.yml').read_text(encoding='utf-8')
          assert text.count('bootstrap_binary:') == 5
          assert text.count('bootstrap_raw_asset:') == 5
          assert '-p ferrum-server -p rom-bootstrap' in text
          assert 'dist/rom-bootstrap-*' in text
          assert 'NOTICE.md' in text
          assert 'docs/BOOTSTRAP.md' in text
          assert 'wc -l < SHA256SUMS)" -eq 15' in text
          assert "assets | length')\" -ge 31" in text
          PY
      - name: Validate workspace
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Export final files and patch
        run: |
          mkdir -p export/.github/workflows export/crates/rom-bootstrap/src export/docs
          cp .github/workflows/release.yml export/.github/workflows/release.yml
          cp crates/rom-bootstrap/src/lib.rs export/crates/rom-bootstrap/src/lib.rs
          cp README.md export/README.md
          cp docs/BOOTSTRAP.md export/docs/BOOTSTRAP.md
          git diff --binary HEAD -- .github/workflows/release.yml crates/rom-bootstrap/src/lib.rs README.md docs/BOOTSTRAP.md > export/final.patch
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-release-final-files
          path: export
          if-no-files-found: error
          retention-days: 1

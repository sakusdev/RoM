name: Finalize configurable Play runtime policy

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'feature/configurable-play-policy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/configurable-play-policy
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Mark compatibility constructors as test-only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ferrum-server/src/play_runtime.rs')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'impl SharedWorld {\n    pub(super) fn new(center: ChunkPos, profile: RomPackWorld) -> Result<Self> {',
                  'impl SharedWorld {\n    #[cfg(test)]\n    pub(super) fn new(center: ChunkPos, profile: RomPackWorld) -> Result<Self> {',
              ),
              (
                  'fn new_local_world_runtime(center: ChunkPos, profile: &RomPackWorld) -> Result<LocalWorldRuntime> {',
                  '#[cfg(test)]\nfn new_local_world_runtime(center: ChunkPos, profile: &RomPackWorld) -> Result<LocalWorldRuntime> {',
              ),
          ]
          for old, new in replacements:
              if new not in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'expected one compatibility helper: {old}')
                  text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f play-policy-validation.txt
          cargo fmt --all
      - name: Validate finalized workspace
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit finalized implementation
        run: |
          rm .github/workflows/apply-configurable-play-policy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize configurable Play runtime policy"
          git push origin HEAD:feature/configurable-play-policy

name: Apply Windows accepted socket hotfix

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'hotfix/windows-accepted-socket-blocking'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/windows-accepted-socket-blocking
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply explicit blocking-mode configuration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('crates/ferrum-server/src/main.rs')
          text = path.read_text()
          pattern = re.compile(
              r'(?m)^(?P<indent>\s*)Ok\(\(mut stream, _address\)\) => \{\n'
              r'(?P=indent)    let _ = stream\.set_read_timeout\(Some\(Duration::from_secs\(10\)\)\);\n'
              r'(?P=indent)    let _ = stream\.set_write_timeout\(Some\(Duration::from_secs\(10\)\)\);\n'
          )

          def replace_accept(match: re.Match[str]) -> str:
              indent = match.group('indent')
              return (
                  f'{indent}Ok((mut stream, _address)) => {{\n'
                  f'{indent}    if let Err(error) = configure_client_stream(&stream) {{\n'
                  f'{indent}        eprintln!("cannot configure accepted client socket: {{error}}");\n'
                  f'{indent}        continue;\n'
                  f'{indent}    }}\n'
              )

          text, count = pattern.subn(replace_accept, text, count=1)
          if count != 1:
              raise SystemExit(f'accepted stream configuration replacement count was {count}')

          anchor = 'fn reap_finished_clients(clients: &mut Vec<thread::JoinHandle<()>>) {\n'
          helper = '''fn configure_client_stream(stream: &TcpStream) -> io::Result<()> {
              // On Windows, a socket accepted from a non-blocking listener can retain
              // non-blocking mode. The protocol handlers use blocking reads with bounded
              // timeouts, so normalize every accepted connection explicitly.
              stream.set_nonblocking(false)?;
              stream.set_read_timeout(Some(Duration::from_secs(10)))?;
              stream.set_write_timeout(Some(Duration::from_secs(10)))?;
              Ok(())
          }

          fn reap_finished_clients(clients: &mut Vec<thread::JoinHandle<()>>) {
          '''
          if anchor not in text:
              raise SystemExit('client helper anchor missing')
          text = text.replace(anchor, helper, 1)
          path.write_text(text)
          PY
      - name: Validate workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- crates/ferrum-server/src/main.rs; then
            echo 'No source changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ferrum-server/src/main.rs
          git commit -m 'Restore blocking mode for accepted client sockets'
          git push origin HEAD:hotfix/windows-accepted-socket-blocking

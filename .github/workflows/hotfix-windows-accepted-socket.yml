name: Apply Windows accepted socket hotfix

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'hotfix/windows-accepted-socket-blocking'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/windows-accepted-socket-blocking
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply explicit blocking-mode configuration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/ferrum-server/src/main.rs')
          text = path.read_text()
          old = '''            Ok((mut stream, _address)) => {
                      let _ = stream.set_read_timeout(Some(Duration::from_secs(10)));
                      let _ = stream.set_write_timeout(Some(Duration::from_secs(10)));
          '''
          new = '''            Ok((mut stream, _address)) => {
                      if let Err(error) = configure_client_stream(&stream) {
                          eprintln!("cannot configure accepted client socket: {error}");
                          continue;
                      }
          '''
          if old not in text:
              raise SystemExit('accepted stream configuration anchor missing')
          text = text.replace(old, new, 1)

          anchor = '''fn reap_finished_clients(clients: &mut Vec<thread::JoinHandle<()>>) {
          '''
          helper = '''fn configure_client_stream(stream: &TcpStream) -> io::Result<()> {
              // On Windows, a socket accepted from a non-blocking listener can retain
              // non-blocking mode. The protocol handlers use blocking reads with bounded
              // timeouts, so normalize every accepted connection explicitly.
              stream.set_nonblocking(false)?;
              stream.set_read_timeout(Some(Duration::from_secs(10)))?;
              stream.set_write_timeout(Some(Duration::from_secs(10)))?;
              Ok(())
          }

          fn reap_finished_clients(clients: &mut Vec<thread::JoinHandle<()>>) {
          '''
          if anchor not in text:
              raise SystemExit('client helper anchor missing')
          text = text.replace(anchor, helper, 1)
          path.write_text(text)
          PY
      - name: Validate workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- crates/ferrum-server/src/main.rs; then
            echo 'No source changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ferrum-server/src/main.rs
          git commit -m 'Restore blocking mode for accepted client sockets'
          git push origin HEAD:hotfix/windows-accepted-socket-blocking

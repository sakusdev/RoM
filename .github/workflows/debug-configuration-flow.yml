name: Debug configuration flow

on:
  pull_request:
    branches:
      - master

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/configuration-wire-flow
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python3 tools/apply_configuration_flow.py
      - run: cargo fmt --all
      - name: Run Clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings > clippy.log 2>&1
      - name: Run tests
        continue-on-error: true
        run: cargo test --workspace > test.log 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: configuration-flow-debug
          path: |
            crates/ferrum-nbt/src/lib.rs
            crates/ferrum-protocol/src/lib.rs
            crates/ferrum-server/src/main.rs
            crates/ferrum-configuration/src/lib.rs
            clippy.log
            test.log
          if-no-files-found: warn

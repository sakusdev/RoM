name: Gameplay foundation fixup

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fixup:
    if: ${{ github.head_ref == 'feature/vanilla-parity-foundation' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vanilla-parity-foundation
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply source invariants and formatting
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          state = Path("crates/ferrum-game/src/state.rs")
          text = state.read_text(encoding="utf-8")
          if "pub fn set_difficulty" not in text:
              text = text.replace(
                  "    pub fn set_game_rule(&mut self, name: impl Into<String>, value: GameRuleValue) {",
                  "    pub fn set_difficulty(&mut self, difficulty: Difficulty) -> Difficulty {\n        std::mem::replace(&mut self.difficulty, difficulty)\n    }\n\n    pub fn set_game_rule(&mut self, name: impl Into<String>, value: GameRuleValue) {",
                  1,
              )
          text = text.replace(
              "if let GameRuleValue::Boolean(enabled) = value {",
              "if let GameRuleValue::Boolean(enabled) = &value {",
              1,
          )
          text = text.replace(
              "self.time.daylight_cycle = enabled;",
              "self.time.daylight_cycle = *enabled;",
              1,
          )
          text = text.replace(
              "                self.game_rules\n                    .insert(name, GameRuleValue::Boolean(enabled));\n                return;\n",
              "",
              1,
          )
          state.write_text(text, encoding="utf-8")

          inventory = Path("crates/ferrum-game/src/inventory.rs")
          text = inventory.read_text(encoding="utf-8")
          text = text.replace(
              "if amount == 0 || amount > self.count {",
              "if amount == 0 || amount >= self.count {",
              1,
          )
          inventory.write_text(text, encoding="utf-8")
          PY
          cargo fmt --all
          git add crates/ferrum-game crates/ferrum-server Cargo.toml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize gameplay foundation invariants"
          git push origin HEAD:feature/vanilla-parity-foundation

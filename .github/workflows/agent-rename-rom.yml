name: Agent Rename RoM

on:
  workflow_dispatch:
  push:
    branches: [agent/item-entity-domain]
    paths:
      - '.github/scripts/agent_rename_ferrum_to_rom.py'
      - '.github/workflows/agent-rename-rom.yml'

permissions:
  contents: write

jobs:
  rename-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply RoM rename
        run: python .github/scripts/agent_rename_ferrum_to_rom.py
      - name: Regenerate lockfile
        run: cargo generate-lockfile
      - name: Format renamed sources
        run: cargo fmt --all
      - name: Verify formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test and capture output
        shell: bash
        run: |
          set +e
          cargo test --workspace --no-fail-fast 2>&1 | tee test-output.log
          echo "${PIPESTATUS[0]}" > test-status.txt
          exit 0
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rom-rename-test-output
          path: |
            test-output.log
            test-status.txt
      - name: Fail on test errors
        shell: bash
        run: |
          status=$(cat test-status.txt)
          if [ "$status" != "0" ]; then
            tail -n 200 test-output.log
            exit "$status"
          fi
      - name: Verify public server binary name
        run: cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; d=json.load(sys.stdin); p=next(p for p in d["packages"] if p["name"]=="rom-server"); assert any(t["name"]=="rom" and "bin" in t["kind"] for t in p["targets"])'
      - name: Commit validated rename
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Rename Ferrum internals to RoM"
          git push

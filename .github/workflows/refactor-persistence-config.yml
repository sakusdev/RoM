name: Refactor persistence configuration

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/finish-rom-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-rom-core
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Group persistence service configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/ferrum-server/src/main.rs')
          text = path.read_text()

          if 'struct PersistenceConfig {' not in text:
              marker = '#[derive(Debug)]\nstruct ServerState {'
              addition = '''#[derive(Debug, Clone, Default)]
          struct PersistenceConfig {
              game: GameServiceConfig,
              world: WorldServiceConfig,
          }

          '''.replace('          ', '')
              text = text.replace(marker, addition + marker, 1)

          text = text.replace(
              '        game_service_config: GameServiceConfig,\n        world_service_config: WorldServiceConfig,',
              '        persistence: PersistenceConfig,'
          )
          text = text.replace(
              '        let game_service = spawn_game_service(game_runtime.clone(), game_service_config)?;',
              '        let game_service = spawn_game_service(game_runtime.clone(), persistence.game)?;'
          )
          text = text.replace(
              '            spawn_world_service(Arc::clone(&shared_world), world_service_config)?;',
              '            spawn_world_service(Arc::clone(&shared_world), persistence.world)?;'
          )
          text = text.replace(
              '            GameServiceConfig::default(),\n            WorldServiceConfig::default(),',
              '            PersistenceConfig::default(),'
          )
          text = text.replace(
              '    let world_service_config = WorldServiceConfig::new(\n        world_state_path,\n        (cli.autosave_seconds > 0).then(|| Duration::from_secs(cli.autosave_seconds)),\n    );',
              '    let persistence = PersistenceConfig {\n        game: game_service_config,\n        world: WorldServiceConfig::new(\n            world_state_path,\n            (cli.autosave_seconds > 0).then(|| Duration::from_secs(cli.autosave_seconds)),\n        ),\n    };'
          )
          text = text.replace(
              '        game_service_config,\n        world_service_config,',
              '        persistence,'
          )
          path.write_text(text)
          PY
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ferrum-server/src/main.rs
          if ! git diff --cached --quiet; then
            git commit -m 'Group game and world persistence configuration'
            git push origin HEAD:agent/finish-rom-core
          fi

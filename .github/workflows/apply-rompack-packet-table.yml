name: Capture generated packet-table diagnostics

on:
  pull_request:
    branches: [master]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  capture:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'feature/rompack-packet-table'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rompack-packet-table
          fetch-depth: 0
      - name: Capture patch failure
        run: |
          set +e
          python3 tools/apply_rompack_packet_table.py > packet-table-patch-diagnostics.txt 2>&1
          printf '\nstatus=%s\n' "$?" >> packet-table-patch-diagnostics.txt
          git checkout -- . ':!packet-table-patch-diagnostics.txt' ':!.github/workflows/apply-rompack-packet-table.yml' || true
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packet-table-patch-diagnostics.txt
          git commit -m "Capture packet-table patch diagnostics"
          git push origin HEAD:feature/rompack-packet-table

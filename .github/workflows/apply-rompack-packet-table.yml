name: Apply generated packet table

on:
  pull_request:
    branches: [master]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'feature/rompack-packet-table'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rompack-packet-table
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Narrow the ambiguous report-field patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_rompack_packet_table.py')
          text = path.read_text(encoding='utf-8')
          old = r'''replace_once(
              "crates/rom-bootstrap/src/extract.rs",
              "    pub registry_count: usize,\n",
              "    pub packet_count: usize,\n    pub registry_count: usize,\n",
          )
          '''
          new = r'''replace_once(
              "crates/rom-bootstrap/src/extract.rs",
              "    pub game_jar_sha256: String,\n    pub registry_count: usize,\n",
              "    pub game_jar_sha256: String,\n    pub packet_count: usize,\n    pub registry_count: usize,\n",
          )
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one ambiguous field patch, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - id: patch
        name: Apply source patch
        continue-on-error: true
        run: |
          rm -f packet-table-patch-diagnostics.txt
          python3 tools/apply_rompack_packet_table.py > packet-table-patch-diagnostics.txt 2>&1
      - name: Preserve patch diagnostics
        if: steps.patch.outcome == 'failure'
        run: |
          git checkout -- . ':!packet-table-patch-diagnostics.txt' ':!.github/workflows/apply-rompack-packet-table.yml' || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packet-table-patch-diagnostics.txt
          git commit -m "Update packet-table patch diagnostics"
          git push origin HEAD:feature/rompack-packet-table
          exit 1
      - name: Remove patch machinery and update lockfile
        if: steps.patch.outcome == 'success'
        run: |
          rm -f packet-table-patch-diagnostics.txt
          rm tools/apply_rompack_packet_table.py
          cargo generate-lockfile
          cargo fmt --all
      - name: Validate workspace
        if: steps.patch.outcome == 'success'
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit source implementation
        if: steps.patch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock README.md docs/BOOTSTRAP.md \
            crates/ferrum-protocol/Cargo.toml crates/ferrum-protocol/src/lib.rs \
            crates/ferrum-rompack/Cargo.toml crates/ferrum-rompack/src/lib.rs \
            crates/rom-bootstrap/src/extract.rs crates/rom-bootstrap/src/main.rs \
            crates/ferrum-server/src/main.rs tools/apply_rompack_packet_table.py \
            packet-table-patch-diagnostics.txt
          git diff --cached --check
          git commit -m "Load protocol packet IDs from generated version packs"
          git push origin HEAD:feature/rompack-packet-table

name: Agent Integrate Velocity Sync

on:
  push:
    branches: [agent/item-entity-domain]
    paths:
      - '.github/scripts/agent_integrate_velocity_sync.py'
      - '.github/workflows/agent-integrate-velocity-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply velocity synchronization
        run: python .github/scripts/agent_integrate_velocity_sync.py
      - run: cargo fmt --all
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p rom-play entity::tests::set_entity_motion_uses_vanilla_short_velocity_scale_and_clamp -- --exact
      - run: cargo test -p rom-protocol packet_catalog::tests::recognizes_set_entity_motion_as_optional_typed_packet -- --exact
      - run: cargo test -p rom-server game_runtime::tests::knockback_publishes_authoritative_velocity_change -- --exact
      - run: cargo test --workspace --no-fail-fast
      - name: Commit validated synchronization
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/rom-game/src/state.rs crates/rom-server/src/game_runtime.rs crates/rom-play/src/entity.rs crates/rom-play/src/lib.rs crates/rom-protocol/src/lib.rs crates/rom-protocol/src/packet_catalog.rs crates/rom-server/src/game_replication.rs
          git commit -m "Synchronize authoritative entity velocity"
          git push

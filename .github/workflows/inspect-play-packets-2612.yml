name: Inspect play packets 26.1.2

on:
  push:
    branches:
      - feature/minimal-play-26-1-2
  pull_request:
    branches:
      - master

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: bash -x tools/inspect-play-packets-2612.sh
      - if: always()
        run: |
          mkdir -p inspect
          find inspect -maxdepth 3 -type f -printf '%p %s bytes\n' | sort > inspect/files.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-packet-inspection-26.1.2
          path: inspect
          if-no-files-found: error

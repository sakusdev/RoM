name: Export minimal play branch source

on:
  push:
    branches:
      - feature/minimal-play-26-1-2
  pull_request:
    branches:
      - master

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/minimal-play-26-1-2
      - uses: actions/upload-artifact@v4
        with:
          name: rom-minimal-play-branch-source
          path: |
            Cargo.toml
            Cargo.lock
            README.md
            crates
            docs
          if-no-files-found: error

name: Inspect play packets 26.1.2

on:
  push:
    branches:
      - feature/minimal-play-26-1-2
  pull_request:
    branches:
      - master

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: bash tools/inspect-play-packets-2612.sh
      - uses: actions/upload-artifact@v4
        with:
          name: play-packet-inspection-26.1.2
          path: |
            inspect/mapping-hits.txt
            inspect/classes.tsv
            inspect/javap.txt
            inspect/packet-ids.txt
          if-no-files-found: error

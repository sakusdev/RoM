name: Format NBT artifact

on:
  push:
    branches:
      - feature/server-nbt-foundation

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-nbt
          path: crates/ferrum-nbt/src/lib.rs
          if-no-files-found: error

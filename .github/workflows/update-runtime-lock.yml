name: Update runtime Cargo lockfile

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  update-lock:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'fix/update-cargo-lock-runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/update-cargo-lock-runtime
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate Cargo.lock
        run: cargo generate-lockfile
      - name: Verify locked build
        run: cargo check --locked --workspace
      - name: Remove temporary workflow
        run: rm .github/workflows/update-runtime-lock.yml
      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Update Cargo.lock for ferrum-runtime"
          git push origin HEAD:fix/update-cargo-lock-runtime

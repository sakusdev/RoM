name: Apply configuration flow

on:
  push:
    branches:
      - feature/configuration-wire-flow

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/configuration-wire-flow
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply configuration flow transform
        run: python3 tools/apply_configuration_flow.py
      - name: Validate
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit validated implementation
        run: |
          rm tools/apply_configuration_flow.py
          rm .github/workflows/apply-configuration-flow.yml
          rm -f tools/.configuration-flow-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Implement Login to Configuration wire flow"
          git push origin HEAD:feature/configuration-wire-flow

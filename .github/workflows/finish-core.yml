name: Finish RoM core

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'agent/finish-rom-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-rom-core
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Integrate durable world persistence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'{label} anchor not found')
              return text.replace(old, new, 1)

          # The world snapshot module and dependencies may already have been applied
          # by the previous validation run; keep this step idempotent.
          lib = Path('crates/ferrum-world/src/lib.rs')
          text = lib.read_text()
          old = 'pub mod anvil;\nmod chunk_view;\n\npub use chunk_view::{ChunkView, ChunkViewDelta, ChunkViewError};\n'
          new = '''pub mod anvil;
          mod chunk_view;
          pub mod persistence;

          pub use chunk_view::{ChunkView, ChunkViewDelta, ChunkViewError};
          pub use persistence::{
              ChunkSectionSnapshot, ChunkSnapshot, WORLD_SNAPSHOT_SCHEMA_VERSION,
              WorldPersistenceError, WorldSnapshot,
          };
          '''.replace('          ', '')
          if 'pub mod persistence;' not in text:
              text = replace_once(text, old, new, 'ferrum-world module')
          lib.write_text(text)

          cargo = Path('crates/ferrum-world/Cargo.toml')
          text = cargo.read_text()
          anchor = 'flate2.workspace = true\nthiserror.workspace = true\n'
          replacement = 'flate2.workspace = true\nserde.workspace = true\nserde_json.workspace = true\nthiserror.workspace = true\n'
          if 'serde_json.workspace = true' not in text:
              text = replace_once(text, anchor, replacement, 'ferrum-world dependencies')
          cargo.write_text(text)

          docs = Path('docs/BOOTSTRAP.md')
          text = docs.read_text().replace('schema-v4 `.rompack`', 'schema-v7 `.rompack`')
          text = text.replace(
              'Schema-v1, schema-v2, and schema-v3 packs are intentionally rejected after the packet-table, world-metadata, and Play-bootstrap migrations and must be regenerated.',
              'Packs from earlier schemas are intentionally rejected after packet-catalog, world-metadata, item/component-palette, and inventory migrations and must be regenerated.'
          )
          text = text.replace(
              '├── NOTICE.txt\n├── rom-bootstrap.json\n└── server.toml',
              '├── NOTICE.txt\n├── game-state.json\n├── world-state.json\n├── rom-bootstrap.json\n└── server.toml'
          )
          docs.write_text(text)

          # A disabled world service is useful for unit-test ServerState instances.
          service = Path('crates/ferrum-server/src/world_service.rs')
          text = service.read_text()
          text = text.replace('pub snapshot_path: PathBuf,', 'pub snapshot_path: Option<PathBuf>,')
          text = text.replace(
              'snapshot_path,\n            command_capacity:',
              'snapshot_path: Some(snapshot_path),\n            command_capacity:'
          )
          if 'impl Default for WorldServiceConfig' not in text:
              anchor = '''impl WorldServiceConfig {
              pub(super) fn new(snapshot_path: PathBuf, autosave_interval: Option<Duration>) -> Self {
                  Self {
                      autosave_interval,
                      snapshot_path: Some(snapshot_path),
                      command_capacity: NonZeroUsize::new(16).expect("16 is non-zero"),
                      poll_interval: DEFAULT_POLL_INTERVAL,
                  }
              }
          }
          '''.replace('          ', '')
              replacement = anchor + '''
          impl Default for WorldServiceConfig {
              fn default() -> Self {
                  Self {
                      autosave_interval: None,
                      snapshot_path: None,
                      command_capacity: NonZeroUsize::new(16).expect("16 is non-zero"),
                      poll_interval: DEFAULT_POLL_INTERVAL,
                  }
              }
          }
          '''.replace('          ', '')
              text = replace_once(text, anchor, replacement, 'world service default')
          text = text.replace(
              '''if config.snapshot_path.as_os_str().is_empty() {
                  bail!("world snapshot path cannot be empty");
              }
          ''',
              '''if config
                  .snapshot_path
                  .as_ref()
                  .is_some_and(|path| path.as_os_str().is_empty())
              {
                  bail!("world snapshot path cannot be empty");
              }
          '''
          )
          if 'world autosave requires a snapshot path' not in text:
              text = text.replace(
                  '''if config
                      .autosave_interval
                      .is_some_and(|interval| interval.is_zero())
                  {
                      bail!("world autosave interval must be greater than zero");
                  }
          ''',
                  '''if config
                      .autosave_interval
                      .is_some_and(|interval| interval.is_zero())
                  {
                      bail!("world autosave interval must be greater than zero");
                  }
                  if config.autosave_interval.is_some() && config.snapshot_path.is_none() {
                      bail!("world autosave requires a snapshot path");
                  }
          '''
              )
          text = text.replace(
              '''let result = save_world_state(&world, &config.snapshot_path)
                      .map_err(|error| format!("{error:#}"));
          ''',
              '''let result = match &config.snapshot_path {
                      Some(path) => save_world_state(&world, path).map_err(|error| format!("{error:#}")),
                      None => Err("world snapshot path is not configured".to_owned()),
                  };
          '''
          )
          text = text.replace(
              '''save_world_state(&world, &config.snapshot_path)?;
                  exit.requested_saves = exit.requested_saves.saturating_add(1);
                  return Ok(exit);
          ''',
              '''if let Some(path) = &config.snapshot_path {
                      save_world_state(&world, path)?;
                      exit.requested_saves = exit.requested_saves.saturating_add(1);
                  }
                  return Ok(exit);
          '''
          )
          text = text.replace(
              '''save_world_state(&world, &config.snapshot_path)?;
              exit.autosaves = exit.autosaves.saturating_add(1);
          ''',
              '''if let Some(path) = &config.snapshot_path {
                  save_world_state(&world, path)?;
                  exit.autosaves = exit.autosaves.saturating_add(1);
              }
          '''
          )
          service.write_text(text)

          play = Path('crates/ferrum-server/src/play_runtime.rs')
          text = play.read_text()
          anchor = '''    pub(super) fn chunk_snapshot(&self, pos: ChunkPos) -> Result<StaticChunk> {
              let inner = self
                  .inner
                  .lock()
                  .map_err(|_| anyhow::anyhow!("shared world lock poisoned"))?;
              inner
                  .runtime
                  .state()
                  .chunk(pos)
                  .cloned()
                  .with_context(|| format!("shared world is missing chunk ({}, {})", pos.x, pos.z))
          }
          '''.replace('          ', '')
          addition = anchor + '''
              pub(super) fn store_snapshot(&self) -> Result<ChunkStore> {
                  let inner = self
                      .inner
                      .lock()
                      .map_err(|_| anyhow::anyhow!("shared world lock poisoned"))?;
                  Ok(inner.runtime.state().clone())
              }
          '''.replace('          ', '')
          if 'pub(super) fn store_snapshot' not in text:
              text = replace_once(text, anchor, addition, 'shared world snapshot')
          if 'pub(super) fn apply_event(' not in text:
              text = text.replace('    fn apply_event(\n', '    pub(super) fn apply_event(\n', 1)
          play.write_text(text)

          main = Path('crates/ferrum-server/src/main.rs')
          text = main.read_text()
          if 'mod world_service;' not in text:
              text = text.replace('mod play_runtime;\n', 'mod play_runtime;\nmod world_service;\n', 1)
          if 'use world_service::{' not in text:
              text = text.replace(
                  'use identity::{PlayerIdentity, offline_player_identity};\n',
                  '''use identity::{PlayerIdentity, offline_player_identity};
          use world_service::{
              WorldService, WorldServiceConfig, WorldServiceControl, load_world_state,
              spawn_world_service,
          };
          '''.replace('          ', ''),
                  1,
              )
          cli_anchor = '''    /// Autosave interval in seconds. Zero disables periodic saves; shutdown still saves.
              #[arg(long, default_value_t = 30)]
              autosave_seconds: u64,
          '''.replace('          ', '')
          cli_new = '''    /// Persistent world snapshot. Defaults to world-state.json beside server.toml.
              #[arg(long, value_name = "PATH")]
              world_state: Option<PathBuf>,

          '''.replace('          ', '') + cli_anchor
          if 'world_state: Option<PathBuf>' not in text:
              text = replace_once(text, cli_anchor, cli_new, 'world-state CLI')
          text = text.replace(
              '    world: play_runtime::SharedWorld,',
              '    world: Arc<play_runtime::SharedWorld>,'
          )
          if 'world_service: WorldService,' not in text:
              text = text.replace(
                  '    game_service: GameService,\n',
                  '    game_service: GameService,\n    world_service: WorldService,\n',
                  1,
              )
          sig_old = '''        game_state: Option<GameState>,
              game_service_config: GameServiceConfig,
          ) -> Result<Self> {
          '''.replace('          ', '')
          sig_new = '''        game_state: Option<GameState>,
              game_service_config: GameServiceConfig,
              world_service_config: WorldServiceConfig,
          ) -> Result<Self> {
          '''.replace('          ', '')
          if 'world_service_config: WorldServiceConfig' not in text:
              text = replace_once(text, sig_old, sig_new, 'ServerState runtime signature')
          block_old = '''        let shared_world = match loaded_chunks {
              Some(store) => {
                  play_runtime::SharedWorld::from_store_with_policy(store, world, play_policy)?
              }
              None => play_runtime::SharedWorld::new_with_policy(center, world, play_policy)?,
          };
              let shared_play_runtime = spawn_shared_play_runtime(shared_runtime_config)?;
          '''.replace('          ', '')
          block_new = '''        let shared_world = Arc::new(match loaded_chunks {
              Some(store) => {
                  play_runtime::SharedWorld::from_store_with_policy(store, world, play_policy)?
              }
              None => play_runtime::SharedWorld::new_with_policy(center, world, play_policy)?,
          });
              let world_service =
                  spawn_world_service(Arc::clone(&shared_world), world_service_config)?;
              let shared_play_runtime = spawn_shared_play_runtime(shared_runtime_config)?;
          '''.replace('          ', '')
          if 'spawn_world_service(Arc::clone(&shared_world)' not in text:
              text = replace_once(text, block_old, block_new, 'shared world service creation')
          if '            world_service,\n            game_replication,' not in text:
              text = text.replace(
                  '            game_service,\n            game_replication,\n',
                  '            game_service,\n            world_service,\n            game_replication,\n',
                  1,
              )
          text = text.replace(
              '            GameServiceConfig::default(),\n        )',
              '            GameServiceConfig::default(),\n            WorldServiceConfig::default(),\n        )'
          )
          if 'fn world_control(&self)' not in text:
              text = text.replace(
                  '''    fn game_control(&self) -> GameServiceControl {
                  self.game_service.control()
              }
          ''',
                  '''    fn game_control(&self) -> GameServiceControl {
                  self.game_service.control()
              }

              fn world_control(&self) -> WorldServiceControl {
                  self.world_service.control()
              }
          ''',
                  1,
              )
          shutdown_old = '''        self.game_service.shutdown()
              }
          '''.replace('          ', '')
          shutdown_new = '''        let world = self.world_service.shutdown()?;
              println!(
                  "world service stopped after {} autosaves and {} requested/final saves",
                  world.autosaves, world.requested_saves
              );
              self.game_service.shutdown()
              }
          '''.replace('          ', '')
          if 'world service stopped after' not in text:
              text = replace_once(text, shutdown_old, shutdown_new, 'world service shutdown')
          path_anchor = '    let game_state_path = cli.game_state.clone().unwrap_or(default_state_path);\n'
          path_new = path_anchor + '''    let default_world_path = config_path
              .parent()
              .unwrap_or_else(|| Path::new("."))
              .join("world-state.json");
              let world_state_path = cli.world_state.clone().unwrap_or(default_world_path);
          '''.replace('          ', '')
          if 'let world_state_path =' not in text:
              text = replace_once(text, path_anchor, path_new, 'world snapshot path')
          text = text.replace(
              '    let loaded_chunks = load_configured_world_chunks(&config.world, &world_profile)?;\n',
              '''    let loaded_chunks = match load_world_state(&world_state_path, &world_profile)? {
              Some(store) => Some(store),
              None => load_configured_world_chunks(&config.world, &world_profile)?,
          };
          '''.replace('          ', ''),
              1,
          )
          service_anchor = '''    let game_service_config = GameServiceConfig {
              snapshot_path: Some(game_state_path.clone()),
              autosave_interval: (cli.autosave_seconds > 0)
                  .then(|| Duration::from_secs(cli.autosave_seconds)),
              ..GameServiceConfig::default()
          };
          '''.replace('          ', '')
          service_new = service_anchor + '''    let world_service_config = WorldServiceConfig::new(
              world_state_path,
              (cli.autosave_seconds > 0).then(|| Duration::from_secs(cli.autosave_seconds)),
          );
          '''.replace('          ', '')
          if 'let world_service_config =' not in text:
              text = replace_once(text, service_anchor, service_new, 'world service config')
          if '            world_service_config,\n        )?' not in text:
              text = text.replace(
                  '            game_service_config,\n        )?;',
                  '            game_service_config,\n            world_service_config,\n        )?;',
                  1,
              )
          if 'state.world_control(),' not in text:
              text = text.replace(
                  '            state.game_control(),\n            state.shutdown_signal(),',
                  '            state.game_control(),\n            state.world_control(),\n            state.shutdown_signal(),',
                  1,
              )
          console_sig_old = '''fn spawn_server_console(
              runtime: SharedGameRuntime,
              game_control: GameServiceControl,
              shutdown: Arc<AtomicBool>,
          ) -> Result<thread::JoinHandle<()>> {
          '''.replace('          ', '')
          console_sig_new = '''fn spawn_server_console(
              runtime: SharedGameRuntime,
              game_control: GameServiceControl,
              world_control: WorldServiceControl,
              shutdown: Arc<AtomicBool>,
          ) -> Result<thread::JoinHandle<()>> {
          '''.replace('          ', '')
          if 'world_control: WorldServiceControl' not in text:
              text = replace_once(text, console_sig_old, console_sig_new, 'console world control')
          save_anchor = '''                        }
                          if outcome.shutdown_requested {
          '''.replace('          ', '')
          save_block = '''                        }
                              match world_control.save_now() {
                                  Ok(report) => println!(
                                      "saved world state to {} ({} bytes, {} chunks)",
                                      report.path.display(),
                                      report.bytes,
                                      report.chunks
                                  ),
                                  Err(error) => eprintln!("world save failed: {error:#}"),
                              }
                          }
                          if outcome.shutdown_requested {
          '''.replace('          ', '')
          if 'saved world state to' not in text:
              text = replace_once(text, save_anchor, save_block, 'console world save')
          main.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          if '- Atomic JSON snapshots for gameplay and modified chunks' not in text:
              text = text.replace(
                  '- Optional loading of Anvil region files and region directories\n',
                  '- Optional loading of Anvil region files and region directories\n- Atomic JSON snapshots for gameplay and modified chunks\n- Periodic autosave, explicit `save-all`, startup restore, and final shutdown save\n'
              )
          text = text.replace(
              '- Durable world and player persistence, Anvil region saving, crash recovery, and transactional storage',
              '- Vanilla-format Anvil region saving, transactional multi-file crash recovery, and storage compaction'
          )
          text = text.replace(
              '├── NOTICE.txt\n├── rom-bootstrap.json',
              '├── NOTICE.txt\n├── game-state.json\n├── world-state.json\n├── rom-bootstrap.json'
          )
          readme.write_text(text)
          PY
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/BOOTSTRAP.md crates/ferrum-world/Cargo.toml crates/ferrum-world/src/lib.rs crates/ferrum-world/src/persistence.rs crates/ferrum-server/src/main.rs crates/ferrum-server/src/play_runtime.rs crates/ferrum-server/src/world_service.rs
          if ! git diff --cached --quiet; then
            git commit -m 'Persist modified world state across restarts'
            git push origin HEAD:agent/finish-rom-core
          fi

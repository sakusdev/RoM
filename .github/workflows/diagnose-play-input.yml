name: Diagnose Play input decoder

on:
  pull_request:
    branches: [master]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feature/play-input-decoder'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/play-input-decoder
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - id: clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings > play-input-clippy.txt 2>&1
      - name: Commit diagnostics
        if: steps.clippy.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play-input-clippy.txt
          git commit -m "Capture Play input Clippy diagnostics"
          git push origin HEAD:feature/play-input-decoder
          exit 1
      - name: Remove diagnostic workflow
        if: steps.clippy.outcome == 'success'
        run: |
          rm .github/workflows/diagnose-play-input.yml
          rm -f play-input-clippy.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Play input decoder"
          git push origin HEAD:feature/play-input-decoder

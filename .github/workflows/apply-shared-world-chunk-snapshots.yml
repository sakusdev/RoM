name: Apply shared-world chunk snapshots

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'feature/shared-world-chunk-snapshots'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/shared-world-chunk-snapshots
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply source patch
        run: python3 tools/apply_shared_world_chunk_snapshots.py
      - name: Remove temporary patch machinery
        run: |
          rm tools/apply_shared_world_chunk_snapshots.py
          rm .github/workflows/apply-shared-world-chunk-snapshots.yml
      - name: Format
        run: cargo fmt --all
      - name: Capture validation diagnostics
        run: |
          set +e
          cargo clippy --workspace --all-targets -- -D warnings > shared-chunk-diagnostics.txt 2>&1
          clippy_status=$?
          cargo test --workspace >> shared-chunk-diagnostics.txt 2>&1
          test_status=$?
          printf '\nclippy_status=%s\ntest_status=%s\n' "$clippy_status" "$test_status" >> shared-chunk-diagnostics.txt
          exit 0
      - name: Commit implementation and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Stage authoritative shared-world chunk snapshots"
          git push origin HEAD:feature/shared-world-chunk-snapshots

name: P1 entity wire inspection

on:
  push:
    branches:
      - agent/p0-p4-gameplay-foundations

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download verified official server
        run: |
          set -euo pipefail
          mkdir -p /tmp/libs /tmp/reports
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request, zipfile

          def download(url):
              request = urllib.request.Request(url, headers={'User-Agent': 'RoM/official-wire-inspector'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.read()

          manifest = json.loads(download('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'))
          entry = next(item for item in manifest['versions'] if item['id'] == '26.1.2')
          metadata_bytes = download(entry['url'])
          if hashlib.sha1(metadata_bytes).hexdigest() != entry['sha1']:
              raise SystemExit('version metadata SHA-1 mismatch')
          server = json.loads(metadata_bytes)['downloads']['server']
          server_bytes = download(server['url'])
          if len(server_bytes) != server['size'] or hashlib.sha1(server_bytes).hexdigest() != server['sha1']:
              raise SystemExit('server integrity mismatch')
          pathlib.Path('/tmp/server.jar').write_bytes(server_bytes)
          with zipfile.ZipFile('/tmp/server.jar') as outer:
              rows = outer.read('META-INF/versions.list').decode().splitlines()
              candidates = [fields[2] for row in rows if len((fields := row.strip().split('\t'))) == 3]
              if len(candidates) != 1:
                  raise SystemExit(f'expected one embedded game jar, found {candidates}')
              pathlib.Path('/tmp/game.jar').write_bytes(outer.read(f'META-INF/versions/{candidates[0]}'))
              for name in outer.namelist():
                  if name.startswith('META-INF/libraries/') and name.endswith('.jar'):
                      (pathlib.Path('/tmp/libs') / pathlib.Path(name).name).write_bytes(outer.read(name))
          print(json.dumps({'version': '26.1.2', 'metadata_sha1': entry['sha1'], 'server_sha1': server['sha1']}))
          PY

      - name: Print exact packet and entity type IDs
        working-directory: /tmp/reports
        run: |
          set -euo pipefail
          java -DbundlerMainClass=net.minecraft.data.Main -jar /tmp/server.jar --server --reports >/tmp/report-generation.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          packets = json.loads(Path('generated/reports/packets.json').read_text())['play']
          wanted_tokens = ('interact', 'experience_orb', 'passengers', 'entity_link', 'entity_event')
          wanted_packets = {
              direction: {
                  name: record for name, record in packets[direction].items()
                  if any(token in name for token in wanted_tokens)
              }
              for direction in ('serverbound', 'clientbound')
          }
          registries = json.loads(Path('generated/reports/registries.json').read_text())
          entity_types = registries['minecraft:entity_type']['entries']
          wanted_entities = {
              name: value for name, value in entity_types.items()
              if name in {
                  'minecraft:experience_orb', 'minecraft:arrow', 'minecraft:spectral_arrow',
                  'minecraft:boat', 'minecraft:chest_boat', 'minecraft:minecart',
                  'minecraft:zombie', 'minecraft:player', 'minecraft:item'
              }
          }
          print('ROM_ENTITY_PACKET_IDS_BEGIN')
          print(json.dumps(wanted_packets, indent=2, sort_keys=True))
          print('ROM_ENTITY_PACKET_IDS_END')
          print('ROM_ENTITY_TYPE_IDS_BEGIN')
          print(json.dumps(wanted_entities, indent=2, sort_keys=True))
          print('ROM_ENTITY_TYPE_IDS_END')
          PY

      - name: List exact related classes
        run: |
          set -euo pipefail
          jar tf /tmp/game.jar \
            | grep -E '(^net/minecraft/network/protocol/game/(ServerboundInteract|Clientbound(AddExperienceOrb|SetPassengers|SetEntityLink|EntityEvent)).*\.class$)|(^net/minecraft/world/entity/(ExperienceOrb|projectile/(AbstractArrow|Arrow)|vehicle/(Boat|AbstractMinecart)).*\.class$)' \
            | sort

      - name: Disassemble exact packet codecs
        run: |
          set -euo pipefail
          for class in \
            'net.minecraft.network.protocol.game.ServerboundInteractPacket' \
            'net.minecraft.network.protocol.game.ServerboundInteractPacket$Action' \
            'net.minecraft.network.protocol.game.ServerboundInteractPacket$AttackAction' \
            'net.minecraft.network.protocol.game.ServerboundInteractPacket$InteractionAction' \
            'net.minecraft.network.protocol.game.ServerboundInteractPacket$InteractionAtLocationAction' \
            'net.minecraft.network.protocol.game.ClientboundAddExperienceOrbPacket' \
            'net.minecraft.network.protocol.game.ClientboundSetPassengersPacket'; do
            echo "ROM_JAVAP_BEGIN $class"
            javap -p -c -s -constants -classpath "/tmp/game.jar:/tmp/libs/*" "$class"
            echo "ROM_JAVAP_END $class"
          done

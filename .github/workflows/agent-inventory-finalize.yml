name: Finalize inventory synchronization

on:
  push:
    branches:
      - feature/player-inventory-sync
    paths:
      - .github/workflows/agent-inventory-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/player-inventory-sync
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Remove stale import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/ferrum-server/src/game_replication.rs')
          text = path.read_text()
          old = 'use ferrum_game::{GameEvent, ItemStack, PLAYER_INVENTORY_SLOTS, PlayerUuid};'
          new = 'use ferrum_game::{GameEvent, PLAYER_INVENTORY_SLOTS, PlayerUuid};'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale import, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: cargo fmt --all
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates Cargo.lock
          git commit -m 'Finalize inventory bootstrap synchronization'
          git push origin HEAD:feature/player-inventory-sync

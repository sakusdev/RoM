name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  docs-fixup:
    if: ${{ github.head_ref == 'feature/bootstrap-setup-doctor' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bootstrap-setup-doctor
      - name: Finalize Bootstrap documentation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = readme.replace(
              "> [!WARNING]\n> RoM is under active development. It can complete the initial vanilla connection flow and enter a small deterministic test world, but it is not yet a replacement for a production Minecraft server.\n",
              "> [!WARNING]\n> The supported 26.1.2 Bootstrap flow is complete and produces a runnable local development instance. RoM gameplay remains experimental and is not yet a replacement for a production Minecraft server.\n",
              1,
          )
          readme = readme.replace(
              "The current bootstrap implementation supports the **version pack generated** stage. It does not decompile, translate, execute, bytecode-patch, or redistribute the official server JAR. The generated pack contains derived registry identifiers and source-resource hashes, not copied JSON payloads.\n",
              "The supported Bootstrap workflow is ready-to-run: `setup` performs source preparation, version-pack generation, native installation, and readiness validation. It does not decompile, translate, execute, bytecode-patch, or redistribute the official server JAR. The generated pack contains derived registry identifiers and source-resource hashes, not copied JSON payloads.\n",
              1,
          )
          readme = readme.replace(
              "- Live TCP wiring into the bounded worker hub and authoritative 20 TPS owner\n",
              "",
          )
          readme = readme.replace("- Dedicated outbound writer workers\n", "")

          start = readme.index("## Quick start with RoM Bootstrap")
          end = readme.index("## Direct developer start")
          quick_start = '''## Quick start with RoM Bootstrap

`setup` is the preferred path. It is idempotent: verified downloads and generated packs are reused unless their force flags are supplied.

### Extracted native release

The release archive places `rom-bootstrap` and `ferrum-server` beside each other, so the server binary is detected automatically:

```bash
./rom-bootstrap setup \\
  --instance ./rom-instance \\
  --version 26.1.2 \\
  --accept-minecraft-eula
./rom-bootstrap doctor --instance ./rom-instance
./rom-bootstrap run --instance ./rom-instance
```

On Windows, use `rom-bootstrap.exe` and `ferrum-server.exe`.

### Source checkout

Build both native programs, then let Bootstrap install the server from the workspace:

```bash
cargo build --locked --release -p rom-bootstrap -p ferrum-server
./target/release/rom-bootstrap setup \\
  --instance ./rom-instance \\
  --version 26.1.2 \\
  --accept-minecraft-eula \\
  --workspace .
./target/release/rom-bootstrap doctor --instance ./rom-instance
./target/release/rom-bootstrap run --instance ./rom-instance
```

`doctor` prints every missing or invalid component and exits unsuccessfully until the instance is runnable. Use `--json` with `setup`, `doctor`, or `status` for automation. The individual `prepare`, `generate`, and `install-local` stages remain available for debugging and advanced workflows; see [`docs/BOOTSTRAP.md`](docs/BOOTSTRAP.md).

The generated default configuration binds to `127.0.0.1:25565`, uses offline-mode development login, a bounded chunk view, and the deterministic local world. Connect a matching Minecraft Java Edition 26.1.2 client for local testing.

'''
          readme = readme[:start] + quick_start + readme[end:]

          old_release = '''Preferred first-run usage from an extracted release archive:

```bash
./rom-bootstrap prepare --instance ./rom-instance --version 26.1.2 --accept-minecraft-eula
./rom-bootstrap generate --instance ./rom-instance
./rom-bootstrap install-local --instance ./rom-instance --server-binary ./ferrum-server
./rom-bootstrap run --instance ./rom-instance
```
'''
          new_release = '''Preferred first-run usage from an extracted release archive:

```bash
./rom-bootstrap setup --instance ./rom-instance --version 26.1.2 --accept-minecraft-eula
./rom-bootstrap doctor --instance ./rom-instance
./rom-bootstrap run --instance ./rom-instance
```

`setup` automatically detects the adjacent `ferrum-server` executable. Pass `--server-binary` only when the binary is stored elsewhere.
'''
          if old_release not in readme:
              raise SystemExit("README native release block changed unexpectedly")
          readme = readme.replace(old_release, new_release, 1)
          readme = readme.replace(
              "- `rom-bootstrap` — official-source verification, bounded local extraction, and instance management\n",
              "- `rom-bootstrap` — one-command setup, readiness diagnostics, official-source verification, bounded local extraction, and instance management\n",
              1,
          )
          readme_path.write_text(readme, encoding="utf-8")

          guide_path = Path("docs/BOOTSTRAP.md")
          guide = guide_path.read_text(encoding="utf-8")
          guide = guide.replace(
              "- Future version-pack generation must happen locally and record the exact source hash and patch-set identity.\n",
              "- Every version pack is generated locally and records the exact source hash and patch-set identity.\n",
              1,
          )
          guide = guide.replace("## Current bootstrap stage\n", "## Complete supported workflow\n", 1)
          guide = guide.replace(
              "The implementation supports `official_source_verified` and `version_pack_generated`:\n",
              "For Minecraft 26.1.2, Bootstrap supports the complete ready-to-run workflow:\n",
              1,
          )

          build_marker = "## Prepare an instance\n"
          setup_section = '''## Complete an instance in one command

From an extracted native release, the adjacent `ferrum-server` binary is detected automatically:

```bash
./rom-bootstrap setup \\
  --instance ./rom-instance \\
  --version 26.1.2 \\
  --accept-minecraft-eula
```

From a source checkout, build and install from the workspace:

```bash
cargo build --locked --release -p rom-bootstrap -p ferrum-server
./target/release/rom-bootstrap setup \\
  --instance ./rom-instance \\
  --version 26.1.2 \\
  --accept-minecraft-eula \\
  --workspace .
```

`setup` executes `prepare`, `generate`, `install-local`, and the final readiness check. It reuses verified artifacts and valid packs by default. Use `--force-download` or `--force-generate` only when regeneration is intentional. An explicit `--server-binary` overrides adjacent-binary detection and workspace building.

'''
          if setup_section not in guide:
              guide = guide.replace(build_marker, setup_section + build_marker, 1)

          inspect_marker = "## Run the native server\n"
          doctor_section = '''## Diagnose readiness

```bash
./target/release/rom-bootstrap doctor --instance ./rom-instance
```

`doctor` checks the Bootstrap manifest, EULA marker, official source integrity, generated pack integrity, native executable, and `server.toml`. It lists every problem and returns a non-zero exit status until the instance is ready. Add `--json` for scripts and launchers.

'''
          if doctor_section not in guide:
              guide = guide.replace(inspect_marker, doctor_section + inspect_marker, 1)

          old_archive = '''```bash
./rom-bootstrap prepare --instance ./rom-instance --version 26.1.2 --accept-minecraft-eula
./rom-bootstrap generate --instance ./rom-instance
./rom-bootstrap install-local --instance ./rom-instance --server-binary ./ferrum-server
./rom-bootstrap run --instance ./rom-instance
```
'''
          new_archive = '''```bash
./rom-bootstrap setup --instance ./rom-instance --version 26.1.2 --accept-minecraft-eula
./rom-bootstrap doctor --instance ./rom-instance
./rom-bootstrap run --instance ./rom-instance
```
'''
          if old_archive not in guide:
              raise SystemExit("Bootstrap archive command block changed unexpectedly")
          guide = guide.replace(old_archive, new_archive, 1)

          planned = '''## Planned next stages

1. Add more independently testable extractors only when the server consumes their output.
2. Preserve bounded decoding, deterministic ordering, source hashes, and local-only artifact boundaries for every new section.
'''
          completion = '''## Completion boundary

The Bootstrap workflow is complete for the supported Minecraft 26.1.2 profile: it can prepare, generate, install, diagnose, and run a local native instance without Java. New Minecraft versions remain separate profile work and must preserve bounded decoding, deterministic ordering, source hashes, and local-only artifact boundaries.
'''
          if planned not in guide:
              raise SystemExit("Bootstrap completion block changed unexpectedly")
          guide = guide.replace(planned, completion, 1)
          guide_path.write_text(guide, encoding="utf-8")
          PY
          git add README.md docs/BOOTSTRAP.md
          if git diff --cached --quiet; then
            echo "Bootstrap documentation is already finalized"
            exit 0
          fi
          git commit -m "Document the complete Bootstrap workflow"
          git push origin HEAD:feature/bootstrap-setup-doctor

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

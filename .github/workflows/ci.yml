name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  source-fixup:
    if: ${{ github.head_ref == 'feature/bootstrap-setup-doctor' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bootstrap-setup-doctor
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Preserve generated pack provenance across setup reruns
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/rom-bootstrap/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          old_manifest = '''    let manifest = BootstrapManifest {
        schema_version: BOOTSTRAP_SCHEMA_VERSION,
        minecraft_version: version.to_owned(),
        protocol,
        patch_set: format!("builtin:{version}"),
        stage: BootstrapStage::OfficialSourceVerified,
        source: SourceRecord {
            kind: "official_server_jar".to_owned(),
            url: artifact.url.clone(),
            sha1: artifact.sha1.clone(),
            size: artifact.size,
            local_path: relative_jar.to_owned(),
        },
        pack: None,
    };
'''
          new_manifest = '''    let pack = preserved_pack_record(instance, version, protocol, artifact, relative_jar)?;
    let stage = if pack.is_some() {
        BootstrapStage::VersionPackGenerated
    } else {
        BootstrapStage::OfficialSourceVerified
    };
    let manifest = BootstrapManifest {
        schema_version: BOOTSTRAP_SCHEMA_VERSION,
        minecraft_version: version.to_owned(),
        protocol,
        patch_set: format!("builtin:{version}"),
        stage,
        source: SourceRecord {
            kind: "official_server_jar".to_owned(),
            url: artifact.url.clone(),
            sha1: artifact.sha1.clone(),
            size: artifact.size,
            local_path: relative_jar.to_owned(),
        },
        pack,
    };
'''
          if old_manifest in text:
              text = text.replace(old_manifest, new_manifest, 1)

          helper_marker = "fn write_json(path: PathBuf, value: &impl Serialize) -> Result<()> {\n"
          helper = '''fn preserved_pack_record(
    instance: &Path,
    version: &str,
    protocol: i32,
    artifact: &DownloadArtifact,
    relative_jar: &str,
) -> Result<Option<extract::PackRecord>> {
    let manifest_path = instance.join("rom-bootstrap.json");
    if !manifest_path.is_file() {
        return Ok(None);
    }
    let bytes = fs::read(&manifest_path)
        .with_context(|| format!("cannot read {}", manifest_path.display()))?;
    let existing = match serde_json::from_slice::<BootstrapManifest>(&bytes) {
        Ok(existing) => existing,
        Err(_) => return Ok(None),
    };
    let same_source = existing.schema_version == BOOTSTRAP_SCHEMA_VERSION
        && existing.minecraft_version == version
        && existing.protocol == protocol
        && existing.patch_set == format!("builtin:{version}")
        && existing.source.kind == "official_server_jar"
        && existing.source.sha1.eq_ignore_ascii_case(&artifact.sha1)
        && existing.source.size == artifact.size
        && existing.source.local_path == relative_jar;
    Ok(same_source.then_some(existing.pack).flatten())
}

'''
          if "fn preserved_pack_record(" not in text:
              if helper_marker not in text:
                  raise SystemExit("write_json marker not found")
              text = text.replace(helper_marker, helper + helper_marker, 1)

          test_marker = '''    #[test]
    fn existing_server_configuration_is_preserved() {
'''
          test = '''    #[test]
    fn repreparing_the_same_source_preserves_pack_provenance() {
        let directory = tempdir().unwrap();
        let instance = directory.path();
        let relative = "cache/official/26.1.2/server.jar";
        let artifact = DownloadArtifact {
            sha1: sha1_bytes(b"test"),
            size: 4,
            url: "https://piston-data.mojang.com/server.jar".to_owned(),
        };
        write_instance_files(instance, "26.1.2", 775, &artifact, relative).unwrap();
        let manifest_path = instance.join("rom-bootstrap.json");
        let mut manifest: BootstrapManifest =
            serde_json::from_slice(&fs::read(&manifest_path).unwrap()).unwrap();
        manifest.stage = BootstrapStage::VersionPackGenerated;
        manifest.pack = Some(extract::PackRecord {
            local_path: "versions/26.1.2/26.1.2.rompack".to_owned(),
            sha256: "00".repeat(32),
            size: 1,
            packet_count: 1,
            registry_count: 1,
            registry_entry_count: 1,
            resource_count: 1,
        });
        write_json(manifest_path.clone(), &manifest).unwrap();

        write_instance_files(instance, "26.1.2", 775, &artifact, relative).unwrap();

        let preserved: BootstrapManifest =
            serde_json::from_slice(&fs::read(manifest_path).unwrap()).unwrap();
        assert_eq!(preserved.stage, BootstrapStage::VersionPackGenerated);
        assert_eq!(
            preserved.pack.unwrap().local_path,
            "versions/26.1.2/26.1.2.rompack"
        );
    }

'''
          if "fn repreparing_the_same_source_preserves_pack_provenance" not in text:
              if test_marker not in text:
                  raise SystemExit("test insertion marker not found")
              text = text.replace(test_marker, test + test_marker, 1)

          path.write_text(text, encoding="utf-8")
          Path("crates/rom-bootstrap/.idempotence-trigger").unlink(missing_ok=True)
          PY
          cargo fmt --all
          git add crates/rom-bootstrap/src/lib.rs crates/rom-bootstrap/.idempotence-trigger
          if git diff --cached --quiet; then
            echo "Bootstrap provenance preservation is already applied"
            exit 0
          fi
          git commit -m "Preserve generated pack provenance during setup"
          git push origin HEAD:feature/bootstrap-setup-doctor

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - name: Run clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log
      - name: Run workspace tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test.log
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.os }}
          path: |
            clippy.log
            test.log

  integrate-admin-gui:
    if: github.head_ref == 'agent/admin-web-gui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/admin-web-gui
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Integrate GUI and update lockfile
        shell: bash
        run: |
          set -euo pipefail
          python tools/integrate_admin_gui.py
          cargo fmt --all
          cargo check -p ferrum-server
      - name: Audit complete workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps
      - name: Commit validated source-only diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f tools/integrate_admin_gui.py .github/workflows/integrate-admin-gui.yml
          git checkout origin/master -- .github/workflows/ci.yml
          git add -A
          git commit -m 'Integrate local admin web GUI'
          git push origin HEAD:agent/admin-web-gui

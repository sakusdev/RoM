name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  apply-configuration-tag-hotfix:
    if: github.head_ref == 'hotfix/configuration-tag-registry-filter' || github.ref_name == 'hotfix/configuration-tag-registry-filter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/configuration-tag-registry-filter
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply and validate tag filtering
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/ferrum-version-26-1-2/src/tags.rs')
          text = path.read_text()
          if 'pub const TAG_REGISTRY_COUNT: usize = 16;' in text:
              print('hotfix already applied')
              raise SystemExit(0)

          replacements = {
              'pub const TAG_REGISTRY_COUNT: usize = 20;': 'pub const TAG_REGISTRY_COUNT: usize = 16;',
              'pub const TAG_COUNT: usize = 758;': 'pub const TAG_COUNT: usize = 734;',
              'pub const TAG_ENTRY_COUNT: usize = 8196;': 'pub const TAG_ENTRY_COUNT: usize = 8132;',
              'pub fn configuration_tags() -> Vec<TagRegistry> {\n    vec![': 'pub fn configuration_tags() -> Vec<TagRegistry> {\n    let registries = vec![',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing tag manifest anchor: {old}')
              text = text.replace(old, new, 1)

          tail = '''        TagRegistry::new(
              "minecraft:worldgen/world_preset",
              vec![
                  TagEntry::new("minecraft:extended", vec![4, 2, 3, 0, 5, 1]),
                  TagEntry::new("minecraft:normal", vec![4, 2, 3, 0, 5]),
              ],
          ),
      ]
  }
  '''
          replacement_tail = '''        TagRegistry::new(
              "minecraft:worldgen/world_preset",
              vec![
                  TagEntry::new("minecraft:extended", vec![4, 2, 3, 0, 5, 1]),
                  TagEntry::new("minecraft:normal", vec![4, 2, 3, 0, 5]),
              ],
          ),
      ];
      registries
          .into_iter()
          .filter(|registry| {
              !matches!(
                  registry.id.as_str(),
                  "minecraft:worldgen/configured_feature"
                      | "minecraft:worldgen/flat_level_generator_preset"
                      | "minecraft:worldgen/structure"
                      | "minecraft:worldgen/world_preset"
              )
          })
          .collect()
  }
  '''
          if tail not in text:
              raise SystemExit('tag manifest tail anchor missing')
          text = text.replace(tail, replacement_tail, 1)

          test_anchor = '''    #[test]
      fn required_gameplay_tag_registries_are_present() {
  '''
          new_test = '''    #[test]
      fn server_only_worldgen_tag_registries_are_not_sent() {
          let registries = configuration_tags();
          for id in [
              "minecraft:worldgen/configured_feature",
              "minecraft:worldgen/flat_level_generator_preset",
              "minecraft:worldgen/structure",
              "minecraft:worldgen/world_preset",
          ] {
              assert!(!registries.iter().any(|registry| registry.id == id), "{id}");
          }
          assert!(
              registries
                  .iter()
                  .any(|registry| registry.id == "minecraft:worldgen/biome")
          );
      }

      #[test]
      fn required_gameplay_tag_registries_are_present() {
  '''
          if test_anchor not in text:
              raise SystemExit('tag test anchor missing')
          text = text.replace(test_anchor, new_test, 1)
          path.write_text(text)
          PY
          cargo fmt --all
          cargo test -p ferrum-version-26-1-2
      - name: Commit source hotfix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- crates/ferrum-version-26-1-2/src/tags.rs; then
            echo 'No source changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ferrum-version-26-1-2/src/tags.rs
          git commit -m 'Filter server-only registries from configuration tags'
          git push origin HEAD:hotfix/configuration-tag-registry-filter

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - name: Run clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log
      - name: Run workspace tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test.log
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.os }}
          path: |
            clippy.log
            test.log

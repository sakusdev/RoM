name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  source-fixup:
    if: ${{ github.head_ref == 'feature/bootstrap-setup-doctor' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bootstrap-setup-doctor
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Bootstrap source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cargo fmt --all
          git add crates/rom-bootstrap/src/lib.rs crates/rom-bootstrap/src/main.rs crates/rom-bootstrap/src/setup.rs
          if git diff --cached --quiet; then
            echo "Bootstrap source is already formatted"
            exit 0
          fi
          git commit -m "Format Bootstrap completion changes"
          git push origin HEAD:feature/bootstrap-setup-doctor

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

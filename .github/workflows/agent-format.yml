name: Agent Format

on:
  push:
    branches: [agent/item-entity-domain]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply narrow agent codemods
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/ferrum-play/src/lib.rs")
          text = path.read_text()
          if "mod generic_entity;" not in text:
              text = text.replace("mod entity;\n", "mod entity;\nmod generic_entity;\n", 1)
          export = "pub use generic_entity::{GenericEntityEncodeError, encode_add_world_entity};\n"
          if export not in text:
              marker = "pub use health::{HealthEncodeError, encode_set_health};\n"
              text = text.replace(marker, export + marker, 1)
          path.write_text(text)
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Apply agent gameplay codemods and rustfmt"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-ferrum-game
          path: crates/ferrum-game/src

name: Agent Format

on:
  push:
    branches: [agent/item-entity-domain]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply narrow agent codemods
        shell: python
        run: |
          from pathlib import Path

          play = Path("crates/ferrum-play/src/lib.rs")
          text = play.read_text()
          if "mod generic_entity;" not in text:
              text = text.replace("mod entity;\n", "mod entity;\nmod generic_entity;\n", 1)
          export = "pub use generic_entity::{GenericEntityEncodeError, encode_add_world_entity};\n"
          if export not in text:
              marker = "pub use health::{HealthEncodeError, encode_set_health};\n"
              text = text.replace(marker, export + marker, 1)
          play.write_text(text)

          replication = Path("crates/ferrum-server/src/game_replication.rs")
          text = replication.read_text()
          text = text.replace(
              "PlayerInfoEntry, Respawn, RespawnDataToKeep, encode_add_entity, encode_empty_entity_data,",
              "PlayerInfoEntry, Respawn, RespawnDataToKeep, encode_add_entity, encode_add_world_entity, encode_empty_entity_data,",
              1,
          )
          world_snapshot = '''#[derive(Debug, Clone)]
          struct WorldEntitySnapshot {
              entity_id: EntityId,
              uuid: ferrum_game::EntityUuid,
              entity_type: String,
              transform: Transform,
              velocity: Velocity,
          }

          '''
          marker = "#[derive(Debug)]\nstruct ReplicationConnection"
          if "struct WorldEntitySnapshot" not in text:
              text = text.replace(marker, world_snapshot + marker, 1)
          if "world_entities: BTreeMap<EntityId, WorldEntitySnapshot>" not in text:
              text = text.replace(
                  "    entities: BTreeMap<PlayerUuid, PlayerEntitySnapshot>,\n    active: bool,",
                  "    entities: BTreeMap<PlayerUuid, PlayerEntitySnapshot>,\n    world_entities: BTreeMap<EntityId, WorldEntitySnapshot>,\n    active: bool,",
                  1,
              )
              text = text.replace(
                  "            entities: BTreeMap::new(),\n            active: false,",
                  "            entities: BTreeMap::new(),\n            world_entities: BTreeMap::new(),\n            active: false,",
                  1,
              )
              text = text.replace(
                  "            self.entities.clear();\n            self.healthy = false;",
                  "            self.entities.clear();\n            self.world_entities.clear();\n            self.healthy = false;",
                  1,
              )
          sync_call = "        sync_world_entities(&runtime, &config, &mut connections, &mut exit)?;\n        flush_connections(&mut connections, &mut exit);"
          if sync_call not in text:
              text = text.replace(
                  "        flush_connections(&mut connections, &mut exit);\n    }\n}\n\nfn process_commands(",
                  sync_call + "\n    }\n}\n\nfn process_commands(",
                  1,
              )
          helpers = r'''fn authoritative_world_entities(
              runtime: &SharedGameRuntime,
              registry: &EntityProtocolRegistry,
          ) -> Result<BTreeMap<EntityId, WorldEntitySnapshot>> {
              runtime
                  .with_state(|state| {
                      state
                          .entities()
                          .iter()
                          .filter_map(|(entity_id, entity)| {
                              if entity.is_player()
                                  || registry.protocol_id(entity.entity_type.as_str()).is_none()
                              {
                                  return None;
                              }
                              Some((
                                  *entity_id,
                                  WorldEntitySnapshot {
                                      entity_id: *entity_id,
                                      uuid: entity.uuid,
                                      entity_type: entity.entity_type.as_str().to_owned(),
                                      transform: entity.transform,
                                      velocity: entity.velocity,
                                  },
                              ))
                          })
                          .collect()
                  })
                  .context("cannot read authoritative world entities")
          }

          fn sync_world_entities(
              runtime: &SharedGameRuntime,
              config: &GameReplicationConfig,
              connections: &mut BTreeMap<PlayerUuid, ReplicationConnection>,
              exit: &mut GameReplicationExit,
          ) -> Result<()> {
              let current = authoritative_world_entities(runtime, &config.entity_protocol_ids)?;
              for connection in connections.values_mut() {
                  if !connection.active || !connection.healthy {
                      continue;
                  }
                  let removed = connection
                      .world_entities
                      .keys()
                      .filter(|entity_id| !current.contains_key(entity_id))
                      .copied()
                      .collect::<Vec<_>>();
                  if !removed.is_empty() {
                      connection.queue(
                          PlayOutput::ProtocolPacket {
                              kind: PacketKind::RemoveEntities,
                              payload: encode_remove_entities(&removed)
                                  .context("cannot encode world entity removals")?,
                          },
                          exit,
                      );
                  }
                  for (entity_id, snapshot) in &current {
                      match connection.world_entities.get(entity_id).cloned() {
                          None => {
                              if let Some(payload) = encode_add_world_entity(
                                  snapshot.entity_id,
                                  snapshot.uuid,
                                  &snapshot.entity_type,
                                  snapshot.transform,
                                  snapshot.velocity,
                                  &config.entity_protocol_ids,
                              )
                              .context("cannot encode world add-entity packet")?
                              {
                                  connection.queue(
                                      PlayOutput::ProtocolPacket {
                                          kind: PacketKind::AddEntity,
                                          payload,
                                      },
                                      exit,
                                  );
                                  connection.queue(
                                      PlayOutput::ProtocolPacket {
                                          kind: PacketKind::SetEntityData,
                                          payload: encode_empty_entity_data(snapshot.entity_id)
                                              .context("cannot encode initial world entity data")?,
                                      },
                                      exit,
                                  );
                              }
                          }
                          Some(previous) => {
                              if let Some(movement) = encode_entity_movement(
                                  snapshot.entity_id,
                                  previous.transform,
                                  snapshot.transform,
                              )
                              .context("cannot encode world entity movement")?
                              {
                                  queue_encoded_movement(connection, movement, exit);
                              }
                          }
                      }
                  }
                  if connection.healthy {
                      connection.world_entities = current.clone();
                  }
              }
              Ok(())
          }

          '''
          helper_marker = "const fn protocol_game_mode(game_mode: GameMode) -> i8 {"
          if "fn sync_world_entities(" not in text:
              text = text.replace(helper_marker, helpers + helper_marker, 1)
          replication.write_text(text)

          runtime = Path("crates/ferrum-server/src/play_runtime.rs")
          text = runtime.read_text()
          gameplay_helpers = r'''    fn selected_placement_state(self, world: &RomPackWorld) -> Result<Option<BlockStateId>> {
              let Some(selected) = self.runtime.selected_item(self.player_uuid)? else {
                  return Ok(None);
              };
              let raw = match selected.stack.item() {
                  "minecraft:stone" => world.block_states.stone,
                  "minecraft:dirt" => world.block_states.dirt,
                  "minecraft:grass_block" => world.block_states.grass,
                  "minecraft:bedrock" => world.block_states.bedrock,
                  _ => return Ok(None),
              };
              Ok(Some(BlockStateId::new(raw)))
          }

          fn consume_placement_item(self) -> Result<()> {
              self.runtime.consume_selected_item(self.player_uuid, 1)?;
              Ok(())
          }

          fn spawn_block_drop(
              self,
              position: BlockPosition,
              state: BlockStateId,
              world: &RomPackWorld,
          ) -> Result<()> {
              let item = if state.get() == world.block_states.stone {
                  Some("minecraft:cobblestone")
              } else if state.get() == world.block_states.dirt
                  || state.get() == world.block_states.grass
              {
                  Some("minecraft:dirt")
              } else {
                  None
              };
              if let Some(item) = item {
                  self.runtime.spawn_world_item(
                      self.player_uuid,
                      [f64::from(position.x), f64::from(position.y), f64::from(position.z)],
                      ferrum_game::ItemStack::new(item, 1)?,
                  )?;
              }
              Ok(())
          }

          '''
          helper_marker = "    fn set_creative_slot(self, payload: &[u8]) -> Result<()> {"
          if "fn selected_placement_state(" not in text:
              text = text.replace(helper_marker, gameplay_helpers + helper_marker, 1)

          block_start = text.find("                Some(PacketKind::PlayerAction) => {")
          block_end = text.find("                _ => {", block_start)
          if block_start >= 0 and block_end >= 0:
              replacement = r'''                Some(PacketKind::PlayerAction) => {
                      let action = decode_player_action(packet_reader.take_remaining())?;
                      let sequence = action.sequence;
                      let in_reach = is_block_interaction_within_reach(&player, action.position);
                      let broken_state = if in_reach {
                          shared_world.interaction_block_state(BlockPos {
                              x: action.position.x,
                              y: action.position.y,
                              z: action.position.z,
                          })?
                      } else {
                          None
                      };
                      if in_reach
                          && let Some(event) = player_action_to_world_event(
                              action,
                              BlockStateId::new(shared_world.world_profile().block_states.air),
                          )
                          && is_break_target_mutable(shared_world, event)?
                      {
                          let applied = shared_world.apply_event(connection, event)?;
                          send_world_updates(writer, profile, &applied, play_reader)?;
                          if !applied.is_empty()
                              && let Some(gameplay) = gameplay
                              && let Some(state) = broken_state
                          {
                              gameplay.spawn_block_drop(
                                  action.position,
                                  state,
                                  shared_world.world_profile(),
                              )?;
                          }
                      }
                      send_block_changed_ack(writer, profile, sequence, play_reader)?;
                  }
                  Some(PacketKind::UseItemOn) => {
                      let interaction = decode_use_item_on_block(packet_reader.take_remaining())?;
                      let sequence = interaction.sequence;
                      let placed_state = if let Some(gameplay) = gameplay {
                          gameplay.selected_placement_state(shared_world.world_profile())?
                      } else {
                          Some(BlockStateId::new(shared_world.world_profile().block_states.stone))
                      };
                      if is_block_interaction_within_reach(&player, interaction.position)
                          && let Some(placed_state) = placed_state
                          && let Some(event) = use_item_on_block_to_world_event(interaction, placed_state)
                          && is_placement_target_air(shared_world, event)?
                      {
                          let applied = shared_world.apply_event(connection, event)?;
                          send_world_updates(writer, profile, &applied, play_reader)?;
                          if !applied.is_empty() && let Some(gameplay) = gameplay {
                              gameplay.consume_placement_item()?;
                          }
                      }
                      send_block_changed_ack(writer, profile, sequence, play_reader)?;
                  }
          '''
              text = text[:block_start] + replacement + text[block_end:]
          runtime.write_text(text)
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Wire authoritative block interaction gameplay"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-ferrum-game
          path: crates/ferrum-game/src

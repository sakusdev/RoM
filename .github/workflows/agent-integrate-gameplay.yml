name: Agent Integrate Gameplay

on:
  push:
    branches: [agent/item-entity-domain]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Integrate authoritative gameplay paths
        shell: python
        run: |
          from pathlib import Path

          runtime = Path("crates/ferrum-server/src/game_runtime.rs")
          text = runtime.read_text()
          start = text.index("    pub fn tick(&self) -> Result<(), GameRuntimeError> {")
          end = text.index("    pub fn snapshot(&self)", start)
          replacement = '''    pub fn tick(&self) -> Result<(), GameRuntimeError> {
              let events = {
                  let mut state = self.write()?;
                  let mut events = state.tick_player_gameplay()?;
                  events.extend(state.tick_gameplay()?.events);
                  events
              };
              self.finalize_events(&events)?;
              Ok(())
          }

          '''
          text = text[:start] + replacement + text[end:]
          runtime.write_text(text)

          state = Path("crates/ferrum-game/src/state.rs")
          text = state.read_text()
          old = "            player.vitals.heal(amount)?;\n"
          new = "            let max_health = player.gameplay.max_health();\n            player.vitals.heal_to(amount, max_health)?;\n"
          if old in text:
              text = text.replace(old, new, 1)
          elif "player.vitals.heal_to(amount, max_health)?;" not in text:
              raise SystemExit("heal_player marker not found")
          state.write_text(text)
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Commit validated integration
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Integrate persistent player gameplay tick"
          git push

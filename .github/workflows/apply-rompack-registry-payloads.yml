name: Finalize generated registry payloads

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'feature/rompack-registry-payloads'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rompack-registry-payloads
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Make the test state follow its server profile
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/ferrum-server/src/main.rs')
          text = path.read_text(encoding='utf-8')
          old = '''    #[cfg(test)]
              fn new(initial_online_players: i32) -> Self {
                  Self::with_world(
                      initial_online_players,
                      play_runtime::builtin_world_profile(),
                  )
                  .expect("built-in world profile must initialize")
              }

              #[cfg(test)]
              fn with_world(initial_online_players: i32, world: RomPackWorld) -> Result<Self> {
                  Self::with_runtime(
                      initial_online_players,
                      world,
                      builtin_26_1_2_registry_payloads()?,
                  )
              }

          '''
          new = '''    #[cfg(test)]
              fn new(config: &ServerConfig) -> Self {
                  let registry_payloads =
                      if config.profile_name.as_deref() == Some(version_26_1_2::PROFILE_NAME) {
                          builtin_26_1_2_registry_payloads()
                              .expect("built-in registry payloads must encode")
                      } else {
                          Vec::new()
                      };
                  Self::with_runtime(
                      config.online_players,
                      play_runtime::builtin_world_profile(),
                      registry_payloads,
                  )
                  .expect("built-in world profile must initialize")
              }

          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one test constructor block, found {text.count(old)}')
          text = text.replace(old, new, 1)
          count = text.count('ServerState::new(config.online_players)')
          if count < 1:
              raise SystemExit('expected at least one ServerState::new(config.online_players) call')
          text = text.replace('ServerState::new(config.online_players)', 'ServerState::new(config)')
          path.write_text(text, encoding='utf-8')
          PY
          rm -f registry-payload-validation.txt
          cargo fmt --all
      - name: Validate finalized workspace
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit finalized implementation
        run: |
          rm .github/workflows/apply-rompack-registry-payloads.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize generated registry payload runtime"
          git push origin HEAD:feature/rompack-registry-payloads

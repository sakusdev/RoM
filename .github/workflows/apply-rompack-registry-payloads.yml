name: Finalize generated registry payloads

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'feature/rompack-registry-payloads'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rompack-registry-payloads
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Fix the owned test configuration borrow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/ferrum-server/src/main.rs')
          text = path.read_text(encoding='utf-8')
          old = '''        let config = ServerConfig {
                      online_players: 0,
                      max_players: 10,
                      ..ServerConfig::default()
                  };
                  let state = ServerState::new(config);
          '''
          new = '''        let config = ServerConfig {
                      online_players: 0,
                      max_players: 10,
                      ..ServerConfig::default()
                  };
                  let state = ServerState::new(&config);
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one owned-config state constructor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f registry-payload-validation.txt
          rm -f registry-payload-final-validation.txt
          cargo fmt --all
      - name: Validate finalized workspace
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit finalized implementation
        run: |
          rm .github/workflows/apply-rompack-registry-payloads.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize generated registry payload runtime"
          git push origin HEAD:feature/rompack-registry-payloads

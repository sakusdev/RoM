name: Finalize Play connection bridge

on:
  pull_request:
    branches: [master]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feature/play-connection-bridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/play-connection-bridge
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format and validate
        run: |
          cargo fmt --all
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Finalize Play connection bridge
          branch: feature/play-connection-bridge
          file_pattern: crates/ferrum-server/src/play_connection.rs crates/ferrum-server/src/lib.rs

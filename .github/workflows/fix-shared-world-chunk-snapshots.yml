name: Fix shared-world chunk snapshots

on:
  pull_request:
    branches:
      - master
    types:
      - synchronize

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'feature/shared-world-chunk-snapshots'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/shared-world-chunk-snapshots
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Remove obsolete flat chunk constructor
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/ferrum-server/src/main.rs")
          text = path.read_text(encoding="utf-8")
          old_import = "use ferrum_world::{BiomeId, BlockStateId, ChunkPos, FlatWorldSpec, StaticChunk};"
          if text.count(old_import) != 1:
              raise SystemExit(f"expected one world import, found {text.count(old_import)}")
          text = text.replace(old_import, "use ferrum_world::ChunkPos;", 1)

          start_marker = "\nfn static_chunk() -> Result<StaticChunk> {"
          end_marker = "\nfn static_join_game(config: &ServerConfig) -> JoinGame {"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          text = text[:start] + "\n" + text[end:]
          path.write_text(text, encoding="utf-8")
          PY
          rm -f shared-chunk-diagnostics.txt
          rm .github/workflows/fix-shared-world-chunk-snapshots.yml
      - name: Validate
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove obsolete static chunk constructor"
          git push origin HEAD:feature/shared-world-chunk-snapshots

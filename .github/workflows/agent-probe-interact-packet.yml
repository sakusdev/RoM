name: Agent Probe Interact Packet

on:
  push:
    branches: [agent/item-entity-domain]
    paths:
      - '.github/workflows/agent-probe-interact-packet.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Download official 26.1.2 server
        run: |
          curl -fsSL -o server.jar https://piston-data.mojang.com/v1/objects/97ccd4c0ed3f81bbb7bfacddd1090b0c56f9bc51/server.jar
          echo '97ccd4c0ed3f81bbb7bfacddd1090b0c56f9bc51  server.jar' | sha1sum -c -
      - name: Extract bundled game jar
        run: |
          unzip -p server.jar META-INF/versions/26.1.2/server-26.1.2.jar > game.jar
      - name: Inspect interact packet class
        run: |
          javap -classpath game.jar -c -p net.minecraft.network.protocol.game.ServerboundInteractPacket | tee interact.txt
      - name: Generate packet reports
        run: |
          mkdir -p out
          java -DbundlerMainClass=net.minecraft.data.Main -jar server.jar --reports --output out || true
          find out -type f -maxdepth 4 -print
          if [ -f out/reports/packets.json ]; then
            python - <<'PY'
          import json
          p='out/reports/packets.json'
          d=json.load(open(p))
          def walk(x,path=''):
              if isinstance(x,dict):
                  for k,v in x.items():
                      if 'interact' in k.lower(): print(path+'/'+k, v)
                      walk(v,path+'/'+k)
              elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,f'{path}/{i}')
          walk(d)
          PY
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: interact-probe
          path: |
            interact.txt
            out/reports/packets.json
          if-no-files-found: warn

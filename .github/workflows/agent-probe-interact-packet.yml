name: Agent Probe Interact Packet

on:
  push:
    branches: [agent/item-entity-domain]
    paths:
      - '.github/workflows/agent-probe-interact-packet.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Download official 26.1.2 server
        run: |
          curl -fsSL -o server.jar https://piston-data.mojang.com/v1/objects/97ccd4c0ed3f81bbb7bfacddd1090b0c56f9bc51/server.jar
          echo '97ccd4c0ed3f81bbb7bfacddd1090b0c56f9bc51  server.jar' | sha1sum -c -
      - name: Extract bundled game jar
        run: |
          unzip -p server.jar META-INF/versions/26.1.2/server-26.1.2.jar > game.jar
      - name: Inspect interact packet and handler
        run: |
          javap -classpath game.jar -c -p net.minecraft.network.protocol.game.ServerboundInteractPacket | tee interact.txt
          javap -classpath game.jar -c -p net.minecraft.server.network.ServerGamePacketListenerImpl | sed -n '/handleInteract(/,/^[[:space:]]*public /p' | tee handle-interact.txt
          javap -classpath game.jar -c -p net.minecraft.world.InteractionHand | tee interaction-hand.txt
          javap -classpath game.jar -c -p net.minecraft.world.phys.Vec3 | sed -n '/LP_STREAM_CODEC/,/static {/p' | tee vec3-codec.txt
      - name: Generate packet reports
        run: |
          mkdir -p out
          java -DbundlerMainClass=net.minecraft.data.Main -jar server.jar --reports --output out || true
          if [ -f out/reports/packets.json ]; then
            python - <<'PY'
          import json
          p='out/reports/packets.json'
          d=json.load(open(p))
          print('/play/serverbound/minecraft:interact', d['play']['serverbound']['minecraft:interact'])
          PY
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: interact-probe
          path: |
            interact.txt
            handle-interact.txt
            interaction-hand.txt
            vec3-codec.txt
            out/reports/packets.json
          if-no-files-found: warn

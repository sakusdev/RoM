name: Release RoM server binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0-alpha.1
        required: true
        default: v0.1.0-alpha.1
        type: string
      prerelease:
        description: Publish as a prerelease
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "v*"
    branches:
      - "release/**"
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release metadata
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      target_sha: ${{ steps.meta.outputs.target_sha }}
    steps:
      - id: meta
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_PRERELEASE: ${{ inputs.prerelease }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            tag="${PR_HEAD_REF#release/}"
            target_sha="$PR_HEAD_SHA"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            target_sha="$GITHUB_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$DISPATCH_TAG"
            target_sha="$GITHUB_SHA"
          else
            tag="${GITHUB_REF_NAME#release/}"
            target_sha="$GITHUB_SHA"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            prerelease="$DISPATCH_PRERELEASE"
          elif [[ "$tag" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            source_binary: ferrum-server.exe
            package_binary: rom-server.exe
            raw_asset: rom-server-windows-x86_64.exe
            archive: zip
            native: true
          - platform: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            source_binary: ferrum-server
            package_binary: rom-server
            raw_asset: rom-server-linux-x86_64
            archive: tar.gz
            native: true
          - platform: linux-aarch64
            os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            source_binary: ferrum-server
            package_binary: rom-server
            raw_asset: rom-server-linux-aarch64
            archive: tar.gz
            native: false
          - platform: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            source_binary: ferrum-server
            package_binary: rom-server
            raw_asset: rom-server-macos-x86_64
            archive: tar.gz
            native: true
          - platform: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            source_binary: ferrum-server
            package_binary: rom-server
            raw_asset: rom-server-macos-aarch64
            archive: tar.gz
            native: true

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build native server
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --locked --release -p ferrum-server --target ${{ matrix.target }}

      - name: Build Linux ARM64 server
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --locked --release -p ferrum-server --target ${{ matrix.target }}

      - name: Smoke-test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "target/${{ matrix.target }}/release/${{ matrix.source_binary }}" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test Unix executable
        if: runner.os != 'Windows' && matrix.native
        shell: bash
        run: |
          set -euo pipefail
          "target/${{ matrix.target }}/release/${{ matrix.source_binary }}" --help >/dev/null

      - name: Package Windows release
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $package = "RoM-$env:TAG-${{ matrix.platform }}"
          $stage = "dist/$package"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.source_binary }}" "$stage/${{ matrix.package_binary }}"
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.source_binary }}" "dist/${{ matrix.raw_asset }}"
          Copy-Item "examples/server-26.1.2.toml" "$stage/server.toml"
          Copy-Item README.md "$stage/README.md"
          Copy-Item LICENSE "$stage/LICENSE"
          Set-Content -Path "$stage/VERSION" -Value $env:TAG -NoNewline
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$package.zip" -Force

      - name: Package Unix release
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          package="RoM-${TAG}-${{ matrix.platform }}"
          stage="dist/${package}"
          mkdir -p "$stage"
          install -m 0755 "target/${{ matrix.target }}/release/${{ matrix.source_binary }}" "$stage/${{ matrix.package_binary }}"
          install -m 0755 "target/${{ matrix.target }}/release/${{ matrix.source_binary }}" "dist/${{ matrix.raw_asset }}"
          cp examples/server-26.1.2.toml "$stage/server.toml"
          cp README.md "$stage/README.md"
          cp LICENSE "$stage/LICENSE"
          printf '%s' "$TAG" > "$stage/VERSION"
          tar -C dist -czf "dist/${package}.tar.gz" "$package"

      - name: Record Unix checksums
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for asset in "${{ matrix.raw_asset }}" *.tar.gz; do
            [[ -f "$asset" ]] && shasum -a 256 "$asset" > "$asset.sha256"
          done

      - name: Record Windows checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Extension -eq '.zip' -or $_.Extension -eq '.exe' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -NoNewline "$($_.FullName).sha256"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/rom-server-*
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate combined SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f \
            ! -name '*.sha256' \
            ! -name 'SHA256SUMS' \
            -printf '%f\0' |
            sort -z |
            xargs -0 -r sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Write release notes
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: |
          cat > release-notes.md <<EOF
          # RoM ${TAG}

          Native Rust Minecraft Java Edition server binaries.

          **Target:** Minecraft Java Edition 26.1.2 / protocol 775  
          **Source commit:** ${TARGET_SHA}

          This prerelease includes the deterministic single-chunk Play milestone: login, Configuration, synchronized registries, Join Game, one flat chunk with light, position synchronization, system chat, and Keep Alive.

          The server is still experimental. Player movement processing, dynamic chunk streaming, block interaction, entities, persistence, and online-mode authentication are not implemented yet.

          ## Downloads

          Each platform has both a standalone executable and an archive containing:

          - rom-server or rom-server.exe
          - server.toml
          - README.md
          - LICENSE
          - VERSION

          Verify downloads with SHA256SUMS. Unix users downloading a standalone binary may need to run chmod +x on it.
          EOF

      - name: Create or update release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail

          release_flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            release_flags+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "RoM $TAG" \
              --notes-file release-notes.md \
              "${release_flags[@]}"
          else
            gh release create "$TAG" \
              --target "$TARGET_SHA" \
              --title "RoM $TAG" \
              --notes-file release-notes.md \
              "${release_flags[@]}"
          fi

          find dist -maxdepth 1 -type f -print0 |
            xargs -0 gh release upload "$TAG" --clobber

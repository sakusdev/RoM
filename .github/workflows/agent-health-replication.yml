name: Complete authoritative health replication

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: agent-complete-authoritative-health
  cancel-in-progress: false

jobs:
  implement-and-validate:
    if: >-
      github.event.pull_request.number == 61 &&
      github.event.pull_request.head.ref == 'agent/complete-server-features'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-server-features
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Implement, validate, and commit
        shell: bash
        run: |
          log=/tmp/health-replication-validation.log
          : > "$log"
          status=0
          set +e

          python3 - <<'PY' 2>&1 | tee -a "$log"
          from pathlib import Path

          path = Path('.github/scripts/agent_health_replication.py')
          text = path.read_text()
          old = '    text = replace_once(text, old_connected_tail, new_connected_tail, "initial health replication")'
          new = '''    connected_start = text.index("        GameEvent::PlayerConnected")
              connected_end = text.index("        GameEvent::PlayerDisconnected", connected_start)
              connected = text[connected_start:connected_end]
              connected = replace_once(
                  connected,
                  old_connected_tail,
                  new_connected_tail,
                  "initial health replication",
              )
              text = text[:connected_start] + connected + text[connected_end:]'''
          if text.count(old) != 1:
              raise SystemExit(f'health transform patch: expected one anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          status=${PIPESTATUS[0]}

          if [ "$status" -eq 0 ]; then
            cp .github/scripts/agent_health_rs.txt crates/ferrum-play/src/health.rs
            python3 .github/scripts/agent_health_replication.py 2>&1 | tee -a "$log"
            status=${PIPESTATUS[0]}
          fi
          if [ "$status" -eq 0 ]; then
            python3 - <<'PY' 2>&1 | tee -a "$log"
          from pathlib import Path

          path = Path('crates/ferrum-server/src/game_replication.rs')
          text = path.read_text()
          connected_start = text.index('        GameEvent::PlayerConnected')
          connected_end = text.index('        GameEvent::PlayerDisconnected', connected_start)
          connected = text[connected_start:connected_end]
          health_start = connected.index('            if let Some(vitals) = runtime')
          health_end = connected.index('            broadcast_except(', health_start)
          health = connected[health_start:health_end]
          connected = connected[:health_start] + connected[health_end:]
          anchor = '        GameEvent::PlayerConnected { uuid, name, .. } => {\n'
          if connected.count(anchor) != 1:
              raise SystemExit(f'player connected arm: expected one, found {connected.count(anchor)}')
          connected = connected.replace(anchor, anchor + health, 1)
          path.write_text(text[:connected_start] + connected + text[connected_end:])
          PY
            status=${PIPESTATUS[0]}
          fi
          if [ "$status" -eq 0 ]; then
            cargo fmt --all 2>&1 | tee -a "$log"
            status=${PIPESTATUS[0]}
          fi
          if [ "$status" -eq 0 ]; then
            cargo fmt --all --check 2>&1 | tee -a "$log"
            status=${PIPESTATUS[0]}
          fi
          if [ "$status" -eq 0 ]; then
            cargo check --workspace --all-targets --all-features 2>&1 | tee -a "$log"
            status=${PIPESTATUS[0]}
          fi
          if [ "$status" -eq 0 ]; then
            cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee -a "$log"
            status=${PIPESTATUS[0]}
          fi
          if [ "$status" -eq 0 ]; then
            cargo test --workspace --all-features 2>&1 | tee -a "$log"
            status=${PIPESTATUS[0]}
          fi
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$status" -ne 0 ]; then
            git checkout -- \
              crates/ferrum-protocol/src/lib.rs \
              crates/ferrum-protocol/src/packet_catalog.rs \
              crates/ferrum-version-26-1-2/src/lib.rs \
              crates/ferrum-play/src/lib.rs \
              crates/ferrum-game/src/state.rs \
              crates/ferrum-server/src/game_runtime.rs \
              crates/ferrum-server/src/game_replication.rs \
              docs/SERVER_ROADMAP.md
            rm -f crates/ferrum-play/src/health.rs
            cp "$log" .github/health-replication-diagnostic.txt
            git add .github/health-replication-diagnostic.txt
            if ! git diff --cached --quiet; then
              git commit -m "Record authoritative health validation failure"
              git push origin HEAD:agent/complete-server-features
            fi
            exit "$status"
          fi

          rm .github/scripts/agent_health_replication.py
          rm .github/scripts/agent_health_rs.txt
          rm .github/workflows/agent-health-replication.yml
          rm -f .github/health-replication-diagnostic.txt
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Replicate authoritative player health"
          git push origin HEAD:agent/complete-server-features

name: Format core source

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/finish-rom-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-rom-core
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit all core source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates/ferrum-world/Cargo.toml crates/ferrum-world/src crates/ferrum-server/src
          if ! git diff --cached --quiet; then
            git commit -m 'Format core persistence source'
            git push origin HEAD:agent/finish-rom-core
          fi

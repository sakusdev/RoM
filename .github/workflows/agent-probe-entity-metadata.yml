name: Agent Probe Entity Metadata

on:
  push:
    branches: [agent/item-entity-domain]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Download official Minecraft 26.1.2 server
        run: curl --fail --location --retry 3 -o server.jar https://piston-data.mojang.com/v1/objects/97ccd4c0ed3f81bbb7bfacddd1090b0c56f9bc51/server.jar
      - name: Extract actual game jar
        shell: python
        run: |
          import hashlib, pathlib, zipfile
          outer = pathlib.Path('server.jar')
          print('outer_sha1', hashlib.sha1(outer.read_bytes()).hexdigest())
          with zipfile.ZipFile(outer) as z:
              names = z.namelist()
              if 'META-INF/versions.list' in names:
                  rows = z.read('META-INF/versions.list').decode().splitlines()
                  print('versions.list', rows)
                  candidate = rows[0].split('\t')[-1]
                  candidates = [candidate, 'META-INF/versions/' + candidate]
                  selected = next((name for name in candidates if name in names), None)
                  if selected is None:
                      raise SystemExit('embedded game jar path not found')
                  print('game_jar_entry', selected)
                  pathlib.Path('game.jar').write_bytes(z.read(selected))
              else:
                  pathlib.Path('game.jar').write_bytes(outer.read_bytes())
      - name: Inspect entity data serializer registration
        run: |
          javap -classpath game.jar -c -p net.minecraft.network.syncher.EntityDataSerializers > serializers.txt
          cat serializers.txt
      - name: Inspect ItemEntity synchronized data
        run: |
          javap -classpath game.jar -c -p net.minecraft.world.entity.item.ItemEntity > item_entity.txt
          cat item_entity.txt
      - name: Inspect ExperienceOrb synchronized data
        run: |
          javap -classpath game.jar -c -p net.minecraft.world.entity.ExperienceOrb > xp_orb.txt
          cat xp_orb.txt
      - uses: actions/upload-artifact@v4
        with:
          name: entity-metadata-probe
          path: |
            serializers.txt
            item_entity.txt
            xp_orb.txt

name: Export official 26.1.2 tags

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/finish-rom-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-rom-core
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare verified official source and reports
        shell: bash
        run: |
          set -euo pipefail
          instance="$RUNNER_TEMP/rom-tags-export"
          cargo run --quiet --locked --release -p rom-bootstrap -- prepare \
            --instance "$instance" \
            --version 26.1.2 \
            --accept-minecraft-eula \
            --json > prepare.json
          server_jar="$(jq -r '.official_server_jar' prepare.json)"
          listed_path="$(unzip -p "$server_jar" META-INF/versions.list 2>/dev/null | tr -d '\r' | awk -F '\t' 'NF == 3 { print $3; exit }')"
          if [[ "$listed_path" == META-INF/versions/* ]]; then
            inner_path="$listed_path"
          else
            inner_path="META-INF/versions/$listed_path"
          fi
          unzip -p "$server_jar" "$inner_path" > game-server.jar
          mkdir reports-work
          (
            cd reports-work
            timeout 900 java -DbundlerMainClass=net.minecraft.data.Main -jar "$server_jar" --reports
          )
          find reports-work -path '*/reports/registries.json' -type f -print -quit | xargs -r -I{} cp '{}' registries.json
          test -s registries.json
      - name: Extract official tag resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p official-tags
          unzip -Z1 game-server.jar | grep -E '^data/[^/]+/tags/.+\.json$' | sort > tag-files.txt
          while IFS= read -r path; do
            mkdir -p "official-tags/$(dirname "$path")"
            unzip -p game-server.jar "$path" > "official-tags/$path"
          done < tag-files.txt
          cp tag-files.txt registries.json official-tags/
          printf 'tag_files=%s\n' "$(wc -l < tag-files.txt)" > official-tags/summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: official-26.1.2-tags
          path: official-tags
          if-no-files-found: error
          retention-days: 7

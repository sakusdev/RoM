name: Connect world persistence service

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/finish-rom-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-rom-core
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Connect startup, autosave, save-all, and shutdown
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/ferrum-server/src/main.rs')
          text = path.read_text()

          def replace(old: str, new: str, label: str):
              global text
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'{label} anchor missing')
              text = text.replace(old, new, 1)

          replace('mod play_runtime;\n', 'mod play_runtime;\nmod world_service;\n', 'module')
          replace(
              'use identity::{PlayerIdentity, offline_player_identity};\n',
              'use identity::{PlayerIdentity, offline_player_identity};\nuse world_service::{\n    WorldService, WorldServiceConfig, WorldServiceControl, load_world_state,\n    spawn_world_service,\n};\n',
              'world service import',
          )
          replace(
              '    /// Autosave interval in seconds. Zero disables periodic saves; shutdown still saves.\n',
              '    /// Persistent world snapshot. Defaults to world-state.json beside server.toml.\n    #[arg(long, value_name = "PATH")]\n    world_state: Option<PathBuf>,\n\n    /// Autosave interval in seconds. Zero disables periodic saves; shutdown still saves.\n',
              'CLI world state',
          )
          text = text.replace(
              '    world: play_runtime::SharedWorld,',
              '    world: Arc<play_runtime::SharedWorld>,'
          )
          replace(
              '    game_service: GameService,\n',
              '    game_service: GameService,\n    world_service: WorldService,\n',
              'state world service field',
          )
          replace(
              '        game_state: Option<GameState>,\n        game_service_config: GameServiceConfig,\n    ) -> Result<Self> {',
              '        game_state: Option<GameState>,\n        game_service_config: GameServiceConfig,\n        world_service_config: WorldServiceConfig,\n    ) -> Result<Self> {',
              'runtime signature',
          )
          replace(
              '        let shared_world = match loaded_chunks {\n            Some(store) => {\n                play_runtime::SharedWorld::from_store_with_policy(store, world, play_policy)?\n            }\n            None => play_runtime::SharedWorld::new_with_policy(center, world, play_policy)?,\n        };\n        let shared_play_runtime = spawn_shared_play_runtime(shared_runtime_config)?;',
              '        let shared_world = Arc::new(match loaded_chunks {\n            Some(store) => {\n                play_runtime::SharedWorld::from_store_with_policy(store, world, play_policy)?\n            }\n            None => play_runtime::SharedWorld::new_with_policy(center, world, play_policy)?,\n        });\n        let world_service =\n            spawn_world_service(Arc::clone(&shared_world), world_service_config)?;\n        let shared_play_runtime = spawn_shared_play_runtime(shared_runtime_config)?;',
              'shared world creation',
          )
          replace(
              '            game_service,\n            game_replication,',
              '            game_service,\n            world_service,\n            game_replication,',
              'state initializer',
          )
          text = text.replace(
              '            GameServiceConfig::default(),\n        )',
              '            GameServiceConfig::default(),\n            WorldServiceConfig::default(),\n        )'
          )
          replace(
              '    fn game_control(&self) -> GameServiceControl {\n        self.game_service.control()\n    }\n',
              '    fn game_control(&self) -> GameServiceControl {\n        self.game_service.control()\n    }\n\n    fn world_control(&self) -> WorldServiceControl {\n        self.world_service.control()\n    }\n',
              'world control accessor',
          )
          replace(
              '        self.game_service.shutdown()\n    }',
              '        let world = self.world_service.shutdown()?;\n        println!(\n            "world service stopped after {} autosaves and {} requested/final saves",\n            world.autosaves, world.requested_saves\n        );\n        self.game_service.shutdown()\n    }',
              'shutdown',
          )
          replace(
              '    let game_state_path = cli.game_state.clone().unwrap_or(default_state_path);\n',
              '    let game_state_path = cli.game_state.clone().unwrap_or(default_state_path);\n    let default_world_path = config_path\n        .parent()\n        .unwrap_or_else(|| Path::new("."))\n        .join("world-state.json");\n    let world_state_path = cli.world_state.clone().unwrap_or(default_world_path);\n',
              'world path',
          )
          replace(
              '    let loaded_chunks = load_configured_world_chunks(&config.world, &world_profile)?;\n',
              '    let loaded_chunks = match load_world_state(&world_state_path, &world_profile)? {\n        Some(store) => Some(store),\n        None => load_configured_world_chunks(&config.world, &world_profile)?,\n    };\n',
              'world restore',
          )
          replace(
              '    let state = Arc::new(ServerState::with_runtime(\n',
              '    let world_service_config = WorldServiceConfig::new(\n        world_state_path,\n        (cli.autosave_seconds > 0).then(|| Duration::from_secs(cli.autosave_seconds)),\n    );\n    let state = Arc::new(ServerState::with_runtime(\n',
              'world service config',
          )
          replace(
              '        game_service_config,\n    )?);',
              '        game_service_config,\n        world_service_config,\n    )?);',
              'runtime invocation',
          )
          replace(
              '            state.game_control(),\n            state.shutdown_signal(),',
              '            state.game_control(),\n            state.world_control(),\n            state.shutdown_signal(),',
              'console call',
          )
          replace(
              'fn spawn_server_console(\n    runtime: SharedGameRuntime,\n    game_control: GameServiceControl,\n    shutdown: Arc<AtomicBool>,',
              'fn spawn_server_console(\n    runtime: SharedGameRuntime,\n    game_control: GameServiceControl,\n    world_control: WorldServiceControl,\n    shutdown: Arc<AtomicBool>,',
              'console signature',
          )
          replace(
              '                            }\n                        }\n                        if outcome.shutdown_requested {',
              '                            }\n                            match world_control.save_now() {\n                                Ok(report) => println!(\n                                    "saved world state to {} ({} bytes, {} chunks)",\n                                    report.path.display(),\n                                    report.bytes,\n                                    report.chunks\n                                ),\n                                Err(error) => eprintln!("world save failed: {error:#}"),\n                            }\n                        }\n                        if outcome.shutdown_requested {',
              'console save',
          )
          path.write_text(text)
          PY
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ferrum-server/src/main.rs
          if ! git diff --cached --quiet; then
            git commit -m 'Connect durable world persistence to server lifecycle'
            git push origin HEAD:agent/finish-rom-core
          fi

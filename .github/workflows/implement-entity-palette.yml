name: Implement entity type palette

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'agent/finish-rom-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-rom-core
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Extend schema-v8 with entity type IDs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f'{label} anchor missing')
              return text.replace(old, new, 1)

          # ferrum-rompack schema and validation.
          path = Path('crates/ferrum-rompack/src/lib.rs')
          text = path.read_text()
          text = text.replace('pub const ROMPACK_SCHEMA_VERSION: u32 = 7;', 'pub const ROMPACK_SCHEMA_VERSION: u32 = 8;')
          text = replace_once(
              text,
              '    pub max_data_components: usize,\n',
              '    pub max_data_components: usize,\n    pub max_entity_types: usize,\n',
              'entity type limit field',
          )
          text = replace_once(
              text,
              '            max_data_components: 100_000,\n',
              '            max_data_components: 100_000,\n            max_entity_types: 100_000,\n',
              'entity type default limit',
          )
          text = replace_once(
              text,
              '    /// Static data-component-type IDs used by version-aware ItemStack codecs.\n    pub data_components: Vec<RomPackDataComponent>,\n',
              '    /// Static data-component-type IDs used by version-aware ItemStack codecs.\n    pub data_components: Vec<RomPackDataComponent>,\n    /// Static entity-type IDs used by Play-state entity replication.\n    pub entity_types: Vec<RomPackEntityType>,\n',
              'rompack entity field',
          )
          text = replace_once(
              text,
              '''#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]
          pub struct RomPackDataComponent {
              pub component: String,
              pub protocol_id: i32,
          }
          '''.replace('          ', ''),
              '''#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]
          pub struct RomPackDataComponent {
              pub component: String,
              pub protocol_id: i32,
          }

          #[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]
          pub struct RomPackEntityType {
              pub entity_type: String,
              pub protocol_id: i32,
          }
          '''.replace('          ', ''),
              'entity type record',
          )
          text = replace_once(
              text,
              '    pub data_component_count: usize,\n',
              '    pub data_component_count: usize,\n    pub entity_type_count: usize,\n',
              'entity type summary field',
          )
          validation_anchor = '''    if pack.registries.len() > limits.max_registries {
          '''.replace('          ', '')
          validation = '''    if pack.entity_types.len() > limits.max_entity_types {
              bail!("version pack contains too many entity-type registry records");
          }
              let mut previous_entity_type: Option<&str> = None;
              let mut entity_protocol_ids = BTreeSet::new();
              for entity_type in &pack.entity_types {
                  validate_resource_location(
                      "entity type ID",
                      &entity_type.entity_type,
                      limits.max_identifier_bytes,
                  )?;
                  if previous_entity_type
                      .is_some_and(|previous| previous >= entity_type.entity_type.as_str())
                  {
                      bail!("version-pack entity types must be strictly sorted and unique");
                  }
                  previous_entity_type = Some(&entity_type.entity_type);
                  if entity_type.protocol_id < 0 {
                      bail!(
                          "entity type {} protocol ID cannot be negative",
                          entity_type.entity_type
                      );
                  }
                  if !entity_protocol_ids.insert(entity_type.protocol_id) {
                      bail!("duplicate entity type protocol ID {}", entity_type.protocol_id);
                  }
              }
              if !pack
                  .entity_types
                  .iter()
                  .any(|entry| entry.entity_type == "minecraft:player")
              {
                  bail!("version pack is missing minecraft:player entity type");
              }

          '''.replace('          ', '') + validation_anchor
          if 'version pack contains too many entity-type registry records' not in text:
              text = replace_once(text, validation_anchor, validation, 'entity type validation')
          text = replace_once(
              text,
              '        data_component_count: pack.data_components.len(),\n',
              '        data_component_count: pack.data_components.len(),\n        entity_type_count: pack.entity_types.len(),\n',
              'entity type summary value',
          )
          path.write_text(text)

          # Mojang registries.json parsing.
          path = Path('crates/rom-bootstrap/src/registry_report.rs')
          text = path.read_text()
          text = text.replace(
              'use ferrum_rompack::{RomPackDataComponent, RomPackItem};',
              'use ferrum_rompack::{RomPackDataComponent, RomPackEntityType, RomPackItem};'
          )
          text = replace_once(
              text,
              '    pub data_components: Vec<RomPackDataComponent>,\n',
              '    pub data_components: Vec<RomPackDataComponent>,\n    pub entity_types: Vec<RomPackEntityType>,\n',
              'registry report entity field',
          )
          text = replace_once(
              text,
              '''    Ok(RegistryProtocolReport {
              items,
              data_components,
          })
          '''.replace('          ', ''),
              '''    let entity_types = parse_registry_entries(
              &value,
              "minecraft:entity_type",
              "entity type",
              |entity_type, protocol_id| RomPackEntityType {
                  entity_type,
                  protocol_id,
              },
          )?;
              Ok(RegistryProtocolReport {
                  items,
                  data_components,
                  entity_types,
              })
          '''.replace('          ', ''),
              'registry report result',
          )
          path.write_text(text)

          # Bootstrap pack construction and accounting.
          path = Path('crates/rom-bootstrap/src/extract.rs')
          text = path.read_text()
          text = replace_once(
              text,
              '    pub item_count: usize,\n',
              '    pub item_count: usize,\n    pub entity_type_count: usize,\n',
              'generate report entity count',
          )
          text = replace_once(
              text,
              '    pub item_count: usize,\n    pub registry_count: usize,\n',
              '    pub item_count: usize,\n    #[serde(default)]\n    pub entity_type_count: usize,\n    pub registry_count: usize,\n',
              'pack record entity count',
          )
          text = replace_once(
              text,
              '    let data_components = protocol_registries.data_components;\n',
              '    let data_components = protocol_registries.data_components;\n    let entity_types = protocol_registries.entity_types;\n',
              'extract entity types',
          )
          text = replace_once(
              text,
              '        data_components,\n        registries,\n',
              '        data_components,\n        entity_types,\n        registries,\n',
              'pack entity types',
          )
          text = replace_once(
              text,
              '        item_count: summary.item_count,\n        registry_count: summary.registry_count,\n',
              '        item_count: summary.item_count,\n        entity_type_count: summary.entity_type_count,\n        registry_count: summary.registry_count,\n',
              'pack record summary entity count',
          )
          text = text.replace(
              '        item_count: summary.item_count,\n        world_data_version:',
              '        item_count: summary.item_count,\n        entity_type_count: summary.entity_type_count,\n        world_data_version:'
          )
          text = replace_once(
              text,
              '        items: Vec::new(),\n        data_components: Vec::new(),\n',
              '        items: Vec::new(),\n        data_components: Vec::new(),\n        entity_types: Vec::new(),\n',
              'empty protocol registries',
          )
          text = replace_once(
              text,
              '        && summary.item_count == record.item_count\n',
              '        && summary.item_count == record.item_count\n        && summary.entity_type_count == record.entity_type_count\n',
              'record entity count validation',
          )
          path.write_text(text)

          # Add entity_types to all explicit RomPack and RegistryProtocolReport
          # literals that predate schema v8.
          for rust in Path('crates').rglob('*.rs'):
              source = rust.read_text()
              changed = source
              lines = changed.splitlines(keepends=True)
              output = []
              for index, line in enumerate(lines):
                  output.append(line)
                  stripped = line.strip()
                  if stripped.startswith('data_components:') or stripped == 'data_components,':
                      lookahead = ''.join(lines[index + 1:index + 5])
                      if 'entity_types' not in lookahead:
                          indent = line[:len(line) - len(line.lstrip())]
                          value = 'entity_types,' if stripped == 'data_components,' else 'entity_types: Vec::new(),'
                          output.append(f'{indent}{value}\n')
              changed = ''.join(output)
              if changed != source:
                  rust.write_text(changed)
          PY
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit generated palette support
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock crates
          if ! git diff --cached --quiet; then
            git commit -m 'Generate entity type protocol palette in schema v8'
            git push origin HEAD:agent/finish-rom-core
          fi

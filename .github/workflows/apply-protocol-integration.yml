name: Apply protocol integration

on:
  push:
    branches:
      - feature/integrate-protocol-session

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/integrate-protocol-session
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply integration transform
        run: python3 tools/apply_protocol_integration.py
      - name: Validate
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit integrated runtime
        run: |
          rm tools/apply_protocol_integration.py
          rm .github/workflows/apply-protocol-integration.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Integrate protocol state machine into server runtime"
          git push origin HEAD:feature/integrate-protocol-session

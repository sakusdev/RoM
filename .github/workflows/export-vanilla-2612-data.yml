name: Export vanilla 26.1.2 data

on:
  push:
    branches:
      - feature/registry-data-26-1-2
  pull_request:
    branches:
      - master

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Generate data from the official server jar
        run: |
          curl --fail --location --retry 3 \
            --output server-26.1.2.jar \
            https://piston-data.mojang.com/v1/objects/97ccd4c0ed3f81bbb7bfacddd1090b0c56f9bc51/server.jar
          echo '97ccd4c0ed3f81bbb7bfacddd1090b0c56f9bc51  server-26.1.2.jar' | sha1sum --check
          java -DbundlerMainClass=net.minecraft.data.Main -jar server-26.1.2.jar --server --reports
      - uses: actions/upload-artifact@v4
        with:
          name: vanilla-26.1.2-generated
          path: generated
          if-no-files-found: error

name: Export vanilla 26.1.2 data

on:
  push:
    branches:
      - feature/registry-data-26-1-2

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Shonz1/Void.Data
          ref: 558963cb16c4042260259f61bb1a59b471e92603
          path: vanilla-data
      - uses: actions/upload-artifact@v4
        with:
          name: vanilla-26.1.2-data
          path: vanilla-data/Void.Data/Resources/26.1.2
          if-no-files-found: error

name: Diagnose core compilation

on:
  pull_request:
    branches: [master]

jobs:
  diagnose:
    if: github.head_ref == 'agent/finish-rom-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-rom-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply integration transformation
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import textwrap

          lines = Path('.github/workflows/finish-core.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if "python - <<'PY'" in line)
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(lines[start + 1:end]))
          exec(compile(script, 'finish-core-transform.py', 'exec'))
          PYCODE
          cargo fmt --all
      - name: Capture clippy
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log
      - name: Capture tests
        id: tests
        if: steps.clippy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test.log
      - uses: actions/upload-artifact@v4
        with:
          name: finish-core-diagnostics
          path: |
            clippy.log
            test.log
          if-no-files-found: ignore
      - name: Fail on diagnostics
        if: steps.clippy.outcome != 'success' || steps.tests.outcome == 'failure'
        run: exit 1

name: Capture finalized Play bootstrap diagnostics

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  capture:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'feature/rompack-play-bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rompack-play-bootstrap
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Replace the remaining fixed-floor test references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ferrum-server/src/play_runtime.rs')
          text = path.read_text(encoding='utf-8')
          old = 'MIN_PLAYER_FEET_Y'
          count = text.count(old)
          if count not in (0, 2):
              raise SystemExit(f'expected zero or two remaining fixed-floor references, found {count}')
          text = text.replace(old, 'f64::from(world.world_profile().floor_y) + 1.0')
          path.write_text(text, encoding='utf-8')
          PY
          rm -f play-bootstrap-validation.txt
          rm -f play-bootstrap-final-validation.txt
          cargo fmt --all
      - name: Capture validation diagnostics
        run: |
          set +e
          cargo fmt --all --check > play-bootstrap-final-validation.txt 2>&1
          fmt_status=$?
          cargo clippy --workspace --all-targets -- -D warnings >> play-bootstrap-final-validation.txt 2>&1
          clippy_status=$?
          cargo test --workspace >> play-bootstrap-final-validation.txt 2>&1
          test_status=$?
          printf '\nfmt_status=%s\nclippy_status=%s\ntest_status=%s\n' "$fmt_status" "$clippy_status" "$test_status" >> play-bootstrap-final-validation.txt
          exit 0
      - name: Commit source and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Stage final Play bootstrap validation"
          git push origin HEAD:feature/rompack-play-bootstrap

name: Finalize generated Play bootstrap metadata

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'feature/rompack-play-bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rompack-play-bootstrap
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Keep ChunkPos available only to tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ferrum-server/src/main.rs')
          text = path.read_text(encoding='utf-8')
          old = 'use ferrum_world::ChunkPos;\n'
          new = '#[cfg(test)]\nuse ferrum_world::ChunkPos;\n'
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one ChunkPos import, found {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f play-bootstrap-validation.txt
          rm -f play-bootstrap-final-validation.txt
          cargo fmt --all
      - name: Validate finalized workspace
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit finalized implementation
        run: |
          rm .github/workflows/apply-rompack-play-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize generated Play bootstrap metadata"
          git push origin HEAD:feature/rompack-play-bootstrap

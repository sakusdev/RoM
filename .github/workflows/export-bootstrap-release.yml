name: Export final release workflow

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'feature/bootstrap-release-bundles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bootstrap-release-bundles
      - name: Apply release patch
        run: python3 tools/apply_bootstrap_release_bundles.py
      - name: Copy release workflow
        run: cp .github/workflows/release.yml final-release.yml
      - uses: actions/upload-artifact@v4
        with:
          name: final-release-workflow
          path: final-release.yml
          retention-days: 1

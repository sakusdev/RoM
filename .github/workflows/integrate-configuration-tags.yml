name: Integrate configuration tag filtering

on:
  push:
    branches:
      - agent/complete-server-features

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/complete-server-features

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Integrate validated configuration tag filtering
        run: |
          git fetch origin hotfix/configuration-tag-registry-filter
          git checkout origin/hotfix/configuration-tag-registry-filter -- crates/ferrum-version-26-1-2/src/lib.rs
          rm -f .github/workflows/integrate-configuration-tags.yml

      - name: Validate
        run: |
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features

      - name: Commit validated source
        run: |
          git add -A
          git diff --cached --check
          git commit -m "Filter unsynchronized configuration tag registries"
          git push origin HEAD:agent/complete-server-features

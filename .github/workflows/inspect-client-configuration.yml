name: Inspect official client configuration handling

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'agent/finish-rom-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-rom-core
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Download and verify official 26.1.2 client JAR
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(curl -fsSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json)"
          version_url="$(jq -r '.versions[] | select(.id == "26.1.2") | .url' <<<"$manifest")"
          test -n "$version_url"
          version_json="$(curl -fsSL "$version_url")"
          client_url="$(jq -r '.downloads.client.url' <<<"$version_json")"
          client_sha1="$(jq -r '.downloads.client.sha1' <<<"$version_json")"
          curl -fsSL "$client_url" -o client.jar
          printf '%s  %s\n' "$client_sha1" client.jar | sha1sum -c -
          jar tf client.jar > client-class-list.txt
      - name: Disassemble client configuration handling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p client-configuration
          cp client-class-list.txt client-configuration/
          targets=(
            'net.minecraft.client.multiplayer.ClientConfigurationPacketListenerImpl'
            'net.minecraft.client.multiplayer.RegistryDataCollector'
            'net.minecraft.client.multiplayer.ClientPacketListener'
            'net.minecraft.tags.TagNetworkSerialization'
            'net.minecraft.resources.NetworkRegistryLoadTask'
            'net.minecraft.core.RegistrySynchronization'
          )
          : > client-configuration/class-status.tsv
          for target in "${targets[@]}"; do
            class_path="${target//./\/}.class"
            output="client-configuration/${target//[.$]/_}.txt"
            if grep -Fxq "$class_path" client-class-list.txt; then
              printf '%s\tNAMED\n' "$target" >> client-configuration/class-status.tsv
              javap -classpath client.jar -p -c -s -constants "$target" > "$output"
            else
              printf '%s\tMISSING\n' "$target" >> client-configuration/class-status.tsv
            fi
          done
          grep -Ei 'ClientConfigurationPacketListenerImpl|RegistryDataCollector|NetworkRegistryLoadTask|TagNetworkSerialization' client-class-list.txt > client-configuration/related-classes.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-26.1.2-client-configuration
          path: client-configuration
          if-no-files-found: error
          retention-days: 7

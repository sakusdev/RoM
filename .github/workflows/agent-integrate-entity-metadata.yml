name: Agent Integrate Entity Metadata

on:
  push:
    branches: [agent/item-entity-domain]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python .github/scripts/agent_integrate_entity_metadata.py
      - run: cargo fmt --all
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Commit validated entity metadata replication
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Replicate typed item and experience entity metadata"
          git push

name: Apply live Play shadow routing

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feature/live-play-shadow-routing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-play-shadow-routing
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - id: validate
        name: Apply and validate routing
        continue-on-error: true
        run: |
          set +e
          rm -f shadow-routing-validation.txt
          python3 tools/apply_live_play_shadow_routing.py > shadow-routing-validation.txt 2>&1
          patch_status=$?
          python3 tools/fix_live_play_shadow_routing.py >> shadow-routing-validation.txt 2>&1
          fix_status=$?
          cargo fmt --all >> shadow-routing-validation.txt 2>&1
          fmt_apply_status=$?
          cargo fmt --all --check >> shadow-routing-validation.txt 2>&1
          fmt_status=$?
          cargo clippy --workspace --all-targets -- -D warnings >> shadow-routing-validation.txt 2>&1
          clippy_status=$?
          cargo test --workspace >> shadow-routing-validation.txt 2>&1
          test_status=$?
          printf '\npatch_status=%s\nfix_status=%s\nfmt_apply_status=%s\nfmt_status=%s\nclippy_status=%s\ntest_status=%s\n' "$patch_status" "$fix_status" "$fmt_apply_status" "$fmt_status" "$clippy_status" "$test_status" >> shadow-routing-validation.txt
          test "$patch_status" -eq 0 -a "$fix_status" -eq 0 -a "$fmt_apply_status" -eq 0 -a "$fmt_status" -eq 0 -a "$clippy_status" -eq 0 -a "$test_status" -eq 0
      - name: Preserve current diagnostics
        if: steps.validate.outcome == 'failure'
        run: |
          git reset --hard HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shadow-routing-validation.txt
          git commit -m "Capture current live routing diagnostics"
          git push origin HEAD:feature/live-play-shadow-routing
          exit 1
      - name: Commit finalized routing
        if: steps.validate.outcome == 'success'
        run: |
          rm -f tools/apply_live_play_shadow_routing.py
          rm -f tools/fix_live_play_shadow_routing.py
          rm -f tools/fix_live_play_shadow_routing_clippy.py
          rm -f shadow-routing-validation.txt
          rm -f .github/workflows/diagnose-live-play-shadow-routing.yml
          rm .github/workflows/apply-live-play-shadow-routing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Route live Play inputs to shared runtime"
          git push origin HEAD:feature/live-play-shadow-routing

name: Apply live Play shadow routing

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feature/live-play-shadow-routing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-play-shadow-routing
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply and validate routing
        run: |
          python3 tools/apply_live_play_shadow_routing.py
          python3 tools/fix_live_play_shadow_routing.py
          rm -f tools/apply_live_play_shadow_routing.py
          rm -f tools/fix_live_play_shadow_routing.py
          rm -f tools/fix_live_play_shadow_routing_clippy.py
          rm -f shadow-routing-validation.txt
          rm -f .github/workflows/diagnose-live-play-shadow-routing.yml
          cargo fmt --all
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit finalized routing
        run: |
          rm .github/workflows/apply-live-play-shadow-routing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Route live Play inputs to shared runtime"
          git push origin HEAD:feature/live-play-shadow-routing

name: Fix inventory bootstrap ordering

on:
  push:
    branches:
      - feature/player-inventory-sync
    paths:
      - .github/workflows/agent-inventory-order-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/player-inventory-sync
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply and publish ordering fix
        shell: bash
        run: |
          set +e
          python - <<'PYCODE' >/tmp/order-fix.log 2>&1
          import base64
          import lzma
          payload = ''
          source = lzma.decompress(base64.b64decode(payload)).decode('utf-8')
          exec(compile(source, 'apply_inventory_order_fix.py', 'exec'))
          PYCODE
          status=$?
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$status" -ne 0 ]; then
            cp /tmp/order-fix.log .github/order-fix-error.txt
            git add .github/order-fix-error.txt
            git commit -m 'Record inventory ordering transform failure'
            git push origin HEAD:feature/player-inventory-sync
            exit "$status"
          fi
          cargo fmt --all
          git add crates Cargo.lock
          git commit -m 'Defer full inventory sync until Play bootstrap'
          git push origin HEAD:feature/player-inventory-sync

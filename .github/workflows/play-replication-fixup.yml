name: Play replication fixup

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.head_ref == 'feature/vanilla-play-replication' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vanilla-play-replication
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply live gameplay replication wiring
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/apply_live_game_replication.py
          cargo fmt --all
          git add crates/ferrum-game crates/ferrum-server
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Wire live gameplay replication"
          git push origin HEAD:feature/vanilla-play-replication

name: Capture Clippy diagnostics

on:
  pull_request:
    branches:
      - master
    types:
      - synchronize

permissions:
  contents: write

jobs:
  capture:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'feature/player-movement-and-chunk-view-26-1-2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/player-movement-and-chunk-view-26-1-2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture Clippy output
        run: |
          set +e
          cargo clippy --workspace --all-targets -- -D warnings > clippy-diagnostics.txt 2>&1
          status=$?
          echo "exit_status=$status" >> clippy-diagnostics.txt
          exit 0
      - name: Commit diagnostics and remove workflow
        run: |
          rm .github/workflows/capture-clippy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture Clippy diagnostics"
          git push origin HEAD:feature/player-movement-and-chunk-view-26-1-2

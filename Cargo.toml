[workspace]
members = [
    "crates/ferrum-model",
    "crates/ferrum-importer",
    "crates/ferrum-cli",
    "crates/ferrum-server",
    "crates/ferrum-runtime",
    "crates/ferrum-nbt",
    "crates/ferrum-protocol",
    "crates/ferrum-configuration",
    "crates/ferrum-play",
    "crates/ferrum-world",
    "crates/ferrum-game",
    "crates/ferrum-version-26-1-2",
    "crates/ferrum-rompack",
    "crates/rom-bootstrap",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
authors = ["Ferrum contributors"]
repository = "https://github.com/sakusdev/RoM"

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
ristretto_classfile = "0.31.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
sysinfo = "0.36.1"
thiserror = "2.0"
flate2 = "1.1.9"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

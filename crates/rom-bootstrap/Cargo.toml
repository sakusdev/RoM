[package]
name = "rom-bootstrap"
description = "Official-source bootstrapper and local instance manager for RoM"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "rom-bootstrap"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
ferrum-rompack = { path = "../ferrum-rompack" }
ferrum-version-26-1-2 = { path = "../ferrum-version-26-1-2" }
reqwest = { version = "0.12.22", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10.6"
sha2 = "0.10.9"
zip.workspace = true

[dev-dependencies]
tempfile = "3.20.0"
